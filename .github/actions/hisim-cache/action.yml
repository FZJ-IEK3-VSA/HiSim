name: HiSim inputs cache
description: >
  Restores and saves hisim/inputs/cache between workflow runs, so a job finds the weather series and
  LoadProfileGenerator profiles an earlier run computed instead of recomputing them from cold. Every
  entry in that directory is named by the hash of the configuration that produced it and carries a
  .meta file recording that configuration, so a restored entry is only ever used for the
  configuration it was computed for, and an entry nothing asks for is simply ignored. That is what
  makes it safe for every job to restore one cache shared by all of them.

  ONE SHARED CACHE. Every job of every workflow restores the most recent entry of one lineage (the
  key prefix ends in "-shared-"). Until 2026-10-18 each job restored and saved its own scope: about
  45 scopes, each stored once per branch and pull request, 11.6 GB in all against GitHub's 10 GB
  limit, so entries were evicted. Saving a shared entry from every job would still write one entry
  per job, each a different directory under its own content hash. So a job only records what it
  restored (mode restore), and after its work uploads the files it added as a short-lived artifact
  (mode upload-new). One merge job per workflow run (mode merge-save; needs every job that uses the
  cache, if: always()) restores the then most recent shared entry, unpacks every job's additions into
  it and saves one entry under the hash of the merged content, or nothing when the content did not
  change. A workflow with a single job that uses the cache saves its own additions the same way in
  that job (mode save), without an artifact. Restoring the most recent entry at save time, rather
  than the one the jobs started from, is what keeps the additions of workflows that run at the same
  time: each merges into what the other saved. Two merges a few seconds apart can still drop one
  side's additions; the next run that needs them adds them again.

  THE LOADPROFILEGENERATOR BINARIES (pylpg/<release>/ below the cache, 152 MB) are kept in the shared
  entry only for a release the job's image does not ship. The CI test image installs them below
  HISIM_LPG_BINARY_ROOT (Dockerfile.test); where that holds pylpg/<release>'s release, the copy in
  the cache is dropped from the additions and from the merged entry. So a cache saved before the
  image shipped them keeps them, and the first merge in an image that ships them drops them.
  pylpg_work/ (calculation directories) and unfinished installs are never kept.

  A pull request from a fork only restores: it uploads and saves nothing.

  THE WEEKLY COLD RUN (weekly-cold-cache.yml) calls tests.yml, golden-check.yml and golden-year.yml
  with cold_cache: true. Their jobs skip the restore, so each computes everything from scratch and
  uploads all of it; their own merge jobs are skipped, and the caller's merge job saves the union.
  When all three workflows succeeded it does so with fresh: 'true', not merged into the old entry, so
  that entry, the most recent one, replaces what the week accumulated; otherwise a share may be
  incomplete, and it merges the union into the most recent entry like any other run.

  What the name of an entry does not cover is the code that computed it. A job that finds its
  weather series and profiles already computed does not exercise the reader or the generator that
  would have computed them, so an edit to those is first exercised by a run whose entries are
  missing. Deleting the repository's caches (Actions > Caches) forces that run.

  The LoadProfileGenerator is the reason this exists. Eleven of the twenty-two system setups run it
  locally, seven workflows run those setups, and the generator's own sqlite writes are flaky on a slow
  runner. A profile it computed once does not have to be computed again, and a profile that is not
  computed cannot fail.

inputs:
  mode:
    description: >
      'restore' before the job's work: restores the most recent shared entry and records which files
      it held. 'upload-new' after the work, with if: always(): uploads the files the job added since
      the restore as the artifact hisim-inputs-cache-additions-<scope> (kept one day). 'merge-save' in
      the workflow's merge job (needs every job that uploads, if: always()): restores the most recent
      shared entry, unpacks every additions artifact of this run into it and saves the result.
      'save' in a workflow whose only cache user is this one job, with if: always(), in place of
      upload-new and a merge job: merges this job's own additions into the most recent shared entry
      and saves the result. A run that failed after computing entries keeps them; a run that failed
      inside the generator produced none, so there is nothing wrong to keep either way.
    required: true
  scope:
    description: >
      Required for upload-new, ignored otherwise: what distinguishes this job from the other jobs of
      the run that upload additions -- its matrix cell, typically. It names the artifact, so it must be
      unique within the run.
    required: false
    default: ""
  fresh:
    description: >
      For merge-save and save: 'true' saves only this run's additions, without merging them into the
      most recent shared entry. The weekly cold run sets it when all of its workflows succeeded, so
      its complete, freshly computed cache replaces the accumulated one.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check the mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        SCOPE: ${{ inputs.scope }}
      run: |
        case "$MODE" in
          restore|upload-new|merge-save|save) ;;
          *) echo "::error::hisim-cache: mode must be 'restore', 'upload-new', 'merge-save' or 'save', got '$MODE'"; exit 1 ;;
        esac
        if [ "$MODE" = upload-new ] && [ -z "$SCOPE" ]; then
          echo "::error::hisim-cache: mode 'upload-new' needs a scope, which names this job's artifact"
          exit 1
        fi

    - name: Derive the cache key
      id: key
      shell: bash
      env:
        FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        SCOPE: ${{ inputs.scope }}
      run: |
        # A key names one state of the directory: the layout version (bump it to abandon every
        # existing cache; 2 is the shared lineage, 1 was one lineage per job), the runner OS, the
        # scheme (a hash of the files that decide how an entry is named and validated; when they
        # change, a fresh lineage starts rather than a growing archive of entries under names nothing
        # will ask for again), "shared", and a hash of the directory's content, computed when saving.
        # The restore asks for a key no save ever writes, so it always falls through to the prefix
        # and gets the most recent shared entry.
        layout=2
        scheme="$(cat hisim/utils.py hisim/caching/*.py | sha256sum | cut -c1-12)"
        prefix="hisim-inputs-cache-${layout}-${RUNNER_OS}-${scheme}-shared-"
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "restore_key=${prefix}latest" >> "$GITHUB_OUTPUT"
        # Where this job keeps the list of restored files and the archive of its additions.
        echo "work=${RUNNER_TEMP}/hisim-inputs-cache" >> "$GITHUB_OUTPUT"
        echo "artifact=hisim-inputs-cache-additions-$(printf '%s' "$SCOPE" | tr -c 'A-Za-z0-9_.-' '_')" >> "$GITHUB_OUTPUT"
        if [ "$FORK" = "true" ]; then
          echo "writes=false" >> "$GITHUB_OUTPUT"
        else
          echo "writes=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore the most recent shared cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: hisim/inputs/cache
        key: ${{ steps.key.outputs.restore_key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Record which files the restored cache holds
      if: inputs.mode == 'restore'
      shell: bash
      env:
        WORK: ${{ steps.key.outputs.work }}
      run: |
        # The baseline upload-new and save compare against: a file not listed here was added by this job.
        mkdir -p "$WORK"
        if [ -d hisim/inputs/cache ]; then
          (cd hisim/inputs/cache && find . -type f | LC_ALL=C sort) > "$WORK/restored.txt"
        else
          : > "$WORK/restored.txt"
        fi
        echo "Restored $(wc -l < "$WORK/restored.txt") files."

    - name: Pack the files this job added
      id: additions
      if: steps.key.outputs.writes == 'true' && (inputs.mode == 'upload-new' || inputs.mode == 'save')
      shell: bash
      env:
        WORK: ${{ steps.key.outputs.work }}
      run: |
        # Every file below the cache that the restore did not bring (all of them when nothing was
        # restored), less what is never kept: calculation directories (pylpg_work/), unfinished
        # binary installs (pylpg/.<release>.*.partial) and the binaries of a release this image
        # ships below HISIM_LPG_BINARY_ROOT.
        mkdir -p "$WORK"
        rm -f "$WORK/additions.tar" "$WORK/additions.txt"
        [ -f "$WORK/restored.txt" ] || : > "$WORK/restored.txt"
        if [ -d hisim/inputs/cache ]; then
          (cd hisim/inputs/cache && find . -type f | LC_ALL=C sort) \
            | LC_ALL=C comm -13 "$WORK/restored.txt" - \
            | grep -v -e '^\./pylpg_work/' -e '^\./pylpg/\.' > "$WORK/additions.txt" || true
          if [ -n "${HISIM_LPG_BINARY_ROOT:-}" ]; then
            for release_directory in hisim/inputs/cache/pylpg/*/; do
              [ -d "$release_directory" ] || continue
              release="$(basename "$release_directory")"
              if [ -f "$HISIM_LPG_BINARY_ROOT/$release/LPG_linux/simengine2" ]; then
                grep -v -F "./pylpg/$release/" "$WORK/additions.txt" > "$WORK/additions.kept" || true
                mv "$WORK/additions.kept" "$WORK/additions.txt"
              fi
            done
          fi
        else
          : > "$WORK/additions.txt"
        fi
        count="$(wc -l < "$WORK/additions.txt")"
        echo "This job added ${count} files to the cache."
        if [ "$count" -gt 0 ]; then
          tar -cf "$WORK/additions.tar" -C hisim/inputs/cache -T "$WORK/additions.txt"
          echo "has_additions=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_additions=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload the files this job added
      if: inputs.mode == 'upload-new' && steps.additions.outputs.has_additions == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.key.outputs.artifact }}
        path: ${{ steps.key.outputs.work }}/additions.tar
        # Read once, by this run's merge job; a re-run of the job replaces its earlier upload.
        retention-days: 1
        overwrite: true
        if-no-files-found: error

    # save and merge-save start from the most recent shared entry, not from the job's own directory,
    # whose additions are packed above: another workflow may have saved since this job restored.
    - name: Clear the directory for the most recent shared cache
      if: steps.key.outputs.writes == 'true' && (inputs.mode == 'save' || inputs.mode == 'merge-save')
      shell: bash
      run: rm -rf hisim/inputs/cache

    - name: Restore the most recent shared cache to merge into
      id: latest
      if: >-
        steps.key.outputs.writes == 'true' && inputs.fresh != 'true'
        && (inputs.mode == 'save' || inputs.mode == 'merge-save')
      uses: actions/cache/restore@v4
      with:
        path: hisim/inputs/cache
        key: ${{ steps.key.outputs.restore_key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    # No artifact at all is the normal case of a run whose jobs found everything in the cache. A
    # failed download only loses additions the next run adds again, except under fresh: see below.
    - name: Download the files every job of this run added
      id: download
      if: steps.key.outputs.writes == 'true' && inputs.mode == 'merge-save'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: hisim-inputs-cache-additions-*
        path: ${{ steps.key.outputs.work }}/artifacts

    - name: Merge the additions and derive the key of the result
      id: merged
      if: steps.key.outputs.writes == 'true' && (inputs.mode == 'save' || inputs.mode == 'merge-save')
      shell: bash
      env:
        WORK: ${{ steps.key.outputs.work }}
        PREFIX: ${{ steps.key.outputs.prefix }}
        MATCHED: ${{ steps.latest.outputs.cache-matched-key }}
        FRESH: ${{ inputs.fresh }}
        DOWNLOAD: ${{ steps.download.outcome }}
      run: |
        # Under fresh nothing was restored, so what a failed download missed would be missing from
        # the new most recent entry, not just from this run's additions: save nothing instead.
        if [ "$FRESH" = "true" ] && [ "$DOWNLOAD" = "failure" ]; then
          echo "::error::hisim-cache: the additions of this run could not all be downloaded; the fresh cache is not saved."
          exit 1
        fi
        mkdir -p hisim/inputs/cache "$WORK"
        archives=0
        while IFS= read -r -d '' archive; do
          # An entry is content-keyed, so a file both sides have is the same file: keep the one there.
          tar -xf "$archive" -C hisim/inputs/cache --skip-old-files
          archives=$((archives + 1))
        done < <(find "$WORK" -name '*.tar' -type f -print0 | LC_ALL=C sort -z)
        echo "Merged ${archives} archives of additions into the most recent shared cache (${MATCHED:-none})."
        # What is never kept, also when an older entry still holds it: see the description.
        rm -rf hisim/inputs/cache/pylpg_work hisim/inputs/cache/pylpg/.[!.]*
        if [ -n "${HISIM_LPG_BINARY_ROOT:-}" ]; then
          for release_directory in hisim/inputs/cache/pylpg/*/; do
            [ -d "$release_directory" ] || continue
            release="$(basename "$release_directory")"
            if [ -f "$HISIM_LPG_BINARY_ROOT/$release/LPG_linux/simengine2" ]; then
              echo "Dropping pylpg/${release}: this image ships it below ${HISIM_LPG_BINARY_ROOT}."
              rm -rf "$release_directory"
            fi
          done
        fi
        # An empty directory is not saved: it would become the most recent entry and hide the full
        # one before it. Unchanged content gives the key that was restored, and nothing is saved.
        if [ -z "$(find hisim/inputs/cache -type f -print -quit)" ]; then
          echo "The merged cache is empty; nothing is saved."
          echo "save=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        content="$(find hisim/inputs/cache -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)"
        key="${PREFIX}${content}"
        echo "key=${key}" >> "$GITHUB_OUTPUT"
        if [ "$key" = "$MATCHED" ]; then
          echo "The merged cache equals the restored entry ${MATCHED}; nothing is saved."
          echo "save=false" >> "$GITHUB_OUTPUT"
        else
          echo "Saving the merged cache as ${key} ($(du -sh hisim/inputs/cache | cut -f1))."
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save the merged cache as the most recent shared entry
      if: steps.merged.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: hisim/inputs/cache
        key: ${{ steps.merged.outputs.key }}
