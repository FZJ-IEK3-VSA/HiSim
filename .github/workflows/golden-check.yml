# Tier 1 of the golden-reference gate: re-runs the short (one-week) pairs on every
# PR and push to main, comparing KPIs against the committed golden references, first
# from the Python setups and then from their recorded '.energy_system.yaml' twins.
#
# SHARDS. The pairs run as a handful of shards (scripts/golden_matrix.py --shards), each
# job running its pairs several at a time (golden_check.py --jobs, a child process per
# pair). One job per pair paid about a minute of container, checkout, install and cache
# save for 6 to 250 s of simulation, used one of four cores, and queued the pull request
# behind 44 such jobs on the organisation's 20 slots. How many pairs a job runs at once
# is set by memory (PAIRS_AT_ONCE in golden_matrix.py); how the pairs are spread over the
# shards is set by their measured durations ('seconds' in golden_config.json).
#
# THE YAML TWIN (formerly its own workflow, golden-yaml-check; AC-P3.2). Beside each Python
# setup, in the same pool of child processes (golden_check.py --mode both), the job runs
# its recorded twin through the declarative executor with the *same* parameters, and
# compares its KPIs against the same committed golden references. Each mode keeps its own
# report (results/golden-ref-check/ and results/golden-ref-check-yaml/), and both are
# always reported. Running the two side by side rather than one mode after the other is
# what keeps a shard near five minutes: its wall time is its longest pair, not twice that. That proves the declarative path reproduces the setups it
# was recorded from; together with the energy-system freshness gate (the twins are what
# recording produces) it is what lets the golden suites run on files. The oracle is the
# KPI set, deliberately: the legacy and declarative paths name aggregator result columns
# differently (C-P3.2 of the P3 requirements), so comparing result columns by name would
# need the parity rig's renaming table. Do not "fix" this by comparing CSVs. One KPI
# family carries a port name itself — the energy-management system's "Priority for
# Input_..." — and is excluded from both sides in YAML mode (PORT_NAMED_KPIS in
# golden_check.py, printed per pair); the parity rig compares that family exactly.
#
# THE COMPOSED FILES (assemblies_spec.md §13 step 4). In the same pool (golden_check.py --mode
# all), every pair whose setup has a composed file -- energy_systems/<stem>.composed.energy_system.yaml,
# the site plus imports of energy_systems/assemblies/, listed in hisim/energy_system/assemblies/twins.py --
# runs that file too, its KPIs renamed to the twin's names by the table's rename map, against the same
# golden: the assemblies reproduce the Python setup. Its report is results/golden-ref-check-composed/;
# a setup without a composed file is listed there as skipped. The "Priority for" family is compared,
# not excluded: the golden's legacy port names are read through the parity rig's declared table.
#
# Gate: BLOCKING. Any KPI divergence or run error, in any mode, fails its shard and the
# summary job.
#
# The heavier full-year pairs run separately, in golden-year.yml, which starts at the same
# time as this workflow and does not wait for it.

name: golden-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Runnable by hand as well, because the two automatic triggers above only fire for pull
  # requests that target main. A stacked pull request — one whose base is the branch below it
  # in a chain — therefore gets no run at all, and a whole stack can reach main having never
  # been tested. Dispatching this workflow against such a branch is how that is avoided.
  # A dispatch can also choose the full year, for a heavier parity run of both modes.
  workflow_dispatch:
    inputs:
      horizon:
        description: "Parameter horizon to check (the Python setups, their recorded YAML twins and the composed files)"
        type: choice
        default: week
        options: [ week, year ]
  # Called by weekly-cold-cache.yml, the weekly run without any cache; see there.
  workflow_call:
    inputs:
      cold_cache:
        description: "Skip the inputs-cache restore, so every job computes its inputs from scratch, and leave the save to the caller"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  # The weekly cold run (cold_cache) has a group of its own, so it neither waits for nor cancels a push's run.
  group: golden-check-${{ github.ref }}${{ inputs.cold_cache && '-cold' || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  discover:
    name: discover golden shards
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
      - id: gen
        # week for automatic triggers; the chosen horizon for a manual dispatch.
        # golden_matrix.py is stdlib-only, so no dependency install is needed here.
        env:
          HORIZON: ${{ inputs.horizon || 'week' }}
        run: |
          echo "horizon=$HORIZON"
          matrix="$(python3 scripts/golden_matrix.py --horizon "$HORIZON" --shards 4 --with-yaml --with-composed)"
          echo "$matrix" | python3 -m json.tool
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report

  golden:
    name: golden ${{ matrix.name }} (${{ matrix.count }} pairs)
    needs: discover
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      # Space-separated setup:param tokens, split on purpose where they are used. Passed
      # through the environment rather than interpolated into the scripts.
      PAIRS: ${{ matrix.pairs }}
      JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
          scope: ${{ matrix.name }}
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install HiSim package
        run: uv pip install --system -e .
      # The weather series and LoadProfileGenerator profiles earlier runs computed: the most recent
      # shared entry, which every job of every workflow restores; see the action.
      - name: Restore the HiSim inputs cache
        if: ${{ !inputs.cold_cache }}
        uses: ./.github/actions/hisim-cache
        with:
          mode: restore
      # All three modes from one pool of `jobs` child processes: each pair's Python setup, its
      # YAML twin and, where it has one, its composed file run side by side. One report per
      # mode; a failure in any fails the step.
      - name: Golden KPI check (Python setups, recorded YAML twins and composed files)
        run: |
          # shellcheck disable=SC2086  # PAIRS is split into one argument per pair on purpose
          python scripts/golden_check.py --mode all --jobs "$JOBS" --pairs $PAIRS
      # Failure-only: a passing check needs no annotation, and the artifact carries the
      # detail when it fails. It holds every mode's report (golden-ref-check/ is the Python
      # run, golden-ref-check-yaml/ the twins, golden-ref-check-composed/ the composed files)
      # and every child's log.
      - name: Upload deviation report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-report-${{ matrix.name }}
          path: |
            results/golden-ref-check*/report.*
            results/golden-ref-check*/_children/*.log
          if-no-files-found: warn
      # Only the files this job added, for the merge job below. Kept even when the job failed; see
      # the action for why that is safe.
      - name: Upload what this job added to the HiSim inputs cache
        if: always()
        uses: ./.github/actions/hisim-cache
        with:
          mode: upload-new
          # Prefixed with the workflow: the weekly cold run calls three workflows in one run, and an
          # artifact name must be unique within it.
          scope: golden-check-${{ matrix.name }}
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report
          scope: ${{ matrix.name }}

  # One shared inputs-cache entry per run instead of one per job: merges what every golden job added
  # into the most recent shared entry and saves it, or nothing when nothing changed; see the action.
  # Not for a fork's pull request, which saves no cache, nor for the weekly cold run, whose caller saves.
  inputs-cache:
    name: merge the inputs cache
    needs: golden
    if: always() && !github.event.pull_request.head.repo.fork && !inputs.cold_cache
    # On the self-hosted runners, and in the image of the jobs it merges, whose HISIM_LPG_BINARY_ROOT
    # decides whether the LoadProfileGenerator binaries stay in the cache.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
      - name: Merge and save the HiSim inputs cache
        uses: ./.github/actions/hisim-cache
        with:
          mode: merge-save
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report

  summary:
    name: golden-check summary
    needs: golden
    if: always()
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    steps:
      - name: Fail if any pair diverged or failed to run, in any mode
        run: '[ "${{ needs.golden.result }}" = "success" ] || exit 1'
