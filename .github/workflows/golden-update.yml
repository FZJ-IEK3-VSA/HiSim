# Manual "bless" of the golden KPI references. Re-runs EVERY pair (both the week
# and full-year horizons) in the CI container — so the reference environment
# matches the check environment — and opens a pull request with the updated
# golden_references/ for review. This is the only sanctioned way to update goldens.
#
# The bless is sticky: a KPI whose fresh value the gate itself would still accept
# keeps the value already committed, and a golden that comes out identical is not
# rewritten, so the PR diff carries only what actually moved. When nothing moved at
# all, the diff is the manifest alone. Nothing is ever dropped: a KPI the run no
# longer produces stays in its golden and the gate goes on reporting it as missing.
# The force_rewrite input dumps the fresh values verbatim instead — the way to clear
# accumulated noise, to retire a KPI, and to repair an unreadable golden.
#
# The pairs run in shards, like the gates' (golden_matrix.py --shards 4 cuts each horizon
# into four): four week pairs or two full-year pairs at once per job, as memory allows.

name: golden-update

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you re-blessing the goldens?"
        required: true
        default: "intentional simulation-output change"
      force_rewrite:
        description: "Overwrite every stored value with the fresh one, dropping KPIs the runs no longer produce."
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  discover:
    name: discover all shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
      - id: gen
        run: echo "matrix=$(python3 scripts/golden_matrix.py --shards 4)" >> "$GITHUB_OUTPUT"
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report

  update:
    name: regenerate ${{ matrix.name }} (${{ matrix.count }} pairs)
    needs: discover
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      # Space-separated setup:param tokens, split on purpose where they are used.
      PAIRS: ${{ matrix.pairs }}
      JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
          scope: ${{ matrix.name }}
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install HiSim package
        run: uv pip install --system -e .
      - name: Regenerate the goldens of this shard
        env:
          FORCE: ${{ inputs.force_rewrite && '--force-rewrite' || '' }}
        run: |
          # shellcheck disable=SC2086  # PAIRS and FORCE are split into arguments on purpose
          python scripts/golden_update.py --jobs "$JOBS" --pairs $PAIRS $FORCE
      # Exactly this shard's files: the checkout holds every other golden too, unchanged, and
      # collect merges all artifacts into one directory, so an unchanged copy uploaded here
      # could overwrite the fresh one another shard produced.
      - name: List this shard's goldens
        id: files
        run: |
          {
            echo "paths<<EOF"
            for pair in $PAIRS; do echo "golden_references/${pair%%:*}__${pair#*:}.json"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload regenerated goldens
        uses: actions/upload-artifact@v7
        with:
          name: golden-${{ matrix.name }}
          path: ${{ steps.files.outputs.paths }}
          if-no-files-found: error
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report
          scope: ${{ matrix.name }}

  collect:
    name: assemble goldens and open PR
    needs: update
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download all regenerated goldens
        uses: actions/download-artifact@v8
        with:
          pattern: golden-*
          # upload-artifact strips the common leading dir, so each artifact holds a bare
          # "<pair>.json" — download straight into golden_references/ to restore the layout.
          path: golden_references
          merge-multiple: true
      - name: Verify goldens landed
        run: |
          count=$(find golden_references -maxdepth 1 -name '*.json' ! -name manifest.json | wc -l)
          echo "Downloaded $count golden reference file(s) into golden_references/."
          if [ "$count" -eq 0 ]; then
            echo "::error::No golden reference files were downloaded — refusing to open an empty bless PR."
            exit 1
          fi
      - name: Install HiSim package
        run: uv pip install --system -e .
      - name: (Re)write manifest
        run: python scripts/golden_update.py --manifest-only
      - name: Open bless PR
        # The CI container has no `gh` CLI, so the PR is created via the GitHub REST API
        # with stdlib urllib. The workflow input is passed through the environment (never
        # interpolated into the script body) so it cannot break out of the JSON/shell.
        env:
          PR_REPO: ${{ github.repository }}
          PR_BASE: ${{ github.ref_name }}
          PR_REASON: ${{ github.event.inputs.reason }}
          PR_FORCED: ${{ inputs.force_rewrite }}
        run: |
          branch="bless/golden-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add golden_references/
          if git diff --cached --quiet; then
            echo "No golden changes to bless — nothing to do."
            exit 0
          fi
          git commit -m "bless golden references: ${{ github.event.inputs.reason }}"
          git push origin "$branch"
          PR_HEAD="$branch" python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["PR_REPO"]
          forced = os.environ.get("PR_FORCED", "false") == "true"
          how = (
              "This bless was FORCED (--force-rewrite): every value was overwritten with\n"
              "the fresh one and any KPI the runs no longer produce was dropped.\n\n"
              if forced
              else
              "Only KPIs that moved beyond the gate's tolerance were rewritten, so a\n"
              "manifest-only diff means every value reproduced within the gate's tolerance.\n\n"
              "Any key the per-pair logs list as absent is still in its golden file: a bless\n"
              "never removes a KPI, so the gate keeps reporting it as missing until someone\n"
              "retires it deliberately by re-running this workflow with force_rewrite.\n\n"
          )
          body = (
              "Re-ran the golden KPI references in the CI container.\n\n"
              f"Reason: {os.environ['PR_REASON']}\n\n"
              f"{how}"
              "Review the per-KPI diff before merging."
          )
          payload = json.dumps({
              "title": "Bless golden references",
              "head": os.environ["PR_HEAD"],
              "base": os.environ["PR_BASE"],
              "body": body,
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("Opened PR:", json.load(resp).get("html_url"))
          except urllib.error.HTTPError as exc:  # surface the API error body, not just a code
              raise SystemExit(f"PR creation failed ({exc.code}): {exc.read().decode()}")
          PY
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report
