# Manual "bless" of the golden KPI references. Re-runs EVERY pair (both the week
# and full-year horizons) in the CI container — so the reference environment
# matches the check environment — and opens a pull request with the updated
# golden_references/ for review. This is the only sanctioned way to update goldens.
#
# The bless is sticky: a KPI whose fresh value the gate itself would still accept
# keeps the value already committed, and a golden that comes out identical is not
# rewritten, so the PR diff carries only what actually moved. When nothing moved at
# all, the diff is the manifest alone. Nothing is ever dropped: a KPI the run no
# longer produces stays in its golden and the gate goes on reporting it as missing.
# The force_rewrite input dumps the fresh values verbatim instead — the way to clear
# accumulated noise, to retire a KPI, and to repair an unreadable golden.
#
# A bless regenerates the Python setups' goldens only, every pair of golden_config.json in both
# horizons: 22 week and 22 full-year pairs. The YAML twins and the composed files have no goldens
# of their own; the gates hold them to the Python setup's.
#
# ONE JOB PER FULL-YEAR PAIR, THE WEEK PAIRS IN FOUR SHARDS (golden_matrix.py --shards 4
# --one-pair-per-job year; owner decision 2026-10-15, as golden-year.yml has had since #1005).
# The bless used to cut each horizon into four shards, two full-year pairs at once per job, and
# then took as long as its busiest full-year shard: on the self-hosted runners on 2026-10-15 the
# full-year shards of four to eight pairs took 12 to 17 minutes and the bless 26 minutes from
# dispatch to PR. Now every full-year pair is a job of its own, run in-process (golden_update.py
# --jobs 1), so the regenerate phase takes about its slowest single pair: the heaviest recorded in
# golden_config.json "seconds" are 690 s (heat pump with car) and 623 s (heat pump with solar
# thermal), and the first bless in this layout (2026-10-15) took 0.7 to 11.1 minutes per
# full-year job, the heat pump with solar thermal the longest. The week pairs stay in four shards
# of four pairs at once: they weigh 5 to 254 s each, the shards 140 to 254 s of busiest lane, and
# a week shard took 4 to 5 minutes, well inside the slowest full-year job. A job per week pair
# would not shorten the bless and would pay 18 more container starts, checkouts and installs of
# about a minute each. That makes 26 regenerate jobs on the 56 runners, the full-year jobs listed
# first and heaviest first. The price is runner time: a job per full-year pair pays its own start
# and no longer shares a runner with a second pair, about 140 runner-minutes per bless against
# about 80 in shards. Each job uploads exactly its own goldens under a name of its own
# (golden-<cell name>); collect merges them all and checks that every pair's file arrived.
#
# TIMEOUTS. A hung simulation must not hold a runner until GitHub's six-hour default. A full-year
# job runs its one pair in-process, so the job's own limit is the guard: 30 minutes, as in
# golden-year.yml, almost three times the slowest full-year job measured (11 minutes). The same
# limit fits the week shards (4 to 5 minutes), whose pairs also run in child processes that are
# each killed after three times their recorded seconds (scripts/runner.py,
# ChildRuns.timeout_in_seconds).

name: golden-update

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you re-blessing the goldens?"
        required: true
        default: "intentional simulation-output change"
      force_rewrite:
        description: "Overwrite every stored value with the fresh one, dropping KPIs the runs no longer produce."
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  discover:
    name: discover all pairs
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
      # golden_matrix.py is stdlib-only, so no dependency install is needed here.
      - name: Build the bless matrix
        id: gen
        run: |
          matrix="$(python3 scripts/golden_matrix.py --shards 4 --one-pair-per-job year)"
          echo "$matrix" | python3 -m json.tool
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report

  update:
    name: regenerate ${{ matrix.name }} (${{ matrix.count }} pairs)
    needs: discover
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    # See TIMEOUTS above: almost three times the slowest full-year job measured (11 minutes).
    timeout-minutes: 30
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      # Space-separated setup:param tokens (one for a full-year job), split on purpose where they
      # are used.
      PAIRS: ${{ matrix.pairs }}
      JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
          scope: ${{ matrix.name }}
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install HiSim package
        run: uv pip install --system -e .
      - name: Regenerate the goldens of this job
        env:
          FORCE: ${{ inputs.force_rewrite && '--force-rewrite' || '' }}
        run: |
          # shellcheck disable=SC2086  # PAIRS and FORCE are split into arguments on purpose
          python scripts/golden_update.py --jobs "$JOBS" --pairs $PAIRS $FORCE
      # Exactly this job's files: the checkout holds every other golden too, unchanged, and
      # collect merges all artifacts into one directory, so an unchanged copy uploaded here
      # could overwrite the fresh one another job produced.
      - name: List this job's goldens
        id: files
        run: |
          {
            echo "paths<<EOF"
            for pair in $PAIRS; do echo "golden_references/${pair%%:*}__${pair#*:}.json"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload regenerated goldens
        uses: actions/upload-artifact@v7
        with:
          name: golden-${{ matrix.name }}
          path: ${{ steps.files.outputs.paths }}
          if-no-files-found: error
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report
          scope: ${{ matrix.name }}

  collect:
    name: assemble goldens and open PR
    needs: [discover, update]
    # Runs after a failed regenerate job too, but only to fail itself in its first step: a bless
    # PR must carry every pair's fresh golden or none.
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # needs.update.result is 'success' only when every one of its matrix jobs succeeded.
      - name: Fail if a regenerate job failed or did not run
        env:
          UPDATE_RESULT: ${{ needs.update.result }}
        run: |
          if [ "$UPDATE_RESULT" != "success" ]; then
            echo "::error::A regenerate job ended '$UPDATE_RESULT' — refusing to open a bless PR without every pair's golden."
            exit 1
          fi
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download all regenerated goldens
        uses: actions/download-artifact@v8
        with:
          pattern: golden-*
          # upload-artifact strips the common leading dir, so each artifact holds a bare
          # "<pair>.json". They land beside the checkout's goldens first, so the next step can
          # tell what arrived from what was committed.
          path: regenerated
          merge-multiple: true
      # Every pair the matrix listed must have come back, and nothing else: a missing file would
      # leave its committed golden in the PR as if it had been blessed.
      - name: Verify every pair's golden landed
        env:
          MATRIX: ${{ needs.discover.outputs.matrix }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          cells = json.loads(os.environ["MATRIX"])["include"]
          expected = {token.replace(":", "__") + ".json" for cell in cells for token in cell["pairs"].split()}
          landed = {path.name for path in pathlib.Path("regenerated").glob("*.json")}
          print(f"Downloaded {len(landed)} golden reference file(s) of the {len(expected)} pairs blessed.")
          if landed != expected:
              print(
                  f"::error::Missing: {sorted(expected - landed)}; unexpected: {sorted(landed - expected)}"
                  " — refusing to open an incomplete bless PR."
              )
              sys.exit(1)
          PY
          cp regenerated/*.json golden_references/
      - name: Install HiSim package
        run: uv pip install --system -e .
      - name: (Re)write manifest
        run: python scripts/golden_update.py --manifest-only
      - name: Open bless PR
        # The CI container has no `gh` CLI, so the PR is created via the GitHub REST API
        # with stdlib urllib. The workflow input is passed through the environment (never
        # interpolated into the script body) so it cannot break out of the JSON/shell.
        env:
          PR_REPO: ${{ github.repository }}
          PR_BASE: ${{ github.ref_name }}
          PR_REASON: ${{ github.event.inputs.reason }}
          PR_FORCED: ${{ inputs.force_rewrite }}
        run: |
          branch="bless/golden-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add golden_references/
          if git diff --cached --quiet; then
            echo "No golden changes to bless — nothing to do."
            exit 0
          fi
          git commit -m "bless golden references: ${{ github.event.inputs.reason }}"
          git push origin "$branch"
          PR_HEAD="$branch" python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["PR_REPO"]
          forced = os.environ.get("PR_FORCED", "false") == "true"
          how = (
              "This bless was FORCED (--force-rewrite): every value was overwritten with\n"
              "the fresh one and any KPI the runs no longer produce was dropped.\n\n"
              if forced
              else
              "Only KPIs that moved beyond the gate's tolerance were rewritten, so a\n"
              "manifest-only diff means every value reproduced within the gate's tolerance.\n\n"
              "Any key the per-pair logs list as absent is still in its golden file: a bless\n"
              "never removes a KPI, so the gate keeps reporting it as missing until someone\n"
              "retires it deliberately by re-running this workflow with force_rewrite.\n\n"
          )
          body = (
              "Re-ran the golden KPI references in the CI container.\n\n"
              f"Reason: {os.environ['PR_REASON']}\n\n"
              f"{how}"
              "Review the per-KPI diff before merging."
          )
          payload = json.dumps({
              "title": "Bless golden references",
              "head": os.environ["PR_HEAD"],
              "base": os.environ["PR_BASE"],
              "body": body,
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("Opened PR:", json.load(resp).get("html_url"))
          except urllib.error.HTTPError as exc:  # surface the API error body, not just a code
              raise SystemExit(f"PR creation failed ({exc.code}): {exc.read().decode()}")
          PY
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report
