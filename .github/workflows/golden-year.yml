# Tier 2 of the golden-reference gate: the heavy full-year pairs, and the assembly nightly tier.
#
# IN PARALLEL WITH THE REST OF CI. This workflow starts on the same push or pull request as
# quality, tests and golden-check, on the self-hosted runners (see tests.yml), and reports as
# ordinary checks of the pull request. It used to wait until those three were green, so that
# the scarce GitHub-hosted runner slots were not spent on a commit a cheaper check had already
# failed; with 32 runners of our own that saving costs more wall time than it is worth. For the
# same reason a YAML twin that diverges from its golden in golden-check no longer keeps this
# tier from starting: both tiers run at once and both report (owner decision 2026-10-15,
# superseding that of 2026-09-27).
#
# THE FORK GUARD. A pull request from a fork never runs the full-year tier: the `discover` job
# is skipped for it, and every other job depends on that one. Fork pull requests still get
# tier 1 and everything below it; the full-year tier is for branches with push access.
#
# THE FULL-YEAR PAIRS run the Python setups and, beside each, where its setup has one, the
# composed file (golden_check.py --mode python composed, assemblies_spec.md §13 step 4): the
# assemblies reproduce the Python setup's full-year golden too. The matrix counts those runs
# (golden_matrix.py --with-composed). Every setup of golden_config.json runs the full year
# (owner decision 2026-10-11: the first week of January never runs a solar collector's pump,
# so only a year exercises the solar systems); a setup that cannot finish a year would keep a
# week-only 'horizons' entry until its bead is fixed.
#
# SHARDS. The pairs run as five shards, each running two simulations at once (golden_matrix.py
# --shards 5, golden_check.py --jobs 2, a child process per pair): a full-year pair peaks at
# about 6 GiB (the heaviest measured, the heat pump with solar thermal, at 5.2 GiB), so a 16 GB
# runner holds two at once. That is 22 Python pairs plus the composed files of the eight
# generator setups, 30 runs of about 98 runner-minutes in all; five shards keep the slowest
# near 15 to 16 minutes of simulation (the heat pump with solar thermal alone takes about 10).
# The weights the shards are balanced by are "seconds" in golden_config.json.
#
# THE ASSEMBLY NIGHTLY TIER (assemblies_spec.md §9.4, D24, lean v1 §13.1): the job
# `assemblies-nightly` runs `pytest -m nightly tests/assemblies/test_library_contracts.py`, the
# seeded Latin hypercube sample of every assembly's parameter box, beside the full-year pairs.
# The deterministic samples run in the `assemblies` shard of tests.yml. The libraries are the
# mock one under tests/assemblies/mock_assemblies/library and the real one,
# energy_systems/assemblies/. A failed check fails the job, named in pytest's summary; opening
# a bead for it, as for a golden drift, is the owner's manual step today.

name: golden-year

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Runnable by hand as well, because the two automatic triggers above only fire for pull
  # requests that target main; a stacked pull request is checked by dispatching this workflow.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: golden-year-${{ github.ref }}
  # Cancel superseded runs on feature branches, but let every push to main finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  discover:
    name: discover full-year shards
    # The fork guard (see the header): skipped for a pull request from a fork, and with it
    # every job below, since they all need this one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
      # golden_matrix.py is stdlib-only, so no dependency install is needed here.
      - name: Build the full-year matrix
        id: gen
        run: |
          matrix="$(python3 scripts/golden_matrix.py --horizon year --shards 5 --with-composed)"
          echo "$matrix" | python3 -m json.tool
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report

  golden-year:
    name: golden-year ${{ matrix.name }} (${{ matrix.count }} pairs)
    needs: discover
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      # Space-separated setup:param tokens, split on purpose where they are used. Passed
      # through the environment rather than interpolated into the script.
      PAIRS: ${{ matrix.pairs }}
      JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
          scope: ${{ matrix.name }}
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install HiSim package
        run: uv pip install --system -e .
      # The previous run's weather series and LoadProfileGenerator profiles; see the action.
      - name: Restore the HiSim inputs cache
        uses: ./.github/actions/hisim-cache
        with:
          mode: restore
          scope: ${{ github.workflow }}-${{ matrix.name }}
      - name: Golden KPI check (full year, Python setups and composed files)
        run: |
          # shellcheck disable=SC2086  # PAIRS is split into one argument per pair on purpose
          python scripts/golden_check.py --mode python composed --jobs "$JOBS" --pairs $PAIRS
      - name: Upload deviation report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-year-report-${{ matrix.name }}
          path: |
            results/golden-ref-check*/report.*
            results/golden-ref-check*/_children/*.log
          if-no-files-found: warn
      # Kept even when the job failed; see the action for why that is safe.
      - name: Save the HiSim inputs cache
        if: always()
        uses: ./.github/actions/hisim-cache
        with:
          mode: save
          scope: ${{ github.workflow }}-${{ matrix.name }}
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report
          scope: ${{ matrix.name }}

  assemblies-nightly:
    name: assemblies nightly tier
    # Needs `discover` only for its fork guard.
    needs: discover
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
          scope: assemblies-nightly
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install HiSim package
        run: uv pip install --system -e .
      # Every sample is one xdist_group, so loadgroup keeps the checks of one isolation run on
      # one worker, which makes the run once.
      - name: Assembly test contracts, nightly tier
        run: >-
          python -m pytest -m nightly -n 4 --dist loadgroup tests/assemblies/test_library_contracts.py
          --samples 16 --seed 20261003
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report
          scope: assemblies-nightly

  summary:
    name: golden-year summary
    needs: [discover, golden-year, assemblies-nightly]
    # Not for a fork's pull request, where the fork guard skipped everything above.
    if: always() && needs.discover.result != 'skipped'
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    steps:
      - name: Fail if a full-year pair or the nightly tier failed or did not run
        run: |
          echo "discover=${{ needs.discover.result }}  golden-year=${{ needs.golden-year.result }}  assemblies-nightly=${{ needs.assemblies-nightly.result }}"
          [ "${{ needs.golden-year.result }}" = "success" ] && [ "${{ needs.assemblies-nightly.result }}" = "success" ]
