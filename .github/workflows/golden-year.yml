# Tier 2 of the golden-reference gate: the heavy full-year pairs.
#
# BOTH STEP LENGTHS. The year horizon holds every parameter set built by the full_year factory, so
# every setup runs the year at 60 s (full_year_60s) and at 900 s (full_year_900s): RenoVisor's step
# length, and the only one at which the part-load rules and the start-of-step nodes act (above
# 600 s); see golden_references/README.md. A 900 s year has a fifteenth of the 60 s year's steps.
#
# IN PARALLEL WITH THE REST OF CI. This workflow starts on the same push or pull request as
# quality, tests and golden-check, on the self-hosted runners (see tests.yml), and reports as
# ordinary checks of the pull request. It used to wait until those three were green, so that
# the scarce GitHub-hosted runner slots were not spent on a commit a cheaper check had already
# failed; with 32 runners of our own that saving costs more wall time than it is worth. For the
# same reason a YAML twin that diverges from its golden in golden-check no longer keeps this
# tier from starting: both tiers run at once and both report (owner decision 2026-10-15,
# superseding that of 2026-09-27).
#
# THE FORK GUARD. A pull request from a fork never runs the full-year tier: the `discover` job
# is skipped for it, and every other job depends on that one. Fork pull requests still get
# tier 1 and everything below it; the full-year tier is for branches with push access.
#
# THE FULL-YEAR PAIRS run the Python setups and, for each setup that has one, the composed
# file (golden_check.py --mode composed, assemblies_spec.md §13 step 4): the assemblies
# reproduce the Python setup's full-year golden too. The matrix lists those runs
# (golden_matrix.py --with-composed). Every setup of golden_config.json runs the full year
# (owner decision 2026-10-11: the first week of January never runs a solar collector's pump,
# so only a year exercises the solar systems); a setup that cannot finish a year would keep a
# week-only 'horizons' entry until its bead is fixed.
#
# ONE RUN PER JOB. Every run is a matrix job of its own (golden_matrix.py --runs, golden_check.py
# --jobs 1 --pairs <pair> --mode <mode>): each Python full-year pair, and separately each composed
# file's full-year run, at both step lengths: 62 jobs in all. The tier's wall time is then its
# slowest single run (the heat pump with the car or with solar thermal at 60 s, about 10 minutes)
# plus a job's fixed minute or so,
# instead of the busiest of five shards that each ran two runs at once (12 to 16 minutes measured
# on #1002); owner decision 2026-10-15. The matrix comes heaviest first, so when the 32 runners
# are busy the long runs are queued first. A run's weight is its pair's "seconds" in
# golden_config.json, the composed run weighing what the Python run weighs. One run peaks at
# about 6 GiB, well inside a 16 GB runner.
#
# TIMEOUTS. A hung simulation must not hold a runner until GitHub's six-hour default. A run job
# runs its one pair in-process (--jobs 1), so the job's own limit is the guard: 30 minutes, about
# three times the slowest run job measured (about 10 minutes). Where pairs run in child processes
# (--jobs above 1: the week shards of golden-check.yml and the bless in golden-update.yml), each
# child is killed after three times its recorded seconds (at least ten minutes) and fails that
# pair by name (scripts/runner.py, ChildRuns.timeout_in_seconds).

# The assembly nightly tier ran here until 2026-10-19; it runs daily in assemblies-nightly.yml.

name: golden-year

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Runnable by hand as well, because the two automatic triggers above only fire for pull
  # requests that target main; a stacked pull request is checked by dispatching this workflow.
  workflow_dispatch:
  # Called by weekly-cold-cache.yml, the weekly run without any cache; see there.
  workflow_call:
    inputs:
      cold_cache:
        description: "Skip the inputs-cache restore, so every job computes its inputs from scratch, and leave the save to the caller"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  # The weekly cold run (cold_cache) has a group of its own, so it neither waits for nor cancels a push's run.
  group: golden-year-${{ github.ref }}${{ inputs.cold_cache && '-cold' || '' }}
  # Cancel superseded runs on feature branches, but let every push to main finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  discover:
    name: discover full-year runs
    # The fork guard (see the header): skipped for a pull request from a fork, and with it
    # every job below, since they all need this one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
      # golden_matrix.py is stdlib-only, so no dependency install is needed here.
      - name: Build the full-year matrix
        id: gen
        run: |
          matrix="$(python3 scripts/golden_matrix.py --horizon year --runs --with-composed)"
          echo "$matrix" | python3 -m json.tool
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report

  golden-year:
    name: golden-year ${{ matrix.mode }} ${{ matrix.setup }}
    needs: discover
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    # See TIMEOUTS above: about three times the slowest run job measured (about 10 minutes).
    timeout-minutes: 30
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      # One setup:param token and one mode, passed through the environment rather than
      # interpolated into the script.
      PAIR: ${{ matrix.pair }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
          scope: ${{ matrix.name }}
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install HiSim package
        run: uv pip install --system -e .
      # The weather series and LoadProfileGenerator profiles earlier runs computed: the most recent
      # shared entry, which every job of every workflow restores; see the action.
      - name: Restore the HiSim inputs cache
        if: ${{ !inputs.cold_cache }}
        uses: ./.github/actions/hisim-cache
        with:
          mode: restore
      - name: Golden KPI check (full year, one run)
        run: python scripts/golden_check.py --mode "$MODE" --jobs 1 --pairs "$PAIR"
      - name: Upload deviation report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-year-report-${{ matrix.name }}
          path: |
            results/golden-ref-check*/report.*
            results/golden-ref-check*/_children/*.log
          if-no-files-found: warn
      # Only the files this job added, for the merge job below. Kept even when the job failed; see
      # the action for why that is safe.
      - name: Upload what this job added to the HiSim inputs cache
        if: always()
        uses: ./.github/actions/hisim-cache
        with:
          mode: upload-new
          # Prefixed with the workflow: the weekly cold run calls three workflows in one run, and an
          # artifact name must be unique within it.
          scope: golden-year-${{ matrix.name }}
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report
          scope: ${{ matrix.name }}

  # One shared inputs-cache entry per run instead of one per job: merges what every golden-year job added
  # into the most recent shared entry and saves it, or nothing when nothing changed; see the action.
  # Not for a fork's pull request, which saves no cache, nor for the weekly cold run, whose caller saves.
  inputs-cache:
    name: merge the inputs cache
    needs: [discover, golden-year]
    if: always() && needs.discover.result != 'skipped' && !github.event.pull_request.head.repo.fork && !inputs.cold_cache
    # On the self-hosted runners, and in the image of the jobs it merges, whose HISIM_LPG_BINARY_ROOT
    # decides whether the LoadProfileGenerator binaries stay in the cache.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
      - name: Merge and save the HiSim inputs cache
        uses: ./.github/actions/hisim-cache
        with:
          mode: merge-save
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report

  summary:
    name: golden-year summary
    needs: [discover, golden-year]
    # Not for a fork's pull request, where the fork guard skipped everything above.
    if: always() && needs.discover.result != 'skipped'
    # On the self-hosted runners; see the runs-on comment in tests.yml.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    steps:
      # needs.golden-year.result is 'success' only when every one of its matrix jobs succeeded.
      - name: Fail if a full-year run failed or did not run
        run: |
          echo "discover=${{ needs.discover.result }}  golden-year=${{ needs.golden-year.result }}"
          [ "${{ needs.golden-year.result }}" = "success" ]
