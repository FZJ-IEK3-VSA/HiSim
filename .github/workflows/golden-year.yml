# Tier 2 of the golden-reference gate: the heavy full-year pairs.
#
# WHY workflow_run — the wait must cost no runner. This workflow used to run on
# `pull_request`, and its `gate` job polled `gh run list` until quality, tests and
# golden-check had finished for the commit. A gate is an ordinary job, so it held a
# runner for the whole wait: 28 idle minutes in a good run, 60 when it timed out. On
# 2026-09-12 eight pull requests re-ran at once; eight idle gates occupied the very
# runners the ~22-job golden-check matrices were queued behind, golden-check stayed
# queued past the hour, every gate timed out and the full-year tier never ran at all.
# So the wait is now the trigger. Every completion of a prerequisite fires this
# workflow and the gate decides in seconds, from one `gh run list` query per
# prerequisite (scripts/ci_prereqs_done.sh): the earlier completions bail, the last
# one proceeds. Nothing idles.
#
# WHY the commit status — the PR checks list. `workflow_run` runs are not listed
# among a pull request's checks; that is exactly why this workflow was moved off
# `workflow_run` and onto `pull_request` once before. Rather than pay for visibility
# with idle runners, it now reports itself onto the head commit through the commit
# status API (`permissions: statuses: write`), context `golden-year`: pending when
# the gate starts the matrix, success or failure from the summary job. Commit
# statuses do appear on the pull request. A gate that skips posts nothing, so a
# commit that was never eligible shows no stray status.
#
# THE FORK GUARD. A workflow_run job runs in the base repository, with a token that
# can write commit statuses, and it checks out the head commit. Running a fork's
# code from that position is how a pull request from anyone gets that token, so the
# gate runs only when the triggering run was a `pull_request` whose head repository
# is this repository. Fork pull requests still get tier 1 and everything below it;
# the full-year tier is for branches with push access.
#
# DUPLICATES. Three prerequisites complete, so this workflow fires three times per
# commit. `concurrency: golden-year-<head_sha>` with cancel-in-progress: false
# serialises them, and the gate additionally refuses to start a matrix when an older
# golden-year run for the same commit is already running or has already succeeded.
#
# A CANCELLED prerequisite counts as a failed one: it will never go green by itself.
# In practice that is a superseded commit — golden-check and tests cancel their
# in-progress runs on feature branches — and the failure status then lands on the old
# commit, which no pull request displays. The new head gets its own clean run.
#
# THE COMMIT TESTED is `workflow_run.head_sha` — the branch head, not the pull
# request's merge commit. That is the commit a status can be shown on, and the
# commit the prerequisite runs are indexed by.
#
# THE TOOLING COMMIT. The gate checks out no ref at all, which on a workflow_run
# event means the default branch's head — the very commit this workflow file itself
# comes from. Its helper script (scripts/ci_prereqs_done.sh) and the actions it uses
# are therefore always the copies that belong to the workflow calling them. Only two
# things come from the commit under test: scripts/golden_config.json, checked out into
# `under-test/` so the matrix fans out over the setups the pull request defines, and
# the golden-year matrix jobs, which are the test. A branch that predates a change to
# this workflow has no copy of the workflow's helpers — on 2026-09-12 the gate ran
# `bash scripts/ci_prereqs_done.sh` out of a branch older than the commit that added
# that script, died with "No such file or directory" and hung a red status on a pull
# request whose prerequisites were in fact all green. The workflow copy and its helpers
# must not come apart. It is also the safer arrangement: the job holding the
# status-writing token now runs nothing that came from the head commit.
#
# EDITING THIS FILE. `workflow_run` always uses the copy of the workflow that is on
# the default branch, so changes here do nothing on the pull request that makes
# them. They take effect once merged, on the next pull request.

name: golden-year

on:
  workflow_run:
    workflows: [quality, tests, golden-check]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read      # gh run list, to read the prerequisite runs and our own siblings
  statuses: write    # the commit status that carries the result back to the pull request

concurrency:
  # Per commit, not per branch: the three prerequisite completions of one commit must
  # not race each other, and a queued run holds no runner while it waits its turn.
  group: golden-year-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  # The prerequisite workflows report against the pull request's head commit.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  gate:
    name: gate (prerequisites)
    # The fork guard, as a job condition so a fork's pull request costs no runner at
    # all: proceed for a manual dispatch, or for a workflow_run whose triggering run
    # was a pull_request from a branch of this same repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      matrix: ${{ steps.gen.outputs.matrix }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.run_id }}
      TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      # Deliberately no `ref:`, so this is `github.sha`: the default branch's head for a
      # workflow_run event, the dispatched ref for a manual one — either way the commit
      # this workflow file comes from. The gate's helper script and the actions below
      # come from it too. See THE TOOLING COMMIT in the header.
      - uses: actions/checkout@v7
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
      - name: Decide whether the full-year tier runs
        id: decide
        run: |
          set -euo pipefail
          post_status() {
            gh api -X POST "repos/$GH_REPO/statuses/$SHA" \
              -f state="$1" -f context=golden-year -f description="$2" -f target_url="$RUN_URL" \
              >/dev/null \
              || echo "::warning title=golden-year::Could not post the '$1' commit status for $SHA."
          }

          # A manual run is the operator asking for the full year; it gates on nothing.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run for $SHA — the prerequisite check is skipped."
            post_status pending "Full-year golden check running (manual)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "'$TRIGGER_WORKFLOW' completed for $HEAD_BRANCH @ $SHA"
          verdict="$(bash scripts/ci_prereqs_done.sh "$SHA")"
          kind="${verdict%% *}"
          detail="${verdict#"$kind"}"
          detail="${detail# }"
          echo "prerequisites: $verdict"

          case "$kind" in
            pending)
              echo "waiting for $detail; a later completion will start the year tier"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            failed)
              post_status failure "Prerequisite CI failed ($detail) — the full-year check did not run."
              echo "::error title=golden-year skipped::Prerequisite '$detail' did not conclude 'success' for $SHA, so the full-year golden check was NOT run. Fix that check and re-run."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

          # Two prerequisites finishing together can both see everything green. The
          # concurrency group serialises them; this refuses the second one. Only runs
          # older than this one count, because the run queued behind us is not a
          # duplicate of us — we are a duplicate of it.
          siblings="$(gh run list --workflow golden-year.yml --commit "$SHA" --limit 50 \
            --json databaseId,status,conclusion \
            --jq '[.[] | select(.databaseId < (env.RUN_ID | tonumber))
                       | select(.status != "completed" or .conclusion == "success")] | length')"
          if [ "${siblings:-0}" -gt 0 ]; then
            echo "An earlier golden-year run for $SHA is already running or has already succeeded — nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "quality, tests and golden-check are all green for $SHA — starting the full-year tier."
          post_status pending "Full-year golden check running."
          echo "proceed=true" >> "$GITHUB_OUTPUT"
      # Which pairs exist is the commit under test's business: a pull request may add or
      # remove golden setups, and the matrix has to fan out over the ones it defines. Only
      # the config comes from there; the emitter reading it stays this workflow's own copy.
      # Guarded on the decision so the two early-bail firings per commit stay cheap.
      - name: Check out the golden config of the commit under test
        if: steps.decide.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: under-test
          sparse-checkout: scripts      # cone mode: the directory the config lives in
      - name: Build full-year matrix
        id: gen
        if: steps.decide.outputs.proceed == 'true'
        run: |
          echo "matrix=$(python3 scripts/golden_matrix.py --horizon year \
            --config under-test/scripts/golden_config.json)" >> "$GITHUB_OUTPUT"
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report

  golden-year:
    name: golden-year ${{ matrix.setup }} / ${{ matrix.param }}
    # Skipped when `gate` fails, and when the gate decided this trigger was too early
    # or a duplicate, so the heavy compute runs exactly once per commit and only with
    # every prerequisite green.
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Wall time, CPU time and peak memory for this job; see the action.
      - name: Start the resource monitor
        uses: ./.github/actions/resource-monitor
        with:
          mode: start
          scope: ${{ matrix.setup }}-${{ matrix.param }}
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install HiSim package
        run: uv pip install --system -e .
      # The previous run's weather series and LoadProfileGenerator profiles; see the action.
      - name: Restore the HiSim inputs cache
        uses: ./.github/actions/hisim-cache
        with:
          mode: restore
          scope: ${{ github.workflow }}-${{ matrix.setup }}-${{ matrix.param }}
      - name: Golden KPI check (full year)
        run: python scripts/golden_check.py --setup "${{ matrix.setup }}" --param "${{ matrix.param }}"
      - name: Upload deviation report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-year-report-${{ matrix.setup }}-${{ matrix.param }}
          path: results/golden-ref-check/report.*
          if-no-files-found: warn
      # Kept even when the job failed; see the action for why that is safe.
      - name: Save the HiSim inputs cache
        if: always()
        uses: ./.github/actions/hisim-cache
        with:
          mode: save
          scope: ${{ github.workflow }}-${{ matrix.setup }}-${{ matrix.param }}
      # Kept on failure too: a job killed for running out of memory is the one
      # whose measurement matters most.
      - name: Report the resource usage
        if: always()
        uses: ./.github/actions/resource-monitor
        with:
          mode: report
          scope: ${{ matrix.setup }}-${{ matrix.param }}

  summary:
    name: golden-year summary
    needs: [gate, golden-year]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Conclude
        run: |
          set -uo pipefail
          gate="${{ needs.gate.result }}"
          proceed="${{ needs.gate.outputs.proceed }}"
          gy="${{ needs.golden-year.result }}"
          echo "gate=$gate  proceed=${proceed:-<unset>}  golden-year=$gy"
          post_status() {
            gh api -X POST "repos/$GH_REPO/statuses/$SHA" \
              -f state="$1" -f context=golden-year -f description="$2" -f target_url="$RUN_URL" \
              >/dev/null \
              || echo "::warning title=golden-year::Could not post the '$1' commit status for $SHA."
          }

          # The gate skipped (fork, or not a pull request) or decided this trigger was
          # too early or a duplicate: it posted no pending status, so there is nothing
          # to conclude either.
          if [ "$gate" = "skipped" ] || { [ "$gate" = "success" ] && [ "$proceed" != "true" ]; }; then
            echo "The full-year tier did not start for this trigger; no status to report."
            exit 0
          fi

          # A failed gate is two different things. When it found a failed prerequisite it
          # wrote `proceed=false` and then exited 1, having already posted a failure status
          # naming the prerequisite; re-posting here would only replace that description
          # with a vaguer one, so this says nothing and just carries the red over. When the
          # gate itself broke — a missing helper, a checkout or matrix-build failure, a
          # cancellation — nobody has concluded the pending status it may have posted, and
          # a status blaming the prerequisites would be a lie: the prerequisites are not
          # what failed. `proceed` separates the two: the other branches that write
          # 'false' — too early, duplicate — exit 0 and are already handled above, so a
          # failed gate with proceed='false' is the prerequisite verdict and nothing else.
          if [ "$gate" != "success" ]; then
            if [ "${proceed:-}" = "false" ]; then
              echo "The gate found a failed prerequisite and posted its own status; nothing to add."
              exit 1
            fi
            post_status failure "The golden-year gate itself failed — see the run."
            echo "::error title=golden-year::The golden-year gate job did not complete, so the full-year golden check did not run. This is a failure of the gate, not of a prerequisite — see the 'gate' job."
            exit 1
          fi
          if [ "$gy" != "success" ]; then
            post_status failure "Full-year golden KPI check failed."
            echo "::error title=golden-year::Full-year golden KPI check failed."
            exit 1
          fi
          post_status success "Full-year golden KPI check passed."
          echo "Full-year golden check passed."
