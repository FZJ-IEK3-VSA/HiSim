# Runs the full pytest suite (one parallel job per marker, each spread over pytest-xdist
# workers) inside the prebuilt HiSim test image, then combines coverage from all of them in a
# single run.

name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Runnable by hand as well, because the two automatic triggers above only fire for pull
  # requests that target main. A stacked pull request — one whose base is the branch below it
  # in a chain — therefore gets no run at all, and a whole stack can reach main having never
  # been tested. Dispatching this workflow against such a branch is how that is avoided.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tests-${{ github.ref }}
  # Cancel superseded runs on feature branches, but let every push to main finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    # Self-hosted runners (label hisim-local) for pushes, pull requests from branches of this repository
    # and manual runs; a pull request from a fork stays on a GitHub-hosted runner, so code from outside
    # contributors never runs on our machines. github.event.pull_request is empty for every event that
    # is not a pull request, so those land on hisim-local as well.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # workers: pytest-xdist processes for the shard (-n). dist: how xdist spreads them, loadfile unless
        # the entry says loadgroup. Under loadfile all of a module's tests run on one worker, so module
        # fixtures and the stray-file guard's per-module window stay whole. Under loadgroup the same holds
        # for every test without an xdist_group (tests/ci_split.py gives it its module's), while a test that
        # declares a group of its own is scheduled by that group, so one module's independent parts can
        # run on different workers. The runner has 4 cores and 16 GB; the peaks quoted are the resource
        # monitor's job-wide cgroup figure on main (run 36303671417, 2026-09-27), of which ~1.4 GB is the
        # idle container. 0 runs the shard in one process: xdist is off.
        #
        # group: k/n splits one marker's tests over n jobs (tests/ci_split.py, --ci-group): every job
        # collects the same tests and keeps its k-th group, cut by the committed weights of
        # tests/ci_durations.json, a module (or a declared xdist_group) never cut. Each such job also
        # records its seconds per unit and uploads them (ci-durations-<name>), which is how the weights
        # are refreshed; tests/test_ci_split.py fails when a group of a split marker has no job here.
        include:
          - name: base
            marker: "base"
            # 2.5 GB peak (~1.1 GB above idle) for one process: four fit easily; ~7,300 tests in
            # ~200 modules, so loadfile spreads well.
            workers: 4
          - name: assemblies
            marker: "assemblies"
            # Every test under tests/assemblies/ but the nightly tier: the format, expansion and harness tests,
            # the PR tier of the assembly test contracts and the heat-pump gate, which need the local
            # LoadProfileGenerator. They ran in the base shard until 2026-10-08, inside its 2.5 GB peak; ~2,900
            # tests in 13 modules. test_library_contracts.py (one isolation run per sample, about 700 s in all)
            # declares every sample, sweep and library check an xdist_group, so loadgroup spreads it over the
            # four workers, each making the runs of its own samples only; the other modules stay whole.
            workers: 4
            dist: loadgroup
          - name: buildingtest
            marker: "buildingtest"
            # 2.2 GB peak; seven modules, bounded by test_building_scalability_with_factor (62 s).
            workers: 4
          # extendedbase: about 900 s of tests, as three jobs of two workers each. 6.9 GB peak (~5.5 GB above
          # idle) for one process; four could pass 16 GB, two cannot. The two ~185 s participant canaries
          # (test_p3_parity_participants_*.py, a module each) set the floor: the split puts them in different
          # jobs, and test_dhw_chain_time_resolution.py's four twins without a heat pump (60 to 95 s each, an
          # xdist_group per twin) wherever they fit, beside test_p3_parity.py (~120 s).
          - name: extendedbase-1
            marker: "extendedbase"
            group: "1/3"
            workers: 2
            dist: loadgroup
          - name: extendedbase-2
            marker: "extendedbase"
            group: "2/3"
            workers: 2
            dist: loadgroup
          - name: extendedbase-3
            marker: "extendedbase"
            group: "3/3"
            workers: 2
            dist: loadgroup
          # extendedbase2: about 500 s of tests, as two jobs, each still serial: test_hisim_main_python.py
          # peaks at 11.3 GB, and a second process beside it would risk the 16 GB limit. The shard also holds
          # the heat-pump booking runs of test_heat_pump_flow_booking.py, the hot-water chain runs of
          # test_dhw_chain_twins.py and the two heat-pump twins of test_dhw_chain_time_resolution.py (~130
          # and ~150 s, an xdist_group each, so the split can put them in different jobs).
          - name: extendedbase2-1
            marker: "extendedbase2"
            group: "1/2"
            workers: 0
          - name: extendedbase2-2
            marker: "extendedbase2"
            group: "2/2"
            workers: 0
          - name: postprocessingoptions
            marker: "postprocessingoptions"
            durations: "40"
            # One module (test_postprocessing_options.py), about a minute: nothing to spread.
            workers: 0
          - name: renovisor-probes
            marker: "renovisor_probes"
            # The tests that read RenoVisor's capability document or the translation map rendered from it
            # (tests/renovisor/conftest.py). The session fixture builds the whole probe set, about 90 s; in
            # base each of the four workers that picked up one of the three modules built it again (five
            # 85-92 s setups in base's --durations). One process builds it once, plus the determinism build.
            workers: 0
          - name: system-setups
            marker: "system_setups"
            # 3.5 GB peak (~2.1 GB above idle): four processes stay near 10 GB; 16 modules.
            workers: 4
          - name: utsp
            marker: "utsp"
            # One test (test_occupancy_scaling_with_local_lpg, 328 s) at 11.5 GB peak: nothing to spread.
            workers: 0
          - name: others
            marker: "not base and not buildingtest and not system_setups and not extendedbase and not extendedbase2 and not utsp and not postprocessingoptions and not nightly and not assemblies and not renovisor_probes"
            allow_empty: "true"
            # 1.9 GB peak, 35 s: two workers are the most the short shard gains from, and they leave the
            # HPC-harness worker-pool tests, which time child processes, cores to spare.
            workers: 2

    steps:
    - uses: actions/checkout@v7
      with:
        # The full history, so the upstream_history tests (tests/test_golden_history_upstream.py)
        # can compare the KPI rename table with the commits that touched golden_references/.
        fetch-depth: 0
    # Wall time, CPU time and peak memory for this job; see the action.
    - name: Start the resource monitor
      uses: ./.github/actions/resource-monitor
      with:
        mode: start
        scope: ${{ matrix.name }}
    - name: Mark workspace as safe for git
      # The container runs as a different user than the one that owns the
      # checked-out workspace, so git would otherwise refuse with
      # "detected dubious ownership" (exit 128) on every git invocation.
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install HiSim package
      run: |
        uv pip install --system -e .
    # The previous run's weather series and LoadProfileGenerator profiles; see the action.
    - name: Restore the HiSim inputs cache
      uses: ./.github/actions/hisim-cache
      with:
        mode: restore
        scope: ${{ github.workflow }}-${{ matrix.name }}
    - name: Test with pytest
      working-directory: ./tests/
      env:
        UTSP_URL: ${{ secrets.UTSP_URL }}
        UTSP_API_KEY: ${{ secrets.UTSP_API_KEY }}
      run: |
        durations="${{ matrix.durations }}"
        durations="${durations:-20}"
        dist="${{ matrix.dist }}"
        dist="${dist:-loadfile}"
        # A split shard keeps its group, in the split's order (--no-loadscope-reorder: heaviest unit first,
        # instead of xdist's order by test count), and records its seconds per unit for the next refresh.
        # The container's shell is sh, which has no arrays: the extra arguments are the positional ones.
        set --
        if [ -n "${{ matrix.group }}" ]; then
          set -- --ci-group "${{ matrix.group }}" --no-loadscope-reorder \
            --ci-durations-out "../results/ci_durations/${{ matrix.name }}.json"
        fi
        ret=0
        # pytest-cov starts coverage in every xdist worker (a bare 'coverage run' would follow only the
        # controller) and combines the workers' data into $COVERAGE_FILE when the run ends; its name
        # matches the upload glob below, and so do the workers' own files should the combine not happen.
        # --cov-report= writes no report here: the combine coverage job reports once over all shards.
        export COVERAGE_FILE=".coverage.${{ matrix.name }}"
        pytest -m "${{ matrix.marker }}" -n "${{ matrix.workers }}" --dist "$dist" "$@" \
          --cov=../hisim --cov-report= --durations="$durations" || ret=$?
        # pytest exit code 5 means "no tests collected"; only the catch-all
        # "others" job is allowed to legitimately select zero tests.
        if [ "${{ matrix.allow_empty }}" = "true" ] && [ "$ret" = "5" ]; then
          ret=0
        fi
        exit "$ret"
    # The one upload that must stay unconditional, because the combine job below consumes it.
    # It is diagnostics all the same, so a failure to store it must not turn a passing test
    # matrix red: without continue-on-error a 403 from the artifact service is indistinguishable
    # from a failing test, and it also fails the gate job that waits on this one.
    - name: Upload coverage data
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.name }}
        path: tests/.coverage.*
        include-hidden-files: true
        if-no-files-found: warn
    # The iterations per step of every energy-system file with a hot-water tank, one JSON per file, written by
    # tests/test_dhw_chain_twins.py (hydronic coupling spec §6), so a drift of the convergence is seen.
    - name: Upload the iteration histograms
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: iteration-histogram-${{ matrix.name }}
        path: results/iteration_histogram/
        if-no-files-found: ignore
    # The seconds per unit of a split shard (tests/ci_split.py), the input of its weights' next refresh.
    - name: Upload the split durations
      if: always() && matrix.group != ''
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ci-durations-${{ matrix.name }}
        path: results/ci_durations/
        if-no-files-found: ignore
    # Kept even when the job failed; see the action for why that is safe.
    - name: Save the HiSim inputs cache
      if: always()
      uses: ./.github/actions/hisim-cache
      with:
        mode: save
        scope: ${{ github.workflow }}-${{ matrix.name }}
    # Kept on failure too: a job killed for running out of memory is the one
    # whose measurement matters most.
    - name: Report the resource usage
      if: always()
      uses: ./.github/actions/resource-monitor
      with:
        mode: report
        scope: ${{ matrix.name }}

  coverage:
    name: combine coverage
    needs: pytest
    # On the self-hosted runners like the pytest jobs, with the same fork guard (see there).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hisim-local"]') }}
    # Runs in the same image so the source paths recorded by the pytest jobs
    # (/__w/HiSim/HiSim/...) resolve when generating the report.
    container:
      image: ghcr.io/fzj-iek3-vsa/hisim-test:py311
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    # Wall time, CPU time and peak memory for this job; see the action.
    - name: Start the resource monitor
      uses: ./.github/actions/resource-monitor
      with:
        mode: start
    - name: Mark workspace as safe for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Download coverage data from the pytest jobs
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        path: coverage-data
        merge-multiple: true
    - name: Combine coverage
      run: |
        mkdir -p coverage-combine
        index=0
        for coverage_file in $(find coverage-data -type f -name '.coverage*'); do
          cp "$coverage_file" "coverage-combine/.coverage.$index"
          index=$((index + 1))
        done
        coverage combine coverage-combine
        coverage report
        coverage xml -o coverage.xml
        coverage html -d htmlcov
    - name: Upload combined coverage report
      uses: actions/upload-artifact@v7
      with:
        name: combined-coverage-report
        path: |
          coverage.xml
          htmlcov/
        if-no-files-found: error
    # Kept on failure too: a job killed for running out of memory is the one
    # whose measurement matters most.
    - name: Report the resource usage
      if: always()
      uses: ./.github/actions/resource-monitor
      with:
        mode: report
