# Worked-example drift check (cost-spec-v2 §3.6).
#
# The Excel workbooks under tests/worked_examples/ are the source of truth; the YAML
# next to them is generated by tools/convert_worked_examples.py and read by
# tests/test_worked_examples.py. This job re-runs the converter and fails if the
# committed YAML is not exactly what the workbooks say, which closes both silent
# failure modes: an xlsx edited without regenerating the YAML, and a YAML hand-edited
# to make a test pass without touching the xlsx.
#
# The converter deliberately imports nothing but openpyxl and PyYAML, so this job
# needs neither HiSim nor its dependencies. The examples themselves are checked
# against the engine by the normal test suite (marker `worked_examples`, part of
# `base`), not here.

name: worked-examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worked-examples-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  drift-check:
    name: yaml matches the workbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install converter dependencies
        run: pip install openpyxl pyyaml
      - name: Check the generated YAML against the workbooks
        run: python tools/convert_worked_examples.py --check
