image: ghcr.io/astral-sh/uv:python3.11-bookworm

# Which pipeline sources are allowed to start a pipeline at all. The "api" entry is
# load-bearing: the heavy-CI importer triggers this project with
# POST /projects/:id/pipeline {"ref": "main"}, and without it that request comes back
# with ZERO jobs -- which reads as "nothing failed" to anything naive.
#
# Each source is spelled as a separate `== "..."` comparison rather than a single
# `=~ /^(api|web|trigger)$/` regex on purpose: the parity checker's rule reader matches
# the literal `CI_PIPELINE_SOURCE == "api"` form, and a regex reads to it as "keys on the
# source but not in a form we recognise".
#
# ON-DEMAND ONLY. There is deliberately no `merge_request_event` or `$CI_COMMIT_BRANCH`
# rule: adding either would start a pipeline on every one of the ~140 open branches, and
# the static tier is not green yet. Widen this only once the pipeline is green, and as
# its own change.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - lint
  - quality
  - typecheck
  - test
  - coverage

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy  # silences the "Failed to hardlink" warning — and is literally
                      # what that warning asks you to set
  UV_NO_PROGRESS: "1" # no "Downloading numpy (16.1MiB)" / "Downloaded numpy" lines
  
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .cache/uv

.uv_project_setup:
  before_script:
    - if [ -f requirements.txt ]; then uv pip install -q --system -r requirements.txt; fi
    - uv pip install -q --system -e .

.uv_graphviz_project_setup:
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends graphviz
    - if [ -f requirements.txt ]; then uv pip install -q --system -r requirements.txt; fi
    - uv pip install -q --system -e .

.pytest_template:
  stage: test
  needs:
    - ruff
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends graphviz
    - uv pip install -q --system coverage
    - if [ -f requirements.txt ]; then uv pip install -q --system -r requirements.txt; fi
    - uv pip install -q --system -e .
  after_script:
    - mkdir -p "coverage-data/$CI_JOB_NAME"
    - if ls tests/.coverage.* >/dev/null 2>&1; then cp tests/.coverage.* "coverage-data/$CI_JOB_NAME/"; fi
  artifacts:
    when: always
    paths:
      - coverage-data/
      - tests/pytest-*.xml
    reports:
      junit: tests/pytest-*.xml
    expire_in: 1 week

# ruff gates the whole pipeline on purpose -- every other job `needs:` it, so a lint
# failure suppresses the rest of the run. That is deliberate, not an oversight: on an
# unlinted tree the downstream reds are largely artifacts of what ruff already flags, so
# harvesting them would file issues that the ruff fixes dissolve and burn agent compute
# twice. One layer at a time is the cheaper convergence.
#
# --output-format concise because the failure importer parses this trace. Not `json`
# (the trace is clipped before parsing, so a large JSON array arrives truncated) and not
# `github`/`grouped`.
ruff:
  stage: lint
  needs: []
  before_script:
    # Pinned: an unpinned linter release turns the pipeline red on its own schedule, and
    # this job gates everything else.
    - uv pip install -q --system "ruff==0.15.18"
  script:
    - ruff check --output-format concise .

prospector:
  stage: quality
  needs:
    - ruff
  before_script:
    - uv pip install -q --system 'prospector[with_everything]'
    - uv pip install -q --system 'prospector[with-everything]'
    - uv pip install -q --system 'prospector[with_bandit]'
    - uv pip install -q --system 'prospector[with_mypy]'
    - uv pip install -q --system 'prospector[with_pyroma]'
    - uv pip install -q --system 'prospector[with_vulture]'
    - if [ -f requirements.txt ]; then uv pip install -q --system -r requirements.txt; fi
    - uv pip install -q --system -e .
  # Every target always runs, exit code aggregated -- see the note on the mypy job for why
  # sequential script lines are wrong here. PYTHONPATH=scripts on the tests/ run so the
  # top-level `hpc_harness` package resolves, matching the GitHub step.
  script:
    - |
      rc=0
      prospector setup.py || rc=1
      prospector system_setups/ || rc=1
      PYTHONPATH=scripts prospector tests/ || rc=1
      prospector hisim/ || rc=1
      prospector docs/ || rc=1
      exit $rc

pylint:
  stage: quality
  needs:
    - ruff
  before_script:
    - uv pip install -q --system pylint
  script:
    - pylint --rcfile pylintrc-critical-only $(git ls-files '*.py')

mypy:
  stage: typecheck
  needs:
    - ruff
  before_script:
    - uv pip install -q --system mypy
    - uv pip install -q --system pytest
    - uv pip install -q --system -r requirements.txt
  # --no-color-output and --show-error-codes so the trace is plain
  # `path:line:col: error: message [code]` -- ANSI escapes break the importer's line
  # regex, and without the codes it cannot group findings by rule.
  #
  # All three targets ALWAYS run and the exit code is aggregated at the end. As plain
  # sequential script lines GitLab aborts the job at the first failure, so a type error in
  # `hisim` hid every error in `system_setups/` and `tests/` -- and finding them would cost
  # one full pipeline each. This mirrors `if: always()` on the GitHub steps
  # (.github/workflows/quality.yml), which is why GitHub reported all three and this did not.
  script:
    - |
      rc=0
      mypy --no-color-output --show-error-codes -p hisim --config-file mypy.ini || rc=1
      mypy --no-color-output --show-error-codes --config-file mypy_moderate.ini system_setups/ || rc=1
      mypy --no-color-output --show-error-codes --config-file mypy_moderate.ini tests/ || rc=1
      exit $rc

basic-execution:
  stage: test
  needs:
    - ruff
  extends: .uv_graphviz_project_setup
  script:
    - cd system_setups
    - python ../hisim/hisim_main.py household_heatpump_building_sizer.py

pytest-base:
  extends: .pytest_template
  script:
    - cd tests
    - coverage run --parallel-mode --source=../hisim -m pytest -m "base" --durations=20 --junitxml=pytest-base.xml

pytest-extendedbase:
  extends: .pytest_template
  script:
    - cd tests
    - coverage run --parallel-mode --source=../hisim -m pytest -m "extendedbase" --durations=20 --junitxml=pytest-extendedbase.xml

pytest-buildingtest:
  extends: .pytest_template
  script:
    - cd tests
    - coverage run --parallel-mode --source=../hisim -m pytest -m "buildingtest" --durations=20 --junitxml=pytest-buildingtest.xml

pytest-system-setups:
  extends: .pytest_template
  script:
    - cd tests
    - coverage run --parallel-mode --source=../hisim -m pytest -m "system_setups" --durations=20 --junitxml=pytest-system-setups.xml

pytest-jsonconfig:
  extends: .pytest_template
  script:
    - cd tests
    - coverage run --parallel-mode --source=../hisim -m pytest -m "jsonconfig" --durations=20 --junitxml=pytest-jsonconfig.xml

pytest-postprocessingoptions:
  extends: .pytest_template
  script:
    - cd tests
    - coverage run --parallel-mode --source=../hisim -m pytest -m "postprocessingoptions" --durations=40 --junitxml=pytest-postprocessingoptions.xml

pytest-others:
  extends: .pytest_template
  script:
    - cd tests
    - |
      markers="not base and not buildingtest and not system_setups and not extendedbase"
      markers="$markers and not utsp and not jsonconfig and not postprocessingoptions"
      coverage run --parallel-mode --source=../hisim -m pytest \
        -m "$markers" \
        --durations=20 \
        --junitxml=pytest-others.xml
      ret=$?
      [ $ret = 5 ] && exit 0 || [ $ret = 0 ] && exit 0 || exit 1

pytest-utsp:
  extends: .pytest_template
  script:
    - cd tests
    - coverage run --parallel-mode --source=../hisim -m pytest -m "utsp" --durations=20 --junitxml=pytest-utsp.xml

# NOTE: a `pytest-base-docker` job used to sit here. It was removed rather than fixed:
# it was `allow_failure: true` (so it could never fail the pipeline -- a job that exists
# and does nothing is worse than a named gap), and it ran in `$HISIM_TEST_IMAGE`, which
# only the manual `docker-test-image` job ever pushes, so it pulled an image that is
# usually absent from the registry. If the prebuilt test image is wired up later, bring
# it back WITHOUT allow_failure.

coverage:
  stage: coverage
  needs:
    - job: pytest-base
      artifacts: true
    - job: pytest-extendedbase
      artifacts: true
    - job: pytest-buildingtest
      artifacts: true
    - job: pytest-system-setups
      artifacts: true
    - job: pytest-jsonconfig
      artifacts: true
    - job: pytest-postprocessingoptions
      artifacts: true
    - job: pytest-others
      artifacts: true
    - job: pytest-utsp
      artifacts: true
  before_script:
    - uv pip install -q --system coverage
  script:
    - find coverage-data -type f -name '.coverage*' > coverage-file-list.txt
    - test -s coverage-file-list.txt
    - mkdir -p coverage-combine
    - index=0
    - |
      while IFS= read -r coverage_file; do
        cp "$coverage_file" "coverage-combine/.coverage.$index"
        index=$((index + 1))
      done < coverage-file-list.txt
    - coverage combine coverage-combine
    - coverage report
    - coverage xml -o coverage.xml
    - coverage html -d htmlcov
  artifacts:
    when: always
    paths:
      - coverage.xml
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

# REMOVED, deliberately: `docker-image`, `docker-test-image`, `pypi-build`, `pypi-publish`
# and `paper-draft` (with them, the `package` and `publish` stages).
#
# They produced RELEASE ARTEFACTS (container images, sdist/wheel, the PyPI upload, the
# JOSS paper PDF), which is not what this pipeline is for -- it exists to run code checks
# and report their failures. GitHub Actions still owns publishing
# (.github/workflows/docker-image.yml, docker-test-image.yml, pypi-publish.yml), so
# nothing is lost; `git log -- .gitlab-ci.yml` has the definitions if they are wanted back.
#
# Two side effects worth knowing:
#   * `pypi-publish` had `needs: pypi-build`, and a `needs:` on a job that does not exist
#     is a hard config error -- it could not stay once pypi-build went.
#   * All four fell through to `when: manual`, and manual jobs declared via `rules` block
#     by default, which would have parked an otherwise-green pipeline at status `manual`.
#     Removing them removes that trap too.
#
# This leaves GitHub's `build` check (docker-test-image.yml) with no GitLab counterpart.
# That is a NAMED GAP, on purpose, not something to paper over with a job that does
# nothing -- report it as such rather than inventing a match for it.


