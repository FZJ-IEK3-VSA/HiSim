# Request type `from_space_heating_cylinder` (spec §10.3): a cylinder charged through a coil by the space-heating
# generator over the `dhw` circuit and drained by the occupancy. The cylinder has no controller of its own: the
# generator's DHW L1 reads its temperature through a need of the heating assembly (partner class SimpleDHWStorage),
# so the energy manager's DHW modifier is the heating import's `ems_modifier_dhw`, not a port of this assembly.
# The volume law reads the number of apartments from the site by the engine's bare-fact rule, as in the twin.

schema_version: 4
kind: assembly
name: dhw/indirect_cylinder
description: Indirectly heated DHW cylinder charged by the heating assembly's dhw circuit.

parameters:
  volume_in_liter:
    {type: float, unit: LITER, default: AUTO, range: {min: 100, max: 1000},
     description: Usable volume; AUTO is the class law per apartment.}
     # range: a flat's 100 l cylinder up to a multi-apartment 1000 l one

components:
  DHWStorage:
    class: hisim.components.simple_water_storage.SimpleDHWStorage
    preset: standard
    config:
      volume_heating_water_storage_in_liter: {$param: volume_in_liter}
    inputs:
      - {$port: hot_water_demand}                           # WaterConsumption
      - {$port: circuit}                                    # the generator's supply temperature and mass flow

interface:
  needs:
    hot_water_demand: {into: [DHWStorage], partner: UtspLpgConnector}
    circuit:          {circuit: dhw, member: DHWStorage}
                      # binds heating.dhw: supply leg and pump are the generator's, the return leg this cylinder's

tests:
  # One day at 900 s beside the occupancy and the other end of the dhw circuit, the twin's heat pump (at most about
  # 40 kW). Water stays liquid; energies per step are at most 40 kW x 0.25 h.
  bounds:
    - {output: DHWStorage.WaterTemperatureToHeatGenerator, unit: CELSIUS, min: 0, max: 100}
    - {output: DHWStorage.WaterTemperatureToSecondaryHeatGenerator, unit: CELSIUS, min: 0, max: 100}
    - {output: DHWStorage.WaterTemperatureFromHeatGenerator, unit: CELSIUS, min: 0, max: 100}
    - {output: DHWStorage.WaterTemperatureFromSecondaryHeatGenerator, unit: CELSIUS, min: 0, max: 100}   # no solar coil
    - {output: DHWStorage.WaterMeanTemperatureInStorage, unit: CELSIUS, min: 0, max: 100}
    - {output: DHWStorage.WaterTemperatureAtEndOfStepInCelsius, unit: CELSIUS, min: 0, max: 100}
    - {output: DHWStorage.StandbyTemperatureLoss, unit: CELSIUS, min: 0, max: 10}          # a drop per step, well below 1 K
    - {output: DHWStorage.ThermalEnergyInStorage, unit: WATT_HOUR, min: 0, max: 150000}    # 1000 l at 100 °C: 116 kWh
    - {output: DHWStorage.ThermalEnergyFromHeatGenerator, unit: WATT_HOUR, min: -10000, max: 10000}
    - {output: DHWStorage.ThermalEnergyFromSecondaryHeatGenerator, unit: WATT_HOUR, min: -10000, max: 10000}
    - {output: DHWStorage.ThermalEnergyConsumptionDHW, unit: WATT_HOUR, min: -15000, max: 0}
      # booked negative, a draw out of the cylinder: a 60 kW shower peak x 0.25 h
    - {output: DHWStorage.ThermalEnergyUnmetDHWInWattHour, unit: WATT_HOUR, min: 0, max: 15000}
      # at most the whole demand of the step, the same shower peak
    - {output: DHWStorage.ThermalEnergyIncreaseInStorage, unit: WATT_HOUR, min: -25000, max: 25000}
    - {output: DHWStorage.StandbyHeatLoss, unit: WATT, min: 0, max: 500}                   # a 1000 l cylinder: 100-200 W
    - {output: DHWStorage.ThermalPowerConsumptionDHW, unit: WATT, min: 0, max: 60000}      # below a 60 kW shower peak
    - {output: DHWStorage.ThermalPowerFromHeatGenerator, unit: WATT, min: -40000, max: 40000}
    - {output: DHWStorage.ThermalPowerFromSecondaryHeatGenerator, unit: WATT, min: -40000, max: 40000}
  monotone:
    - {parameter: volume_in_liter, kpi: Standby heat loss of DHW storage, member: DHWStorage, direction: increasing}
      # a larger cylinder has more surface
  expect:
    - {kpi: Standby heat loss of DHW storage, member: DHWStorage, min: 0.3, max: 1.0}
      # 0.6 kWh measured at the defaults (250 l for one apartment) on the test day
