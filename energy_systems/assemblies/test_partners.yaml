# The test partners of the real assembly library (assemblies_spec.md §9.4): the site components the assembly test
# contracts (tests/assemblies/test_library_contracts.py) place beside an assembly they run in isolation, one for every
# port whose binding changes what the assembly computes and every sizing fact its members read from the site. Read by
# hisim/energy_system/assemblies/testing/partners.py, which documents the format. Every partner is a site entry as an
# energy-system file writes it, with the twins' presets and values (household_heatpump_building_sizer,
# household_gas_building_sizer, household_oil_building_sizer, household_pellets_building_sizer,
# household_wood_chips_building_sizer, household_hydrogen_boiler_building_sizer,
# household_district_heating_building_sizer, household_electric_heating_building_sizer,
# household_gas_solar_thermal_building_sizer, household_heatpump_solar_thermal_building_sizer).
partners:
  # ------------------------------------------------------------------------------------------- the site
  Weather:
    serves: [{partner: Weather}, {fact: weather_identity}, {fact: heating_reference_temperature_in_celsius}]
    component:
      class: hisim.components.weather.Weather
      config:
        location: Aachen
        source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
        data_source: DWD_TRY
        heating_reference_temperature_in_celsius: -7.0
        predictive_control: false
  UTSPConnector:
    # The residents: they draw hot water, the energy manager ranks their consumption and the meter measures it.
    serves: [{partner: UtspLpgConnector}, {observed_by: L2GenericEnergyManagementSystem},
             {observed_by: ElectricityMeter}]
    component:
      class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
      preset: couple_both_at_work
      config:
        data_acquisition_mode: USE_LOCAL_LPG
  Building:
    # The house whose facts the members' sizing laws read. It is heated by nothing: a building reading the heat
    # distribution would need the heat distribution beside every assembly, and a test partner reads only what it
    # requires.
    serves: [{partner: Building}, {fact: heating_load_in_watt}, {fact: number_of_apartments}, {fact: roof_area_in_m2},
             {fact: set_heating_temperature_in_celsius}]
    requires: [Weather, UTSPConnector]
    component:
      class: hisim.components.building.building.Building
      preset: german_single_family_home
      config:
        number_of_apartments: 1.0
        enable_opening_windows: true
        weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      inputs: [Weather, UTSPConnector]
  HeatDistributionController:
    serves: [{partner: HeatDistributionController}, {fact: heat_distribution_system_type},
             {fact: set_heating_threshold_outside_temperature_in_celsius}]
    requires: [Weather, Building]
    component:
      class: hisim.components.heat_distribution_system.HeatDistributionController
      preset: building_derived
      inputs: [Weather, Building]
  HeatDistributionSystem:
    # The other end of a heating assembly's space_heating circuit: it pumps and owns the return leg.
    serves: {circuit: space_heating, other_end: [SimpleHotWaterStorage]}
    requires: [Building, HeatDistributionController]
    component:
      class: hisim.components.heat_distribution_system.HeatDistribution
      preset: building_derived
      inputs: [Building, HeatDistributionController, {$port: space_heating}]
      ports:
        space_heating: {circuit: space_heating}

  HeatDistributionSystemWithoutStorage:
    # The other end of a space_heating circuit a generator feeds directly, without a buffer (district heating): the
    # distribution of household_district_heating_building_sizer, whose position line the site states (D25). The
    # generator's controller reads its water temperature.
    serves: [{circuit: space_heating, other_end: [DistrictHeating]}, {partner: HeatDistribution}]
    requires: [Building, HeatDistributionController]
    component:
      class: hisim.components.heat_distribution_system.HeatDistribution
      preset: building_derived
      config:
        position_hot_water_storage_in_system: NO_STORAGE_MASS_FLOW_FIX
      inputs: [Building, HeatDistributionController, {$port: space_heating}]
      ports:
        space_heating: {circuit: space_heating}

  # ----------------------------------------------------------------------------- the DHW cylinder
  DHWStorage:
    # The other end of a heat pump's or a boiler's dhw circuit, and the cylinder its DHW controller reads.
    serves: [{circuit: dhw, other_end: [MoreAdvancedHeatPumpHPLib]}, {circuit: dhw, other_end: [GenericBoiler]},
             {circuit: dhw, other_end: [ElectricHeating]}, {circuit: dhw, other_end: [DistrictHeating]},
             {partner: SimpleDHWStorage}]
    requires: [UTSPConnector]
    component:
      class: hisim.components.simple_water_storage.SimpleDHWStorage
      preset: standard
      inputs: [UTSPConnector, {$port: dhw}]
      ports:
        dhw: {circuit: dhw}

  SolarCylinder:
    # The other end of a solar collector's solar_dhw circuit: the cylinder of the solar twins, whose primary coil the
    # collector charges, and the cylinder the collector's controller reads (a need binds the partner of its class that
    # a circuit end of the same assembly already brings, isolation.py). Without a back-up generator: the test day's
    # draws cool it, which the collector's contract does not depend on.
    serves: {circuit: solar_dhw, other_end: [SolarThermalSystem]}
    requires: [UTSPConnector]
    component:
      class: hisim.components.simple_water_storage.SimpleDHWStorage
      preset: standard
      inputs: [UTSPConnector, {$port: solar_coil}]
      ports:
        solar_coil: {circuit: solar_dhw}

  # ------------------------------------------------------------------- the heat pump of a cylinder
  HeatPump:
    # The other end of a cylinder's dhw circuit: the twin's heat pump with its controllers and its buffer.
    serves: {circuit: dhw, other_end: [SimpleDHWStorage]}
    requires: [HeatPumpControllerDHW, HeatPumpControllerSH, Buffer, Weather]
    component:
      class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLib
      preset: air_water
      config:
        with_domestic_hot_water_preparation: true
      inputs:
        - HeatPumpControllerDHW
        - HeatPumpControllerSH
        - {$port: dhw}
        - Buffer
        - {input: TemperatureAmbient, from: Weather.DailyAverageOutsideTemperatures}
        - {input: TemperatureInputPrimary, from: Weather.DailyAverageOutsideTemperatures}
      ports:
        dhw: {circuit: dhw}
  HeatPumpControllerDHW:
    # Reads the cylinder under test, the one SimpleDHWStorage of its system, and the heat pump it joins with, without
    # requiring it.
    component:
      class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLibControllerDHW
      preset: standard
      inputs: [{$port: cylinder}, HeatPump]
      ports:
        cylinder: {partner: SimpleDHWStorage}
  HeatPumpControllerSH:
    # Reads the heat pump's buffer, which joins with the heat pump: it reads it without requiring it.
    requires: [Weather, HeatDistributionController]
    component:
      class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLibControllerSpaceHeating
      preset: standard
      inputs: [Weather, HeatDistributionController, Buffer]
  Buffer:
    # Reads the heat pump it joins with, without requiring it back.
    requires: [HeatDistributionSystem]
    component:
      class: hisim.components.simple_water_storage.SimpleHotWaterStorage
      preset: buffer
      config:
        sizing_option: SIZE_ACCORDING_TO_HEAT_PUMP
      inputs: [{$port: space_heating}, HeatPump]
      ports:
        space_heating: {circuit: space_heating}

  # --------------------------------------------------------------------- natural gas: meter and burner
  GasMeter:
    # The natural-gas connection a fuel need binds; its meter observes the consumers' fuel outputs, and copies its
    # carrier from the energy_carrier fact of the one burner beside it, as in the twin.
    serves: {carrier: natural_gas}
    component:
      class: hisim.components.gas_meter.GasMeter
      preset: standard
      inputs: [{$port: connection}]
      ports:
        connection: {carrier: natural_gas}
  GasBoiler:
    # A consumer of the natural gas a connection provides: the twin's condensing boiler with its controller, its
    # buffer and its cylinder. Its class contributes the energy_carrier fact the meter's carrier is copied from, so
    # the isolation finds the fact here, beside the meter it binds (isolation.py, facts_of_partners); each fuel's
    # consumer below does the same for its own meter.
    serves: {consumes: natural_gas}
    requires: [Building, GasBoilerController, GasBuffer, GasCylinder]
    component:
      class: hisim.components.generic_boiler.GenericBoiler
      preset: condensing_gas
      inputs: [GasBoilerController, GasCylinder, GasBuffer]
      ports:
        fuel: {carrier: natural_gas, outputs: [EnergyDemandSh, EnergyDemandDhw]}
  GasBoilerController:
    # Reads the buffer and the cylinder, which join with the boiler: it reads them without requiring them.
    requires: [Weather, HeatDistributionController]
    component:
      class: hisim.components.generic_boiler.GenericBoilerController
      preset: modulating
      config:
        set_heating_threshold_outside_temperature_in_celsius: 18.0
        with_domestic_hot_water_preparation: true
      inputs: [Weather, HeatDistributionController, GasBoiler, GasCylinder, GasBuffer]
  GasBuffer:
    # Reads the boiler it joins with, without requiring it back.
    requires: [HeatDistributionSystem]
    component:
      class: hisim.components.simple_water_storage.SimpleHotWaterStorage
      preset: buffer
      config:
        sizing_option: SIZE_ACCORDING_TO_GAS_HEATER
      inputs: [{$port: space_heating}, GasBoiler]
      ports:
        space_heating: {circuit: space_heating}
  GasCylinder:
    # The boiler's own cylinder; reads the boiler it joins with, without requiring it back.
    requires: [UTSPConnector]
    component:
      class: hisim.components.simple_water_storage.SimpleDHWStorage
      preset: standard
      inputs: [UTSPConnector, GasBoiler]

  # -------------------------------------------------------------------- heating oil: meter and burner
  OilMeter:
    # The oil tank a fuel need binds; its fuel meter copies its carrier from the burner beside it, as in the twin.
    serves: {carrier: heating_oil}
    component:
      class: hisim.components.fuel_meter.FuelMeter
      preset: standard
      inputs: [{$port: connection}]
      ports:
        connection: {carrier: heating_oil}
  OilBoiler:
    # A consumer of the heating oil a supply provides: the boiler of household_oil_building_sizer with its
    # controller, its buffer and its cylinder; its class contributes the energy_carrier fact the meter copies.
    serves: {consumes: heating_oil}
    requires: [Building, OilBoilerController, OilBuffer, OilCylinder]
    component:
      class: hisim.components.generic_boiler.GenericBoiler
      preset: oil
      inputs: [OilBoilerController, OilCylinder, OilBuffer]
      ports:
        fuel: {carrier: heating_oil, outputs: [EnergyDemandSh, EnergyDemandDhw]}
  OilBoilerController:
    requires: [Weather, HeatDistributionController]
    component:
      class: hisim.components.generic_boiler.GenericBoilerController
      preset: modulating
      config:
        set_heating_threshold_outside_temperature_in_celsius: 18.0
        with_domestic_hot_water_preparation: true
      inputs: [Weather, HeatDistributionController, OilBoiler, OilCylinder, OilBuffer]
  OilBuffer:
    requires: [HeatDistributionSystem]
    component:
      class: hisim.components.simple_water_storage.SimpleHotWaterStorage
      preset: buffer
      inputs: [{$port: space_heating}, OilBoiler]
      ports:
        space_heating: {circuit: space_heating}
  OilCylinder:
    requires: [UTSPConnector]
    component:
      class: hisim.components.simple_water_storage.SimpleDHWStorage
      preset: standard
      inputs: [UTSPConnector, OilBoiler]

  # ------------------------------------------------------------------------ pellets: meter and burner
  PelletMeter:
    # The pellet store a fuel need binds; its fuel meter copies its carrier from the burner beside it.
    serves: {carrier: pellets}
    component:
      class: hisim.components.fuel_meter.FuelMeter
      preset: standard
      inputs: [{$port: connection}]
      ports:
        connection: {carrier: pellets}
  PelletBoiler:
    # A consumer of the pellets a supply provides: the boiler of household_pellets_building_sizer with its
    # controller, its buffer and its cylinder; its class contributes the energy_carrier fact the meter copies.
    serves: {consumes: pellets}
    requires: [Building, PelletBoilerController, PelletBuffer, PelletCylinder]
    component:
      class: hisim.components.generic_boiler.GenericBoiler
      preset: pellets
      inputs: [PelletBoilerController, PelletCylinder, PelletBuffer]
      ports:
        fuel: {carrier: pellets, outputs: [EnergyDemandSh, EnergyDemandDhw]}
  PelletBoilerController:
    requires: [Weather, HeatDistributionController]
    component:
      class: hisim.components.generic_boiler.GenericBoilerController
      preset: on_off
      config:
        set_heating_threshold_outside_temperature_in_celsius: 18.0
        with_domestic_hot_water_preparation: true
        minimum_runtime_in_seconds: 1800.0
        minimum_resting_time_in_seconds: 900.0
      inputs: [Weather, HeatDistributionController, PelletBoiler, PelletCylinder, PelletBuffer]
  PelletBuffer:
    requires: [HeatDistributionSystem]
    component:
      class: hisim.components.simple_water_storage.SimpleHotWaterStorage
      preset: buffer
      config:
        sizing_option: SIZE_ACCORDING_TO_PELLET_HEATING
      inputs: [{$port: space_heating}, PelletBoiler]
      ports:
        space_heating: {circuit: space_heating}
  PelletCylinder:
    requires: [UTSPConnector]
    component:
      class: hisim.components.simple_water_storage.SimpleDHWStorage
      preset: standard
      inputs: [UTSPConnector, PelletBoiler]

  # --------------------------------------------------------------------- wood chips: meter and burner
  WoodChipMeter:
    # The wood-chip store a fuel need binds; its fuel meter copies its carrier from the burner beside it.
    serves: {carrier: wood_chips}
    component:
      class: hisim.components.fuel_meter.FuelMeter
      preset: standard
      inputs: [{$port: connection}]
      ports:
        connection: {carrier: wood_chips}
  WoodChipBoiler:
    # A consumer of the wood chips a supply provides: the boiler of household_wood_chips_building_sizer with its
    # controller, its buffer and its cylinder; its class contributes the energy_carrier fact the meter copies.
    serves: {consumes: wood_chips}
    requires: [Building, WoodChipBoilerController, WoodChipBuffer, WoodChipCylinder]
    component:
      class: hisim.components.generic_boiler.GenericBoiler
      preset: wood_chips
      inputs: [WoodChipBoilerController, WoodChipCylinder, WoodChipBuffer]
      ports:
        fuel: {carrier: wood_chips, outputs: [EnergyDemandSh, EnergyDemandDhw]}
  WoodChipBoilerController:
    requires: [Weather, HeatDistributionController]
    component:
      class: hisim.components.generic_boiler.GenericBoilerController
      preset: on_off
      config:
        set_heating_threshold_outside_temperature_in_celsius: 18.0
        with_domestic_hot_water_preparation: true
        minimum_runtime_in_seconds: 3600.0
        minimum_resting_time_in_seconds: 1800.0
      inputs: [Weather, HeatDistributionController, WoodChipBoiler, WoodChipCylinder, WoodChipBuffer]
  WoodChipBuffer:
    requires: [HeatDistributionSystem]
    component:
      class: hisim.components.simple_water_storage.SimpleHotWaterStorage
      preset: buffer
      config:
        sizing_option: SIZE_ACCORDING_TO_WOOD_CHIP_HEATING
      inputs: [{$port: space_heating}, WoodChipBoiler]
      ports:
        space_heating: {circuit: space_heating}
  WoodChipCylinder:
    requires: [UTSPConnector]
    component:
      class: hisim.components.simple_water_storage.SimpleDHWStorage
      preset: standard
      inputs: [UTSPConnector, WoodChipBoiler]

  # ----------------------------------------------------------------------- hydrogen: meter and burner
  HydrogenMeter:
    # The hydrogen connection a fuel need binds; a gas meter, as in the twin (the fuel meter refuses hydrogen).
    serves: {carrier: hydrogen}
    component:
      class: hisim.components.gas_meter.GasMeter
      preset: standard
      inputs: [{$port: connection}]
      ports:
        connection: {carrier: hydrogen}
  HydrogenBoiler:
    # A consumer of the hydrogen a supply provides: the boiler of household_hydrogen_boiler_building_sizer with its
    # controller, its buffer and its cylinder; its class contributes the energy_carrier fact the meter copies.
    serves: {consumes: hydrogen}
    requires: [Building, HydrogenBoilerController, HydrogenBuffer, HydrogenCylinder]
    component:
      class: hisim.components.generic_boiler.GenericBoiler
      preset: hydrogen
      inputs: [HydrogenBoilerController, HydrogenCylinder, HydrogenBuffer]
      ports:
        fuel: {carrier: hydrogen, outputs: [EnergyDemandSh, EnergyDemandDhw]}
  HydrogenBoilerController:
    requires: [Weather, HeatDistributionController]
    component:
      class: hisim.components.generic_boiler.GenericBoilerController
      preset: modulating
      config:
        set_heating_threshold_outside_temperature_in_celsius: 18.0
        with_domestic_hot_water_preparation: true
      inputs: [Weather, HeatDistributionController, HydrogenBoiler, HydrogenCylinder, HydrogenBuffer]
  HydrogenBuffer:
    requires: [HeatDistributionSystem]
    component:
      class: hisim.components.simple_water_storage.SimpleHotWaterStorage
      preset: buffer
      config:
        sizing_option: SIZE_ACCORDING_TO_GAS_HEATER
      inputs: [{$port: space_heating}, HydrogenBoiler]
      ports:
        space_heating: {circuit: space_heating}
  HydrogenCylinder:
    requires: [UTSPConnector]
    component:
      class: hisim.components.simple_water_storage.SimpleDHWStorage
      preset: standard
      inputs: [UTSPConnector, HydrogenBoiler]

  # ------------------------------------------------------------- district heat: meter and connection
  DistrictHeatMeter:
    # The district heating connection a carrier need binds; its fuel meter copies its carrier from the connection
    # beside it, as in the twin.
    serves: {carrier: district_heat}
    component:
      class: hisim.components.fuel_meter.FuelMeter
      preset: standard
      inputs: [{$port: connection}]
      ports:
        connection: {carrier: district_heat}
  DistrictHeatingConsumer:
    # A consumer of the district heat a supply provides: the connection of household_district_heating_building_sizer
    # with its controller, its distribution and its cylinder; its class contributes the energy_carrier fact the meter
    # copies.
    serves: {consumes: district_heat}
    requires: [Building, DistrictHeatingConsumerController, HeatDistributionSystemWithoutStorage, DistrictHeatingCylinder]
    component:
      class: hisim.components.generic_district_heating.DistrictHeating
      preset: standard
      config:
        with_domestic_hot_water_preparation: true
      inputs: [DistrictHeatingConsumerController, {$port: space_heating}, DistrictHeatingCylinder]
      ports:
        space_heating: {circuit: space_heating}
        fuel: {carrier: district_heat, outputs: [ThermalOutputShEnergy, ThermalOutputDhwEnergy]}
  DistrictHeatingConsumerController:
    # Reads the distribution and the cylinder, which join with the connection: it reads them without requiring them.
    requires: [Weather, HeatDistributionController]
    component:
      class: hisim.components.generic_district_heating.DistrictHeatingController
      preset: standard
      config:
        with_domestic_hot_water_preparation: true
        parallel_space_heating_and_dhw_option: true
      inputs: [Weather, HeatDistributionController, HeatDistributionSystemWithoutStorage, DistrictHeatingCylinder]
  DistrictHeatingCylinder:
    requires: [UTSPConnector]
    component:
      class: hisim.components.simple_water_storage.SimpleDHWStorage
      preset: standard
      inputs: [UTSPConnector, DistrictHeatingConsumer]

  # ------------------------------------------------------------- electricity: arrays, control, grid
  PVArray:
    # A roof array contributing pv_peak_power_in_watt, the fact a battery is sized from.
    serves: {fact: pv_peak_power_in_watt}
    requires: [Weather, Building]
    component:
      class: hisim.components.generic_pv_system.PVSystem
      preset: rooftop
      inputs: [Weather]
  EnergyManager:
    # The controller an energy-manager need binds and a battery's controllable output is ranked by; it observes
    # what its class declares and the system's components have (beside the space-heating-only heat pump: no DHW).
    serves: [{partner: L2GenericEnergyManagementSystem}, {controls: Battery}]
    component:
      class: hisim.components.controller_l2_energy_management_system.L2GenericEnergyManagementSystem
      preset: optimize_own_consumption
      observes: declared
  Grid:
    # The one electricity provider an electricity need checks for. Its meter observes the energy manager's grid
    # balance, which it requires: a need for electricity stands beside a manager in this library (the heating
    # assemblies bind their modifiers to one), and a meter observing the balance and the flows is refused.
    serves: {carrier: electricity}
    requires: [EnergyManager]
    component:
      class: hisim.components.electricity_meter.ElectricityMeter
      preset: standard
      observes: [{output: TotalElectricityToOrFromGrid}]
      ports:
        connection: {carrier: electricity}
