# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/basic_household.py with energy_systems/one_day_15min.simulation.yaml by the HiSim energy-system recorder v1.
schema_version: 3
name: basic_household
description: Basic household system setup. Shows how to set up a standard system.
components:
  UTSPConnector:
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    preset: standard
  Weather:
    class: hisim.components.weather.Weather
    preset: standard
  PVSystem:
    class: hisim.components.generic_pv_system.PVSystem
    preset: rooftop
    config:
      power_in_watt: 10000.0
    inputs:
      - Weather
  ElectricityMeter:
    class: hisim.components.electricity_meter.ElectricityMeter
    preset: standard
    inputs:
      - from: HeatPump.ElectricityOutput
        component_type: HEAT_PUMP
        tags:
          - ELECTRICITY_CONSUMPTION_UNCONTROLLED
        weight: 999
      - from: PVSystem.ElectricityOutput
        component_type: PV
        tags:
          - ELECTRICITY_PRODUCTION
        weight: 999
      - from: UTSPConnector.ElectricalPowerConsumption
        tags:
          - ELECTRICITY_CONSUMPTION_UNCONTROLLED
        weight: 999
  Building:
    class: hisim.components.building.building.Building
    preset: standard
    config:
      weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
    inputs:
      - Weather
      - UTSPConnector
      - input: ThermalPowerDelivered
        from: HeatPump.ThermalPowerDelivered
  GenericHeatPumpController:
    class: hisim.components.generic_heat_pump.GenericHeatPumpController
    config:
      temperature_air_heating_in_celsius: 19.0
      temperature_air_cooling_in_celsius: 24.0
      offset_in_celsius: 0.5
      mode: 2
    inputs:
      - ElectricityMeter
      - Building
  HeatPump:
    class: hisim.components.generic_heat_pump.GenericHeatPump
    config:
      manufacturer: Viessmann Werke GmbH & Co KG
      heat_pump_name: Vitocal 300-A AWO-AC 301.B07
      min_operation_time_in_seconds: 3600.0
      min_idle_time_in_seconds: 900.0
    inputs:
      - GenericHeatPumpController
      - Weather
