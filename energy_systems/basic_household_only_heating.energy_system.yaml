# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/basic_household_only_heating.py with energy_systems/one_day_15min.simulation.yaml by the HiSim energy-system recorder v1.
schema_version: 3
name: basic_household_only_heating
description: Shows a single household with only heating.
components:
  ModulatingBoilerController:
    class: hisim.components.generic_boiler.GenericBoilerController
    config:
      is_modulating: true
      set_heating_threshold_outside_temperature_in_celsius: 16.0
      minimal_thermal_power_in_watt: 1000.0
      maximal_thermal_power_in_watt: 12000.0
      set_temperature_difference_for_full_power: 5.0
      minimum_runtime_in_seconds: 1800.0
      minimum_resting_time_in_seconds: 1800.0
      with_domestic_hot_water_preparation: false
      secondary_mode: false
      hysteresis_water_temperature_offset: 10.0
    inputs:
      - Weather
      - HeatDistributionController
      - SimpleHotWaterStorage
  HeatDistributionController:
    class: hisim.components.heat_distribution_system.HeatDistributionController
    config:
      heating_system: RADIATOR
      set_heating_threshold_outside_temperature_in_celsius: 16.0
      heating_reference_temperature_in_celsius: -12.2
      set_heating_temperature_for_building_in_celsius: 20.0
      set_cooling_temperature_for_building_in_celsius: 25.0
      heating_load_of_building_in_watt: 7780.75
      specific_heating_load_of_building_in_watt_per_m2: null
    inputs:
      - Weather
      - Building
  HeatDistributionSystem:
    class: hisim.components.heat_distribution_system.HeatDistribution
    preset: standard
    config:
      heating_system: RADIATOR
      water_mass_flow_rate_in_kg_per_second: 0.12
      absolute_conditioned_floor_area_in_m2: 121.2
    inputs:
      - Building
      - HeatDistributionController
      - SimpleHotWaterStorage
  SimpleHotWaterStorage:
    class: hisim.components.simple_water_storage.SimpleHotWaterStorage
    config:
      volume_heating_water_storage_in_liter: 155.62
      heat_transfer_coefficient_in_watt_per_m2_per_kelvin: 2.0
      heat_exchanger_is_present: true
      position_hot_water_storage_in_system: PARALLEL_TO_HEAT_SOURCE
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
    inputs:
      - HeatDistributionSystem
      - CondensingGasBoiler
  CondensingGasBoiler:
    class: hisim.components.generic_boiler.GenericBoiler
    preset: condensing_gas_12kw
    inputs:
      - ModulatingBoilerController
      - SimpleHotWaterStorage
  Building:
    class: hisim.components.building.building.Building
    preset: standard
    inputs:
      - Weather
      - UTSPConnector
  Weather:
    class: hisim.components.weather.Weather
    config:
      location: Aachen
      source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      data_source: DWD_TRY
      predictive_control: false
  UTSPConnector:
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    config:
      data_acquisition_mode: USE_PREDEFINED_PROFILE
      household:
        Name: CHR01 Couple both at Work
        Guid:
          StrVal: 516a33ab-79e1-4221-853b-967fc11cc85a
      energy_intensity: EnergySaving
      travel_route_set:
        Name: Travel Route Set for 10km Commuting Distance
        Guid:
          StrVal: ca46be86-9cc7-47b5-9769-abff78ceca7a
      transportation_device_set:
        Name: Bus and one 30 km/h Car
        Guid:
          StrVal: 6ac74bd0-bacd-4b39-b84a-dc7ae16702c9
      charging_station_set:
        Name: Charging At Home with 11 kW
        Guid:
          StrVal: 78dae308-24c4-45cc-8bdf-b001d61f45c2
      profile_with_washing_machine_and_dishwasher: true
      predictive_control: false
      predictive: false
      result_dir_path: ${utsp_results}
      cache_dir_path: null
      name_of_predefined_loadprofile: CHR01 Couple both at Work
      predefined_loadprofile_filepaths: null
      guid: ''
      calculation_index_for_local_lpg: null
      cars: null
