# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/dynamic_components.py with energy_systems/one_day_15min.simulation.yaml by the HiSim energy-system recorder v1.
schema_version: 3
name: dynamic_components
description: Dynamic Components Module.
components:
  Battery1:
    class: hisim.components.advanced_battery_bslib.Battery
    preset: standard
    config:
      custom_pv_inverter_power_generic_in_watt: 5.0
      custom_battery_capacity_generic_in_kilowatt_hour: 10.0
  Battery2:
    class: hisim.components.advanced_battery_bslib.Battery
    preset: standard
    config:
      source_weight: 2
      custom_pv_inverter_power_generic_in_watt: 2.5
      custom_battery_capacity_generic_in_kilowatt_hour: 5.0
  CHP1:
    class: hisim.components.advanced_fuel_cell.CHP
    config:
      min_operation_time: 60.0
      min_idle_time: 15.0
      gas_type: Hydrogen
      operating_mode: both
      is_modulating: true
      p_el_min: 2000.0
      p_th_min: 3000.0
      eff_el_min: 0.2
      eff_th_min: 0.5
      mass_flow_max: 0.011
      p_el_max: 3000.0
      p_th_max: 4000.0
      eff_el_max: 0.4
      eff_th_max: 0.55
      temperature_max: 80.0
      delta_temperature: 10.0
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
  CHP2:
    class: hisim.components.advanced_fuel_cell.CHP
    config:
      min_operation_time: 60.0
      min_idle_time: 15.0
      gas_type: Hydrogen
      operating_mode: both
      is_modulating: true
      p_el_min: 2000.0
      p_th_min: 3000.0
      eff_el_min: 0.2
      eff_th_min: 0.5
      mass_flow_max: 0.011
      p_el_max: 3000.0
      p_th_max: 4000.0
      eff_el_max: 0.4
      eff_th_max: 0.55
      temperature_max: 80.0
      delta_temperature: 10.0
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
  L2EMSElectricityController:
    class: hisim.components.controller_l2_energy_management_system.L2GenericEnergyManagementSystem
    preset: optimize_own_consumption
    inputs:
      - from: Battery1.AcBatteryPowerUsed
        component_type: BATTERY
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 1
        dispatch:
          target_input: LoadingPowerInput
      - from: Battery2.AcBatteryPowerUsed
        component_type: BATTERY
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 2
        dispatch:
          target_input: LoadingPowerInput
      - from: CHP1.ElectricityOutput
        component_type: FUEL_CELL
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 3
        dispatch:
          target_input: ElectricityFromCHPTarget
      - from: CHP2.ElectricityOutput
        component_type: FUEL_CELL
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 4
        dispatch:
          target_input: ElectricityFromCHPTarget
      - from: PVSystem.ElectricityOutput
        tags:
          - ELECTRICITY_PRODUCTION
        weight: 999
  Weather:
    class: hisim.components.weather.Weather
    preset: standard
  UTSPConnector:
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    preset: standard
  PVSystem:
    class: hisim.components.generic_pv_system.PVSystem
    preset: rooftop
    config:
      power_in_watt: 10000.0
    inputs:
      - Weather
