# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/electrolyzer_with_renewables.py with energy_systems/one_day_15min.simulation.yaml by the HiSim energy-system recorder v1.
schema_version: 3
name: electrolyzer_with_renewables
description: Simple Electrolyzer system setup.
components:
  StandardTransformerAndRectifier:
    class: hisim.components.transformer_rectifier.Transformer
    config:
      efficiency: 0.95
    inputs:
      - input: Input1
        from: CSV.CSVProfile
  CSV:
    class: hisim.components.csvloader.CSVLoader
    config:
      csv_filename: wind_generated_power_1_min.csv
      column: 1
      loadtype: ELECTRICITY
      unit: KILOWATT
      column_name: generated_power
      sep: ','
      decimal: .
      multiplier: 1.0
      output_description: Values from CSV
  L1ElectrolyzerController:
    class: hisim.components.controller_l1_electrolyzer_h2.ElectrolyzerController
    config:
      nom_load: 987.0
      min_load: 205.462
      max_load: 1028.225
      standby_load: 41.225
      warm_start_time: 30.0
      cold_start_time: 600.0
    inputs:
      - input: ProvidedLoad
        from: StandardTransformerAndRectifier.MyTransformerOutput
  Electrolyzer:
    class: hisim.components.generic_electrolyzer_h2.Electrolyzer
    config:
      electrolyzer_type: PEM
      nom_load: 987.0
      max_load: 1028.225
      nom_h2_flow_rate: 18.875
      faraday_eff: 0.999
      i_cell_nom: 2.0
      ramp_up_rate: 0.03
      ramp_down_rate: 0.25
    inputs:
      - input: InputState
        from: L1ElectrolyzerController.CurrentMode
      - input: LoadInput
        from: L1ElectrolyzerController.DistributedLoad
