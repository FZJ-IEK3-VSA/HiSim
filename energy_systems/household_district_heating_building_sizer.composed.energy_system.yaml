# The composed file of the district heating twin (assemblies_spec.md §8, §13 step 5): the site with the twin's site
# values plus the seven imports from energy_systems/assemblies/ that reproduce
# household_district_heating_building_sizer.energy_system.yaml, the recorded twin of
# system_setups/household_district_heating_building_sizer.py. tests/assemblies/test_twin_gates.py expands it, renames
# the members to the twin's names and asserts the twin outside the intended differences, and runs both for one day:
# every result column equal.
#
# Site component names are the twin's; a site entry carries a `ports:` block only where an import binds to it, and
# `{$port: <port>}` in its inputs marks where the bound port's items land. The connection feeds the
# HeatDistributionSystem directly, without a buffer, so the distribution's position line, NO_STORAGE_MASS_FLOW_FIX, is a
# site config line until hydronic stage D derives it from the circuit (D25). `order:` is the evaluation order within a
# time step (spec §2.3): Building 1, UTSPConnector 2, Weather 3, pv 4, HeatDistributionController 5, heating 6
# (Controller, Generator), dhw 8, HeatDistributionSystem 9, district_heat 10, grid 11, battery 12, control 13: the
# twin's sequence with no swap, there is no buffer; the twin evaluates its FuelMeter after the distribution and before
# the electricity meter. The district heating connection is the one provider of district heat, so the heating's fuel
# need binds it by default.

schema_version: 4
name: household_district_heating_building_sizer
description: District heating household system setup with building sizing support.

components:
  Building:
    order: 1
    class: hisim.components.building.building.Building
    preset: german_single_family_home
    config:
      number_of_apartments: 1.0
      enable_opening_windows: true
      weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
    inputs:
      - Weather
      - {$port: temperature_modifier}
      - UTSPConnector
      - HeatDistributionSystem
    ports:
      temperature_modifier: {partner: L2GenericEnergyManagementSystem, optional: true}   # BuildingTemperatureModifier
    optional-bind: {temperature_modifier: control}
  UTSPConnector:
    order: 2
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    preset: couple_both_at_work
    config:
      data_acquisition_mode: USE_LOCAL_LPG
  Weather:
    order: 3
    class: hisim.components.weather.Weather
    config:
      location: Aachen
      source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      data_source: DWD_TRY
      heating_reference_temperature_in_celsius: -7.0
      predictive_control: false
  HeatDistributionController:
    order: 5
    class: hisim.components.heat_distribution_system.HeatDistributionController
    preset: building_derived
    inputs:
      - {$port: temperature_modifier}
      - Weather
      - Building
    ports:
      temperature_modifier: {partner: L2GenericEnergyManagementSystem, optional: true}   # BuildingTemperatureModifier
    optional-bind: {temperature_modifier: control}
  HeatDistributionSystem:
    order: 9
    class: hisim.components.heat_distribution_system.HeatDistribution
    preset: building_derived
    config:
      position_hot_water_storage_in_system: NO_STORAGE_MASS_FLOW_FIX   # the site states it until stage D (D25)
    inputs:
      - Building
      - HeatDistributionController
      - {$port: space_heating}
    ports:
      space_heating: {circuit: space_heating}               # pump and return leg are the distribution's, no storage

imports:
  heating:
    order: 6
    assembly: heating/district_heating
  dhw:
    order: 8
    assembly: dhw/indirect_cylinder
    bind: {circuit: heating.dhw}
  district_heat:
    order: 10
    assembly: supply/district_heating_connection
  pv:
    order: 4
    assembly: pv/array
    instances: {pv_system: {}}                              # the legacy single array's id (spec §10.4)
  battery:
    order: 12
    assembly: storage/battery
    instances: {battery: {}}
  control:
    order: 13
    assembly: control/ems_self_consumption
  grid:
    order: 11
    assembly: supply/electricity_grid
    observes: [{output: TotalElectricityToOrFromGrid}]      # the manager's grid balance only, never its flows twice
