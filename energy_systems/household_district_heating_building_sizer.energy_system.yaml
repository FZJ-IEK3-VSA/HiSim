# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/household_district_heating_building_sizer.py with energy_systems/one_day_15min.simulation.yaml by the HiSim energy-system recorder v1.
schema_version: 3
name: household_district_heating_building_sizer
description: District heating household system setup with building sizing support.
components:
  Building:
    class: hisim.components.building.building.Building
    preset: standard
    config:
      number_of_apartments: 1.0
      enable_opening_windows: true
    inputs:
      - Weather
      - L2EMSElectricityController
      - UTSPConnector
      - HeatDistributionSystem
  UTSPConnector:
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    config:
      data_acquisition_mode: USE_LOCAL_LPG
      household:
        Name: CHR01 Couple both at Work
        Guid:
          StrVal: 516a33ab-79e1-4221-853b-967fc11cc85a
      energy_intensity: EnergySaving
      travel_route_set:
        Name: Travel Route Set for 10km Commuting Distance
        Guid:
          StrVal: ca46be86-9cc7-47b5-9769-abff78ceca7a
      transportation_device_set:
        Name: Bus and one 30 km/h Car
        Guid:
          StrVal: 6ac74bd0-bacd-4b39-b84a-dc7ae16702c9
      charging_station_set:
        Name: Charging At Home with 11 kW
        Guid:
          StrVal: 78dae308-24c4-45cc-8bdf-b001d61f45c2
      profile_with_washing_machine_and_dishwasher: true
      predictive_control: false
      predictive: false
      result_dir_path: ${utsp_results}
      cache_dir_path: null
      name_of_predefined_loadprofile: CHR01 Couple both at Work
      predefined_loadprofile_filepaths: null
      guid: ''
      calculation_index_for_local_lpg: null
      cars: null
  Weather:
    class: hisim.components.weather.Weather
    config:
      location: Aachen
      source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      data_source: DWD_TRY
      predictive_control: false
  PVSystem:
    class: hisim.components.generic_pv_system.PVSystem
    config:
      time: 2019
      location: AACHEN
      module_name: Trina Solar TSM-435NE09RC.05
      integrate_inverter: true
      inverter_name: 'Enphase Energy Inc : IQ8P-3P-72-E-DOM-US [208V]'
      module_database: CEC_MODULE_DATABASE
      inverter_database: CEC_INVERTER_DATABASE
      power_in_watt: 22272.28
      azimuth: 180.0
      tilt: 30.0
      share_of_maximum_pv_potential: 1.0
      load_module_data: false
      source_weight: 0
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
      predictive: false
      predictive_control: false
      prediction_horizon: null
    inputs:
      - Weather
  HeatDistributionController:
    class: hisim.components.heat_distribution_system.HeatDistributionController
    config:
      heating_system: FLOORHEATING
      set_heating_threshold_outside_temperature_in_celsius: 18.0
      heating_reference_temperature_in_celsius: -7.0
      set_heating_temperature_for_building_in_celsius: 20.0
      set_cooling_temperature_for_building_in_celsius: 25.0
      heating_load_of_building_in_watt: 7780.75
      specific_heating_load_of_building_in_watt_per_m2: 64.19762541254126
    inputs:
      - L2EMSElectricityController
      - Weather
      - Building
  DistrictHeatingController:
    class: hisim.components.generic_district_heating.DistrictHeatingController
    config:
      set_heating_threshold_outside_temperature_in_celsius: 18.0
      with_domestic_hot_water_preparation: true
      hysteresis_water_temperature_offset_in_celsius: 15.0
      parallel_space_heating_and_dhw_option: true
    inputs:
      - Weather
      - HeatDistributionController
      - HeatDistributionSystem
      - DHWStorage
  DistrictHeating:
    class: hisim.components.generic_district_heating.DistrictHeating
    config:
      connected_load_in_w: 7780.752200000001
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
      with_domestic_hot_water_preparation: true
    inputs:
      - DistrictHeatingController
      - HeatDistributionSystem
      - DHWStorage
  DHWStorage:
    class: hisim.components.simple_water_storage.SimpleDHWStorage
    config:
      volume_heating_water_storage_in_liter: 250.0
      heat_transfer_coefficient_in_watt_per_m2_per_kelvin: 0.36
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
    inputs:
      - UTSPConnector
      - DistrictHeating
  HeatDistributionSystem:
    class: hisim.components.heat_distribution_system.HeatDistribution
    preset: standard
    config:
      heating_system: FLOORHEATING
      water_mass_flow_rate_in_kg_per_second: 0.27
      absolute_conditioned_floor_area_in_m2: 121.2
      position_hot_water_storage_in_system: NO_STORAGE_MASS_FLOW_FIX
    inputs:
      - Building
      - HeatDistributionController
      - DistrictHeating
  FuelMeter:
    class: hisim.components.fuel_meter.FuelMeter
    config:
      fuel_loadtype: DISTRICTHEATING
      heating_value_of_fuel_in_kwh_per_liter: 9.82
      fuel_density_in_kg_per_m3: 830.0
    inputs:
      - from: DistrictHeating.ThermalOutputDhwEnergy
        tags:
          - HEAT_CONSUMPTION
        weight: 999
      - from: DistrictHeating.ThermalOutputShEnergy
        tags:
          - HEAT_CONSUMPTION
        weight: 999
  ElectricityMeter:
    class: hisim.components.electricity_meter.ElectricityMeter
    config:
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
    inputs:
      - from: L2EMSElectricityController.TotalElectricityToOrFromGrid
        tags:
          - ELECTRICITY_PRODUCTION
        weight: 999
  Battery:
    class: hisim.components.advanced_battery_bslib.Battery
    config:
      source_weight: 1
      system_id: SG1
      custom_pv_inverter_power_generic_in_watt: 11136.14
      custom_battery_capacity_generic_in_kilowatt_hour: 22.27
      charge_in_kwh: 0.0
      discharge_in_kwh: 0.0
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
      lifetime_in_cycles: 5000.0
  L2EMSElectricityController:
    class: hisim.components.controller_l2_energy_management_system.L2GenericEnergyManagementSystem
    preset: optimize_own_consumption
    inputs:
      - from: Battery.AcBatteryPowerUsed
        component_type: BATTERY
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 6
        dispatch:
          target_input: LoadingPowerInput
      - from: PVSystem.ElectricityOutput
        component_type: PV
        tags:
          - ELECTRICITY_PRODUCTION
        weight: 999
      - from: UTSPConnector.ElectricalPowerConsumption
        component_type: RESIDENTS
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 1
        dispatch: {}
