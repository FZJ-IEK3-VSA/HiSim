# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/household_electric_heating_building_sizer.py with energy_systems/one_day_15min.simulation.yaml by the HiSim energy-system recorder v1.
# Grouped by energy_systems/household_electric_heating_building_sizer.grouping.yaml from the probe configurations of energy_systems/household_electric_heating_building_sizer.probes.yaml.
schema_version: 3
name: household_electric_heating_building_sizer
description: Household electric heating system setup with building sizing.
components:
  Building:
    class: hisim.components.building.building.Building
    preset: german_single_family_home
    config:
      number_of_apartments: 1.0
      enable_opening_windows: true
      weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
    inputs:
      - Weather
      - L2EMSElectricityController
      - UTSPConnector
      - ElectricHeating
  UTSPConnector:
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    preset: couple_both_at_work
    config:
      data_acquisition_mode: USE_LOCAL_LPG
  Weather:
    class: hisim.components.weather.Weather
    config:
      location: Aachen
      source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      data_source: DWD_TRY
      predictive_control: false
  PVSystem:
    class: hisim.components.generic_pv_system.PVSystem
    preset: rooftop
    config:
      location: AACHEN
    inputs:
      - Weather
  ElectricHeatingController:
    class: hisim.components.generic_electric_heating.ElectricHeatingController
    config:
      set_heating_threshold_outside_temperature_in_celsius: 18.0
      with_domestic_hot_water_preparation: true
      hysteresis_water_temperature_offset: 15.0
      parallel_space_heating_and_dhw_option: true
      specific_heating_load_of_building_in_watt_per_m2: 64.19762541254126
    inputs:
      - Weather
      - DHWStorage
  ElectricHeating:
    class: hisim.components.generic_electric_heating.ElectricHeating
    config:
      maximum_electric_power_w: 7780.752200000001
      efficiency: 1.0
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
      with_domestic_hot_water_preparation: true
    inputs:
      - ElectricHeatingController
      - Building
      - DHWStorage
  DHWStorage:
    class: hisim.components.simple_water_storage.SimpleDHWStorage
    preset: standard
    inputs:
      - UTSPConnector
      - ElectricHeating
variants:
  electricity_management:
    selected: ems_with_battery
    options:
      ems_with_battery:
        components:
          ElectricityMeter:
            class: hisim.components.electricity_meter.ElectricityMeter
            preset: standard
            inputs:
              - from: L2EMSElectricityController.TotalElectricityToOrFromGrid
                tags:
                  - ELECTRICITY_PRODUCTION
                weight: 999
          Battery:
            class: hisim.components.advanced_battery_bslib.Battery
            preset: sized_to_pv
          L2EMSElectricityController:
            class: hisim.components.controller_l2_energy_management_system.L2GenericEnergyManagementSystem
            preset: optimize_own_consumption
            inputs:
              - from: Battery.AcBatteryPowerUsed
                component_type: BATTERY
                tags:
                  - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
                weight: 6
                dispatch:
                  target_input: LoadingPowerInput
              - from: ElectricHeating.ElectricOutputDhwPower
                component_type: ELECTRIC_HEATING_DHW
                tags:
                  - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
                weight: 3
                dispatch: {}
              - from: ElectricHeating.ElectricOutputShPower
                component_type: ELECTRIC_HEATING_SH
                tags:
                  - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
                weight: 2
                dispatch: {}
              - from: PVSystem.ElectricityOutput
                component_type: PV
                tags:
                  - ELECTRICITY_PRODUCTION
                weight: 999
              - from: UTSPConnector.ElectricalPowerConsumption
                component_type: RESIDENTS
                tags:
                  - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
                weight: 1
                dispatch: {}
      metered_directly:
        components:
          ElectricityMeter:
            class: hisim.components.electricity_meter.ElectricityMeter
            preset: standard
            inputs:
              - from: ElectricHeating.ElectricOutputDhwPower
                component_type: ELECTRIC_HEATING_DHW
                tags:
                  - ELECTRICITY_CONSUMPTION_UNCONTROLLED
                weight: 999
              - from: ElectricHeating.ElectricOutputShPower
                component_type: ELECTRIC_HEATING_SH
                tags:
                  - ELECTRICITY_CONSUMPTION_UNCONTROLLED
                weight: 999
              - from: PVSystem.ElectricityOutput
                component_type: PV
                tags:
                  - ELECTRICITY_PRODUCTION
                weight: 999
              - from: UTSPConnector.ElectricalPowerConsumption
                tags:
                  - ELECTRICITY_CONSUMPTION_UNCONTROLLED
                weight: 999
