# The grouping decision for system_setups/household_gas_building_sizer.py: what each difference between its probe
# configurations means. Edited through the workbook, committed in this form.
setup: system_setups/household_gas_building_sizer.py
probes: energy_systems/household_gas_building_sizer.probes.yaml
assignments:
  Building:
    assign: override
    note: Only the TABULA code moves. The envelope behind it - the U-values, the areas,
      the heat capacity class - is looked up by the component itself and never written
      into the file, so one archetype instead of another is a value a consumer picks
      and the component and its wiring are the same either way.
  PVSystem:
    assign: override
    note: Only the installed peak power moves, and only with the rooftop share. Nothing
      appears or disappears, so this is a number a consumer picks, not a part of the
      household. A share of zero is refused when the setup is built, so the knob's
      range is (0, 1] and no value it can take flips the household into another variant.
  HeatDistributionController:
    assign: override
    note: Radiators change the flow temperature curve this controller is built from.
      Same component, same wiring, different numbers - a knob, not a switch.
  CondensingGasBoiler:
    assign: override
    note: Its thermal power band is the building's heating load, so a better insulated
      envelope buys a smaller boiler. Same boiler, same wiring, a different rating
      - the gas generator's counterpart of the heat pump's set thermal output power.
  ModulatingBoilerController:
    assign: override
    note: Built from the boiler's own minimal and maximal thermal power, so it follows
      the generator one step further down the same cascade. It does not move with
      the emitter type, which is why only the archetype column disagrees with it.
  SimpleHotWaterStorage:
    assign: override
    note: The buffer volume is scaled from the heating load under the gas-heater sizing
      rule, so it follows the same building demand one step further down. A number
      the building determines, not a component that comes or goes.
  HeatDistributionSystem:
    assign: override
    note: Radiator or floor heating is one enum plus the water mass flow rate derived
      from it; the emitter area comes from the building's conditioned floor area and
      does not move with the emitter type. The emitter is present either way.
  ElectricityMeter:
    assign: variant:electricity_management
    note: 'Present in every configuration and wired differently: fed by the energy
      manager''s grid balance when there is one, and by every participant directly
      when there is not. A group can add and remove a component but cannot rewire
      one that survives, so this is the row that forces a variant. Written out in
      full in both options.'
  Battery:
    assign: variant:electricity_management/ems_with_battery
    note: Exists only in the world that has an energy manager; the setup builds the
      two together and there is no battery-without-manager mode. Its capacity also
      follows the rooftop share, which stays a knob on top of the membership.
  L2EMSElectricityController:
    assign: variant:electricity_management/ems_with_battery
    note: The other half of that world, and the component the meter's two wirings
      are about.
  PVSystemAdded:
    assign: group:added_pv
    note: 'The array a photovoltaic renovation measure adds beside the house''s own
      (hisim-epc.28): there or not, so a group. The meter and the energy manager measure
      it as a second producer; their entries carry that feed, and the expansion drops
      it wherever the group is off.'
  BatteryAdded:
    assign: group:added_battery
    note: The battery a battery renovation measure adds beside the house's own (hisim-epc.28),
      dispatched by the same energy manager on its own source weight after the house's
      battery; the manager's entry carries its feed, dropped wherever the group is
      off. It exists only in the worlds with an energy manager, which no probe column
      contradicts.
configurations:
  baseline:
    groups:
      added_pv: false
      added_battery: false
    variants:
      electricity_management: ems_with_battery
  no_battery_ems:
    groups:
      added_pv: false
      added_battery: false
    variants:
      electricity_management: metered_directly
  half_pv:
    groups:
      added_pv: false
      added_battery: false
    variants:
      electricity_management: ems_with_battery
  radiator:
    groups:
      added_pv: false
      added_battery: false
    variants:
      electricity_management: ems_with_battery
  nineties_building:
    groups:
      added_pv: false
      added_battery: false
    variants:
      electricity_management: ems_with_battery
  added_pv:
    groups:
      added_pv: true
      added_battery: false
    variants:
      electricity_management: ems_with_battery
  added_pv_metered_directly:
    groups:
      added_pv: true
      added_battery: false
    variants:
      electricity_management: metered_directly
  added_battery:
    groups:
      added_pv: false
      added_battery: true
    variants:
      electricity_management: ems_with_battery
  added_pv_and_battery:
    groups:
      added_pv: true
      added_battery: true
    variants:
      electricity_management: ems_with_battery
