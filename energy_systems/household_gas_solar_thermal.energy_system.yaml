# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/household_gas_solar_thermal.py with energy_systems/one_day_15min.simulation.yaml by the HiSim energy-system recorder v1.
schema_version: 3
name: household_gas_solar_thermal
description: Household setup with gas boiler and solar thermal system for DHW.
components:
  Building:
    class: hisim.components.building.building.Building
    preset: standard
    config:
      weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
    inputs:
      - Weather
      - UTSPConnector
      - HeatDistributionSystem
  UTSPConnector:
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    preset: standard
  Weather:
    class: hisim.components.weather.Weather
    preset: standard
  HeatDistributionSystem:
    class: hisim.components.heat_distribution_system.HeatDistribution
    preset: standard
    config:
      heating_system: AUTO # sized FLOORHEATING by Size.HEAT_DISTRIBUTION_SYSTEM_TYPE <- HeatDistributionController.heat_distribution_system_type
      water_mass_flow_rate_in_kg_per_second: AUTO # sized 0.27 by Size.WATER_MASS_FLOW_RATE_IN_KG_PER_SECOND.rounded(2) <- HeatDistributionController.water_mass_flow_rate_in_kg_per_second
      absolute_conditioned_floor_area_in_m2: AUTO # sized 121.2 by Size.CONDITIONED_FLOOR_AREA_IN_M2 <- Building.conditioned_floor_area_in_m2
    inputs:
      - Building
      - HeatDistributionController
      - SimpleHotWaterStorage
  HeatDistributionController:
    class: hisim.components.heat_distribution_system.HeatDistributionController
    preset: standard
    config:
      set_heating_threshold_outside_temperature_in_celsius: AUTO # sized 18.0 by HeatDistributionControllerConfig.<lambda> <- Building.heating_load_in_watt, Building.conditioned_floor_area_in_m2
      heating_reference_temperature_in_celsius: AUTO # sized -7.0 by Size.HEATING_REFERENCE_TEMPERATURE_IN_CELSIUS <- Building.heating_reference_temperature_in_celsius
      set_heating_temperature_for_building_in_celsius: AUTO # sized 20.0 by Size.SET_HEATING_TEMPERATURE_IN_CELSIUS <- Building.set_heating_temperature_in_celsius
      set_cooling_temperature_for_building_in_celsius: AUTO # sized 25.0 by Size.SET_COOLING_TEMPERATURE_IN_CELSIUS <- Building.set_cooling_temperature_in_celsius
      heating_load_of_building_in_watt: AUTO # sized 7780.75 by Size.HEATING_LOAD_IN_WATT.rounded(2) <- Building.heating_load_in_watt
    inputs:
      - Weather
      - Building
  DHWStorage:
    class: hisim.components.simple_water_storage.SimpleDHWStorage
    config:
      volume_heating_water_storage_in_liter: 250.0
      heat_transfer_coefficient_in_watt_per_m2_per_kelvin: 0.36
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
    inputs:
      - UTSPConnector
      - SolarThermalSystem
      - input: WaterMassFlowRateFromSecondaryHeatGenerator
        from: CondensingGasBoiler.WaterOutputMassFlowDhw
      - input: WaterTemperatureFromSecondaryHeatGenerator
        from: CondensingGasBoiler.WaterOutputTemperatureDhw
  SimpleHotWaterStorage:
    class: hisim.components.simple_water_storage.SimpleHotWaterStorage
    config:
      volume_heating_water_storage_in_liter: 171.18
      heat_transfer_coefficient_in_watt_per_m2_per_kelvin: 2.0
      heat_exchanger_is_present: true
      position_hot_water_storage_in_system: PARALLEL_TO_HEAT_SOURCE
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
    inputs:
      - HeatDistributionSystem
      - CondensingGasBoiler
  ElectricityMeter:
    class: hisim.components.electricity_meter.ElectricityMeter
    preset: standard
    inputs:
      - from: SolarThermalSystem.ElectricityConsumptionOutput
        component_type: SOLAR_THERMAL_SYSTEM
        tags:
          - ELECTRICITY_CONSUMPTION_UNCONTROLLED
        weight: 999
      - from: UTSPConnector.ElectricalPowerConsumption
        tags:
          - ELECTRICITY_CONSUMPTION_UNCONTROLLED
        weight: 999
  CondensingGasBoiler:
    class: hisim.components.generic_boiler.GenericBoiler
    preset: condensing_gas
    config:
      minimal_thermal_power_in_watt: AUTO # sized 0.0 by 0.0
      maximal_thermal_power_in_watt: AUTO # sized 8558.827420000001 by GenericBoilerConfig.<lambda> <- Building.heating_load_in_watt, Building.number_of_apartments
    inputs:
      - ModulatingBoilerController
      - DHWStorage
      - SimpleHotWaterStorage
  ModulatingBoilerController:
    class: hisim.components.generic_boiler.GenericBoilerController
    preset: modulating
    config:
      minimal_thermal_power_in_watt: AUTO # sized 0.0 by Size.MINIMAL_THERMAL_POWER_IN_WATT <- CondensingGasBoiler.minimal_thermal_power_in_watt
      maximal_thermal_power_in_watt: AUTO # sized 8558.827420000001 by Size.MAXIMAL_THERMAL_POWER_IN_WATT <- CondensingGasBoiler.maximal_thermal_power_in_watt
      with_domestic_hot_water_preparation: true
    inputs:
      - Weather
      - HeatDistributionController
      - DHWStorage
      - SimpleHotWaterStorage
  GasMeter:
    class: hisim.components.gas_meter.GasMeter
    config:
      total_energy_from_grid_in_kwh: 0.0
      gas_loadtype: GAS
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
    inputs:
      - from: CondensingGasBoiler.EnergyDemandDhw
        tags:
          - GAS_CONSUMPTION_UNCONTROLLED
        weight: 999
      - from: CondensingGasBoiler.EnergyDemandSh
        tags:
          - GAS_CONSUMPTION_UNCONTROLLED
        weight: 999
  SolarThermalSystem:
    class: hisim.components.solar_thermal_system.SolarThermalSystem
    config:
      coordinates:
        latitude_in_degrees: 50.78
        longitude_in_degrees: 6.08
      azimuth: 180.0
      tilt: 30.0
      eta_0: 0.78
      a_1_w_m2_k: 3.2
      a_2_w_m2_k: 0.015
      old_solar_pump: false
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
      source_weight: 1
      area_m2: 4.0
      delta_temperature_n_k: 10.0
    inputs:
      - Weather
      - SolarThermalSystemController
      - DHWStorage
  SolarThermalSystemController:
    class: hisim.components.solar_thermal_system.SolarThermalSystemController
    config:
      set_temperature_difference_for_on: 10.0
    inputs:
      - SolarThermalSystem
      - DHWStorage
