# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/household_gas_solar_thermal_building_sizer.py with energy_systems/one_day_15min.simulation.yaml by the HiSim energy-system recorder v1.
# Grouped by energy_systems/household_gas_solar_thermal_building_sizer.grouping.yaml from the probe configurations of energy_systems/household_gas_solar_thermal_building_sizer.probes.yaml.
schema_version: 3
name: household_gas_solar_thermal_building_sizer
description: Basic household system setup. Shows how to set up a standard system.
components:
  Building:
    class: hisim.components.building.building.Building
    preset: german_single_family_home
    config:
      number_of_apartments: 1.0
      enable_opening_windows: true
      weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
    inputs:
      - Weather
      - L2EMSElectricityController
      - UTSPConnector
      - HeatDistributionSystem
  UTSPConnector:
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    preset: couple_both_at_work
    config:
      data_acquisition_mode: USE_LOCAL_LPG
  Weather:
    class: hisim.components.weather.Weather
    config:
      location: Aachen
      source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      data_source: DWD_TRY
      predictive_control: false
  PVSystem:
    class: hisim.components.generic_pv_system.PVSystem
    preset: rooftop
    config:
      location: AACHEN
    inputs:
      - Weather
  HeatDistributionController:
    class: hisim.components.heat_distribution_system.HeatDistributionController
    preset: building_derived
    inputs:
      - L2EMSElectricityController
      - Weather
      - Building
  CondensingGasBoiler:
    class: hisim.components.generic_boiler.GenericBoiler
    preset: condensing_gas
    inputs:
      - ModulatingBoilerController
      - DHWStorage
      - SimpleHotWaterStorage
  ModulatingBoilerController:
    class: hisim.components.generic_boiler.GenericBoilerController
    preset: modulating
    config:
      set_heating_threshold_outside_temperature_in_celsius: 18.0
      with_domestic_hot_water_preparation: true
    inputs:
      - Weather
      - HeatDistributionController
      - DHWStorage
      - SimpleHotWaterStorage
  SimpleHotWaterStorage:
    class: hisim.components.simple_water_storage.SimpleHotWaterStorage
    preset: buffer
    config:
      sizing_option: SIZE_ACCORDING_TO_GAS_HEATER
    inputs:
      - HeatDistributionSystem
      - CondensingGasBoiler
  HeatDistributionSystem:
    class: hisim.components.heat_distribution_system.HeatDistribution
    preset: building_derived
    inputs:
      - Building
      - HeatDistributionController
      - SimpleHotWaterStorage
  SolarThermalSystem:
    class: hisim.components.solar_thermal_system.SolarThermalSystem
    preset: flat_plate
    inputs:
      - Weather
      - SolarThermalSystemController
      - DHWStorage
  SolarThermalSystemController:
    class: hisim.components.solar_thermal_system.SolarThermalSystemController
    config:
      set_temperature_difference_for_on: 10.0
    inputs:
      - SolarThermalSystem
      - DHWStorage
  DHWStorage:
    class: hisim.components.simple_water_storage.SimpleDHWStorage
    preset: standard
    inputs:
      - UTSPConnector
      - SolarThermalSystem
      - input: WaterMassFlowRateFromSecondaryHeatGenerator
        from: CondensingGasBoiler.WaterOutputMassFlowDhw
      - input: WaterTemperatureFromSecondaryHeatGenerator
        from: CondensingGasBoiler.WaterOutputTemperatureDhw
  GasMeter:
    class: hisim.components.gas_meter.GasMeter
    preset: standard
    inputs:
      - from: CondensingGasBoiler.EnergyDemandDhw
        tags:
          - GAS_CONSUMPTION_UNCONTROLLED
        weight: 999
      - from: CondensingGasBoiler.EnergyDemandSh
        tags:
          - GAS_CONSUMPTION_UNCONTROLLED
        weight: 999
variants:
  electricity_management:
    selected: ems_with_battery
    options:
      ems_with_battery:
        components:
          ElectricityMeter:
            class: hisim.components.electricity_meter.ElectricityMeter
            preset: standard
            inputs:
              - from: L2EMSElectricityController.TotalElectricityToOrFromGrid
                tags:
                  - ELECTRICITY_PRODUCTION
                weight: 999
          Battery:
            class: hisim.components.advanced_battery_bslib.Battery
            preset: sized_to_pv
          L2EMSElectricityController:
            class: hisim.components.controller_l2_energy_management_system.L2GenericEnergyManagementSystem
            preset: optimize_own_consumption
            inputs:
              - from: Battery.AcBatteryPowerUsed
                component_type: BATTERY
                tags:
                  - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
                weight: 6
                dispatch:
                  target_input: LoadingPowerInput
              - from: PVSystem.ElectricityOutput
                component_type: PV
                tags:
                  - ELECTRICITY_PRODUCTION
                weight: 999
              - from: SolarThermalSystem.ElectricityConsumptionOutput
                component_type: SOLAR_THERMAL_SYSTEM
                tags:
                  - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
                weight: 4
                dispatch: {}
              - from: UTSPConnector.ElectricalPowerConsumption
                component_type: RESIDENTS
                tags:
                  - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
                weight: 1
                dispatch: {}
      metered_directly:
        components:
          ElectricityMeter:
            class: hisim.components.electricity_meter.ElectricityMeter
            preset: standard
            inputs:
              - from: PVSystem.ElectricityOutput
                component_type: PV
                tags:
                  - ELECTRICITY_PRODUCTION
                weight: 999
              - from: SolarThermalSystem.ElectricityConsumptionOutput
                component_type: SOLAR_THERMAL_SYSTEM
                tags:
                  - ELECTRICITY_CONSUMPTION_UNCONTROLLED
                weight: 999
              - from: UTSPConnector.ElectricalPowerConsumption
                tags:
                  - ELECTRICITY_CONSUMPTION_UNCONTROLLED
                weight: 999
