# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/household_heatpump_car_building_sizer.py with energy_systems/one_day_15min.simulation.yaml by the HiSim energy-system recorder v1.
schema_version: 3
name: household_heatpump_car_building_sizer
description: Basic household new system setup.
components:
  Building:
    class: hisim.components.building.building.Building
    preset: german_single_family_home
    config:
      number_of_apartments: 1.0
      enable_opening_windows: true
      weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
    inputs:
      - Weather
      - L2EMSElectricityController
      - UTSPConnector
      - HeatDistributionSystem
  UTSPConnector:
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    preset: couple_both_at_work
    config:
      data_acquisition_mode: USE_LOCAL_LPG
  Weather:
    class: hisim.components.weather.Weather
    config:
      location: Aachen
      source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      data_source: DWD_TRY
      heating_reference_temperature_in_celsius: -7.0
      predictive_control: false
  PVSystem:
    class: hisim.components.generic_pv_system.PVSystem
    preset: rooftop
    config:
      location: AACHEN
    inputs:
      - Weather
  HeatDistributionController:
    class: hisim.components.heat_distribution_system.HeatDistributionController
    preset: building_derived
    inputs:
      - L2EMSElectricityController
      - Weather
      - Building
  MoreAdvancedHeatPumpHPLibControllerSH:
    class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLibControllerSpaceHeating
    preset: standard
    inputs:
      - Weather
      - HeatDistributionController
      - L2EMSElectricityController
      - SimpleHotWaterStorage
  HeatPumpControllerDHW:
    class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLibControllerDHW
    preset: standard
    inputs:
      - L2EMSElectricityController
      - DHWStorage
  MoreAdvancedHeatPumpHPLib:
    class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLib
    preset: air_water
    config:
      with_domestic_hot_water_preparation: true
    inputs:
      - HeatPumpControllerDHW
      - MoreAdvancedHeatPumpHPLibControllerSH
      - DHWStorage
      - SimpleHotWaterStorage
      - input: TemperatureAmbient
        from: Weather.DailyAverageOutsideTemperatures
      - input: TemperatureInputPrimary
        from: Weather.DailyAverageOutsideTemperatures
  DHWStorage:
    class: hisim.components.simple_water_storage.SimpleDHWStorage
    preset: standard
    inputs:
      - UTSPConnector
      - MoreAdvancedHeatPumpHPLib
  SimpleHotWaterStorage:
    class: hisim.components.simple_water_storage.SimpleHotWaterStorage
    preset: buffer
    config:
      sizing_option: SIZE_ACCORDING_TO_HEAT_PUMP
    inputs:
      - HeatDistributionSystem
      - MoreAdvancedHeatPumpHPLib
  HeatDistributionSystem:
    class: hisim.components.heat_distribution_system.HeatDistribution
    preset: building_derived
    inputs:
      - Building
      - HeatDistributionController
      - SimpleHotWaterStorage
  Car_2_22kW_Charging_Power_avg_Speed_30_kmh_0:
    class: hisim.components.generic_car.Car
    config:
      household_name: CHR01_Couple_both_at_Work_HH1
      car_name: Car_2_22kW_Charging_Power_avg_Speed_30_kmh
      source_weight: 1
      fuel: ELECTRICITY
      consumption_per_km: 0.15
      device_co2_footprint_in_kg: 8899.4
      investment_costs_in_euro: 44498.0
      lifetime_in_years: 18.0
      maintenance_costs_in_euro_per_year: 889.96
      subsidy_as_percentage_of_investment_costs: 0.0
      occupancy_identity: use_local_lpg/CHR01 Couple both at Work/EnergySaving/Travel Route Set for 10km Commuting Distance/Bus and one 30 km/h Car/Charging At Home with 11 kW/with-appliances/CHR01 Couple both at Work/-/-
  CarBattery_1:
    class: hisim.components.advanced_ev_battery_bslib.CarBattery
    preset: standard
    inputs:
      - L1EVChargeControl_1
  L1EVChargeControl_1:
    class: hisim.components.controller_l1_generic_ev_charge.L1Controller
    config:
      charging_station_set:
        Name: Charging At Home with 11 kW
        Guid:
          StrVal: 78dae308-24c4-45cc-8bdf-b001d61f45c2
      lower_threshold_charging_power_in_watt: 1100.0
      source_weight: 1
      battery_set_soc: 0.4
      device_co2_footprint_in_kg: 100.0
      investment_costs_in_euro: 1000.0
      lifetime_in_years: 10.0
      maintenance_costs_in_euro_per_year: 50.0
      subsidy_as_percentage_of_investment_costs: 0.0
    inputs:
      - CarBattery_1
      - Car_2_22kW_Charging_Power_avg_Speed_30_kmh_0
  ElectricityMeter:
    class: hisim.components.electricity_meter.ElectricityMeter
    preset: standard
    inputs:
      - from: L2EMSElectricityController.TotalElectricityToOrFromGrid
        tags:
          - ELECTRICITY_PRODUCTION
        weight: 999
  Battery:
    class: hisim.components.advanced_battery_bslib.Battery
    preset: sized_to_pv
  L2EMSElectricityController:
    class: hisim.components.controller_l2_energy_management_system.L2GenericEnergyManagementSystem
    preset: optimize_own_consumption
    inputs:
      - from: Battery.AcBatteryPowerUsed
        component_type: BATTERY
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 6
        dispatch:
          target_input: LoadingPowerInput
      - from: L1EVChargeControl_1.BatteryChargingPowerToEMS
        component_type: CAR_BATTERY
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 5
        dispatch:
          target_input: ElectricityTargetFromEMS
      - from: MoreAdvancedHeatPumpHPLib.ElectricalInputPowerDHW
        component_type: HEAT_PUMP_DHW
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 3
        dispatch: {}
      - from: MoreAdvancedHeatPumpHPLib.ElectricalInputPowerSH
        component_type: HEAT_PUMP_BUILDING
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 2
        dispatch: {}
      - from: PVSystem.ElectricityOutput
        component_type: PV
        tags:
          - ELECTRICITY_PRODUCTION
        weight: 999
      - from: UTSPConnector.ElectricalPowerConsumption
        component_type: RESIDENTS
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 1
        dispatch: {}
