# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/household_heatpump_car_building_sizer.py with energy_systems/one_day_15min.simulation.yaml by the HiSim energy-system recorder v1.
schema_version: 3
name: household_heatpump_car_building_sizer
description: Basic household new system setup.
components:
  Building:
    class: hisim.components.building.building.Building
    preset: standard
    config:
      number_of_apartments: 1.0
      enable_opening_windows: true
      weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
    inputs:
      - Weather
      - L2EMSElectricityController
      - UTSPConnector
      - HeatDistributionSystem
  UTSPConnector:
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    preset: standard
    config:
      data_acquisition_mode: USE_LOCAL_LPG
  Weather:
    class: hisim.components.weather.Weather
    config:
      location: Aachen
      source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      data_source: DWD_TRY
      predictive_control: false
  PVSystem:
    class: hisim.components.generic_pv_system.PVSystem
    preset: rooftop
    config:
      location: AACHEN
      power_in_watt: AUTO # sized 22272.28 by _rooftop_power_in_watt <- Building.roof_area_in_m2
      weather_identity: AUTO # sized Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center by Size.WEATHER_IDENTITY <- Weather.weather_identity
    inputs:
      - Weather
  HeatDistributionController:
    class: hisim.components.heat_distribution_system.HeatDistributionController
    preset: standard
    config:
      set_heating_threshold_outside_temperature_in_celsius: AUTO # sized 18.0 by HeatDistributionControllerConfig.<lambda> <- Building.heating_load_in_watt, Building.conditioned_floor_area_in_m2
      heating_reference_temperature_in_celsius: AUTO # sized -7.0 by Size.HEATING_REFERENCE_TEMPERATURE_IN_CELSIUS <- Building.heating_reference_temperature_in_celsius
      set_heating_temperature_for_building_in_celsius: AUTO # sized 20.0 by Size.SET_HEATING_TEMPERATURE_IN_CELSIUS <- Building.set_heating_temperature_in_celsius
      set_cooling_temperature_for_building_in_celsius: AUTO # sized 25.0 by Size.SET_COOLING_TEMPERATURE_IN_CELSIUS <- Building.set_cooling_temperature_in_celsius
      heating_load_of_building_in_watt: AUTO # sized 7780.75 by Size.HEATING_LOAD_IN_WATT.rounded(2) <- Building.heating_load_in_watt
    inputs:
      - L2EMSElectricityController
      - Weather
      - Building
  MoreAdvancedHeatPumpHPLibControllerSH:
    class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLibControllerSpaceHeating
    config:
      mode: 1
      set_heating_threshold_outside_temperature_in_celsius: 18.0
      set_cooling_threshold_outside_temperature_in_celsius: 20.0
      upper_temperature_offset_for_state_conditions_in_celsius: 5.0
      lower_temperature_offset_for_state_conditions_in_celsius: 5.0
      heat_distribution_system_type: FLOORHEATING
    inputs:
      - Weather
      - HeatDistributionController
      - L2EMSElectricityController
      - SimpleHotWaterStorage
  HeatPumpControllerDHW:
    class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLibControllerDHW
    config:
      t_min_dhw_storage_in_celsius: 40.0
      t_max_dhw_storage_in_celsius: 60.0
      thermalpower_dhw_is_constant: false
      p_th_max_dhw_in_watt: 5000.0
    inputs:
      - L2EMSElectricityController
      - DHWStorage
  MoreAdvancedHeatPumpHPLib:
    class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLib
    config:
      model: Generic
      fluid_primary_side: air
      group_id: 1
      heating_reference_temperature_in_celsius: -7.0
      flow_temperature_in_celsius: 52.0
      set_thermal_output_power_in_watt: 7780.752200000001
      cycling_mode: true
      minimum_running_time_in_seconds: 3600
      minimum_idle_time_in_seconds: 3600
      minimum_thermal_output_power_in_watt: 1800.0
      position_hot_water_storage_in_system: PARALLEL
      with_domestic_hot_water_preparation: true
      passive_cooling_with_brine: false
      electrical_input_power_brine_pump_in_watt: null
      massflow_nominal_secondary_side_in_kg_per_s: 0.333
      specific_heat_capacity_of_primary_fluid: 0.0
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
    inputs:
      - HeatPumpControllerDHW
      - MoreAdvancedHeatPumpHPLibControllerSH
      - DHWStorage
      - SimpleHotWaterStorage
      - input: TemperatureAmbient
        from: Weather.DailyAverageOutsideTemperatures
      - input: TemperatureInputPrimary
        from: Weather.DailyAverageOutsideTemperatures
  DHWStorage:
    class: hisim.components.simple_water_storage.SimpleDHWStorage
    config:
      volume_heating_water_storage_in_liter: 250.0
      heat_transfer_coefficient_in_watt_per_m2_per_kelvin: 0.36
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
    inputs:
      - UTSPConnector
      - MoreAdvancedHeatPumpHPLib
  SimpleHotWaterStorage:
    class: hisim.components.simple_water_storage.SimpleHotWaterStorage
    config:
      volume_heating_water_storage_in_liter: 389.04
      heat_transfer_coefficient_in_watt_per_m2_per_kelvin: 2.0
      heat_exchanger_is_present: true
      position_hot_water_storage_in_system: PARALLEL_TO_HEAT_SOURCE
      device_co2_footprint_in_kg: null
      investment_costs_in_euro: null
      lifetime_in_years: null
      maintenance_costs_in_euro_per_year: null
      subsidy_as_percentage_of_investment_costs: null
    inputs:
      - HeatDistributionSystem
      - MoreAdvancedHeatPumpHPLib
  HeatDistributionSystem:
    class: hisim.components.heat_distribution_system.HeatDistribution
    preset: standard
    config:
      heating_system: AUTO # sized FLOORHEATING by Size.HEAT_DISTRIBUTION_SYSTEM_TYPE <- HeatDistributionController.heat_distribution_system_type
      water_mass_flow_rate_in_kg_per_second: AUTO # sized 0.27 by Size.WATER_MASS_FLOW_RATE_IN_KG_PER_SECOND.rounded(2) <- HeatDistributionController.water_mass_flow_rate_in_kg_per_second
      absolute_conditioned_floor_area_in_m2: AUTO # sized 121.2 by Size.CONDITIONED_FLOOR_AREA_IN_M2 <- Building.conditioned_floor_area_in_m2
    inputs:
      - Building
      - HeatDistributionController
      - SimpleHotWaterStorage
  Car_2_22kW_Charging_Power_avg_Speed_30_kmh_0:
    class: hisim.components.generic_car.Car
    config:
      household_name: CHR01_Couple_both_at_Work_HH1
      car_name: Car_2_22kW_Charging_Power_avg_Speed_30_kmh
      source_weight: 1
      fuel: ELECTRICITY
      consumption_per_km: 0.15
      device_co2_footprint_in_kg: 8899.4
      investment_costs_in_euro: 44498.0
      lifetime_in_years: 18.0
      maintenance_costs_in_euro_per_year: 889.96
      subsidy_as_percentage_of_investment_costs: 0.0
      occupancy_identity: use_local_lpg/CHR01 Couple both at Work/EnergySaving/Travel Route Set for 10km Commuting Distance/Bus and one 30 km/h Car/Charging At Home with 11 kW/with-appliances/CHR01 Couple both at Work/-/-
  CarBattery_1:
    class: hisim.components.advanced_ev_battery_bslib.CarBattery
    config:
      source_weight: 1
      system_id: SG1
      p_inv_custom: 10000.0
      e_bat_custom: 30.0
      total_charged_energy_in_kilowatthour: 0.0
      total_discharged_energy_in_kilowatthour: 0.0
    inputs:
      - L1EVChargeControl_1
  L1EVChargeControl_1:
    class: hisim.components.controller_l1_generic_ev_charge.L1Controller
    config:
      source_weight: 1
      charging_station_set:
        Name: Charging At Home with 11 kW
        Guid:
          StrVal: 78dae308-24c4-45cc-8bdf-b001d61f45c2
      battery_set_soc: 0.4
      lower_threshold_charging_power_in_watt: 1100.0
      device_co2_footprint_in_kg: 100.0
      investment_costs_in_euro: 1000.0
      lifetime_in_years: 10.0
      maintenance_costs_in_euro_per_year: 50.0
      subsidy_as_percentage_of_investment_costs: 0.0
    inputs:
      - CarBattery_1
      - Car_2_22kW_Charging_Power_avg_Speed_30_kmh_0
  ElectricityMeter:
    class: hisim.components.electricity_meter.ElectricityMeter
    preset: standard
    inputs:
      - from: L2EMSElectricityController.TotalElectricityToOrFromGrid
        tags:
          - ELECTRICITY_PRODUCTION
        weight: 999
  Battery:
    class: hisim.components.advanced_battery_bslib.Battery
    preset: standard
    config:
      custom_pv_inverter_power_generic_in_watt: AUTO # sized 11136.14 by 0.5 * Size.PV_PEAK_POWER_IN_WATT.rounded(2) <- PVSystem.pv_peak_power_in_watt
      custom_battery_capacity_generic_in_kilowatt_hour: AUTO # sized 22.27 by 0.001 * Size.PV_PEAK_POWER_IN_WATT.rounded(2) <- PVSystem.pv_peak_power_in_watt
  L2EMSElectricityController:
    class: hisim.components.controller_l2_energy_management_system.L2GenericEnergyManagementSystem
    preset: optimize_own_consumption
    inputs:
      - from: Battery.AcBatteryPowerUsed
        component_type: BATTERY
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 6
        dispatch:
          target_input: LoadingPowerInput
      - from: L1EVChargeControl_1.BatteryChargingPowerToEMS
        component_type: CAR_BATTERY
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 5
        dispatch:
          target_input: ElectricityTargetFromEMS
      - from: MoreAdvancedHeatPumpHPLib.ElectricalInputPowerDHW
        component_type: HEAT_PUMP_DHW
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 3
        dispatch: {}
      - from: MoreAdvancedHeatPumpHPLib.ElectricalInputPowerSH
        component_type: HEAT_PUMP_BUILDING
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 2
        dispatch: {}
      - from: PVSystem.ElectricityOutput
        component_type: PV
        tags:
          - ELECTRICITY_PRODUCTION
        weight: 999
      - from: UTSPConnector.ElectricalPowerConsumption
        component_type: RESIDENTS
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 1
        dispatch: {}
