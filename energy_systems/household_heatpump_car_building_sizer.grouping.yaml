# The grouping decision for system_setups/household_heatpump_car_building_sizer.py: what each difference between its probe
# configurations means. Edited through the workbook, committed in this form.
setup: system_setups/household_heatpump_car_building_sizer.py
probes: energy_systems/household_heatpump_car_building_sizer.probes.yaml
assignments:
  Building:
    assign: override
    note: Only the TABULA code moves. The envelope behind it - the U-values, the areas,
      the heat capacity class - is looked up by the component itself and never written
      into the file, so one archetype instead of another is a value a consumer picks
      and the component and its wiring are the same either way.
  PVSystem:
    assign: override
    note: 'Only the installed peak power moves, and only with the rooftop share. Nothing
      appears or disappears, so this is a number a consumer picks, not a part of the
      household. A share of zero is refused when the setup is built, so the knob''s
      range is (0, 1] and no value it can take flips the household into another variant.
      The car battery is not on this axis: its capacity is the car''s, not the roof''s.'
  HeatDistributionController:
    assign: override
    note: Radiators change the flow temperature curve this controller is built from.
      Same component, same wiring, different numbers - a knob, not a switch.
  MoreAdvancedHeatPumpHPLibControllerSH:
    assign: override
    note: Follows the distribution system's temperatures for the same reason as the
      controller above.
  MoreAdvancedHeatPumpHPLib:
    assign: override
    note: Its set thermal output power is the building's heating load, so a better
      insulated envelope buys a smaller pump. Same pump, same wiring, a different
      rating. Which side of the hplib Group fork its primary temperature input is
      wired on is decided by the shipped database and not by any column here, so that
      wiring is identical in all five.
  SimpleHotWaterStorage:
    assign: override
    note: The buffer volume is fifty litres per kilowatt of heat pump output, so it
      follows the same heating load one step further down. A number the building determines,
      not a component that comes or goes.
  HeatDistributionSystem:
    assign: override
    note: Radiator or floor heating is one enum plus the water mass flow rate derived
      from it; the emitter area comes from the building's conditioned floor area and
      does not move with the emitter type. The emitter is present either way.
  ElectricityMeter:
    assign: variant:electricity_management
    note: 'Present in every configuration and wired differently: fed by the energy
      manager''s grid balance when there is one, and by every participant directly
      when there is not - the car controller included, as an uncontrolled consumption.
      A group can add and remove a component but cannot rewire one that survives,
      so this is the row that forces a variant. Written out in full in both options.'
  Battery:
    assign: variant:electricity_management/ems_with_battery
    note: Exists only in the world that has an energy manager; the setup builds the
      two together and there is no battery-without-manager mode. Its capacity also
      follows the rooftop share, which stays a knob on top of the membership. This
      is the stationary battery, not the car's.
  L2EMSElectricityController:
    assign: variant:electricity_management/ems_with_battery
    note: 'The other half of that world, and the component the meter''s two wirings
      are about. The car controller''s charging power is one of the inputs that moves
      with it: the manager takes it as a controlled consumption here and the meter
      takes it as an uncontrolled one in the other option, so the car triple itself
      is identical in both and the whole difference is written on this row and the
      meter''s.'
configurations:
  baseline:
    variants:
      electricity_management: ems_with_battery
  no_battery_ems:
    variants:
      electricity_management: metered_directly
  half_pv:
    variants:
      electricity_management: ems_with_battery
  radiator:
    variants:
      electricity_management: ems_with_battery
  nineties_building:
    variants:
      electricity_management: ems_with_battery
