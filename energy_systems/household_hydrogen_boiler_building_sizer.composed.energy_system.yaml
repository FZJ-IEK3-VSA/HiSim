# The composed file of the hydrogen twin (assemblies_spec.md §8, §13 step 5): the site with the twin's site values plus
# the seven imports from energy_systems/assemblies/ that reproduce
# household_hydrogen_boiler_building_sizer.energy_system.yaml, the recorded twin of
# system_setups/household_hydrogen_boiler_building_sizer.py (the option ems_with_battery of its grouped file).
# tests/assemblies/test_twin_gates.py expands it, renames the members to the twin's names and asserts the twin outside
# the intended differences, and runs both for one day: every result column equal.
#
# Site component names are the twin's; a site entry carries a `ports:` block only where an import binds to it, and
# `{$port: <port>}` in its inputs marks where the bound port's items land. `order:` is the evaluation order within a
# time step (spec §2.3): Building 1, UTSPConnector 2, Weather 3, pv 4, HeatDistributionController 5, HeatingCurveController 6, heating 7 (Boiler,
# Controller, Buffer), dhw 10, HeatDistributionSystem 11, hydrogen 12, grid 13, battery 14, control 15: the twin
# evaluates its GasMeter after the distribution and before the electricity meter. Against the twin, the buffer before
# the cylinder is a neutral swap (dry run §9.1). The hydrogen connection is the one provider of hydrogen, so the
# boiler's fuel need binds it by default.

schema_version: 4
name: household_hydrogen_boiler_building_sizer
description: Basic household new system setup.

components:
  Building:
    order: 1
    class: hisim.components.building.building.Building
    preset: german_single_family_home
    config:
      number_of_apartments: 1.0
      enable_opening_windows: true
      weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
    inputs:
      - Weather
      - {$port: temperature_modifier}
      - UTSPConnector
      - HeatDistributionSystem
    ports:
      temperature_modifier: {partner: L2GenericEnergyManagementSystem, optional: true}   # BuildingTemperatureModifierInKelvin
    optional-bind: {temperature_modifier: control}
  UTSPConnector:
    order: 2
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    preset: couple_both_at_work
    config:
      data_acquisition_mode: USE_LOCAL_LPG
  Weather:
    order: 3
    class: hisim.components.weather.Weather
    config:
      location: Aachen
      source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      data_source: DWD_TRY
      heating_reference_temperature_in_celsius: -7.0
      predictive_control: false
  HeatDistributionController:
    order: 5
    class: hisim.components.heat_distribution_system.HeatDistributionController
    preset: building_derived
    inputs:
      - HeatingCurveController
      - HeatDistributionSystem
      - Building
      - {$port: buffer}
    ports:
      buffer: {partner: SimpleHotWaterStorage}               # the buffer's end temperatures, for the circuit's fraction
  HeatingCurveController:
    order: 6
    class: hisim.components.heating_curve.HeatingCurveController
    preset: building_derived
    inputs:
      - {$port: temperature_modifier}
      - Weather
    ports:
      temperature_modifier: {partner: L2GenericEnergyManagementSystem, optional: true}   # BuildingTemperatureModifierInKelvin
    optional-bind: {temperature_modifier: control}
  HeatDistributionSystem:
    order: 11
    class: hisim.components.heat_distribution_system.HeatDistribution
    preset: building_derived
    inputs:
      - HeatDistributionController
      - Building
      - {$port: space_heating}
    ports:
      space_heating: {circuit: space_heating}               # pump and return leg are the distribution's

imports:
  heating:
    order: 7
    assembly: heating/hydrogen_boiler
  dhw:
    order: 10
    assembly: dhw/indirect_cylinder
    bind: {circuit: heating.dhw}
  hydrogen:
    order: 12
    assembly: supply/hydrogen_connection
  pv:
    order: 4
    assembly: pv/array
    instances: {pv_system: {}}                              # the legacy single array's id (spec §10.4)
  battery:
    order: 14
    assembly: storage/battery
    instances: {battery: {}}
  control:
    order: 15
    assembly: control/ems_self_consumption
  grid:
    order: 13
    assembly: supply/electricity_grid
