# yaml-language-server: $schema=../hisim/energy_system_v3.schema.json
# Recorded from system_setups/simple_air_conditioner_household_building_sizer.py with simulation_parameters/one_day_15min_export.simulation.yaml by the HiSim energy-system recorder v1.
# Grouped by energy_systems/simple_air_conditioner_household_building_sizer.grouping.yaml from the probe configurations of energy_systems/simple_air_conditioner_household_building_sizer.probes.yaml.
schema_version: 3
name: simple_air_conditioner_household_building_sizer
description: Simple air-conditioner household building-sizer system setup.
components:
  Building:
    class: hisim.components.building.building.Building
    preset: german_single_family_home
    config:
      number_of_apartments: 1.0
      enable_opening_windows: true
      weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
    inputs:
      - Weather
      - input: ThermalPowerDelivered
        from: SimpleAirConditioner.ThermalPowerDelivered
  Weather:
    class: hisim.components.weather.Weather
    config:
      location: Aachen
      source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      data_source: DWD_TRY
      heating_reference_temperature_in_celsius: -7.0
      predictive_control: false
  SimpleAirConditioner:
    class: hisim.components.simple_air_conditioner.SimpleAirConditioner
    preset: standard
    inputs:
      - SimpleAirConditionerController
      - Building
      - Weather
  SimpleAirConditionerController:
    class: hisim.components.simple_air_conditioner.SimpleAirConditionerController
    preset: standard
    inputs:
      - Building
