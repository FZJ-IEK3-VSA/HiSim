# The module configurations simple_air_conditioner_household_building_sizer is recorded under.
# Two columns, because this setup has two states worth recording and no more. It reads no field of
# the EnergySystemConfig at all - no photovoltaic share, no battery-and-manager flag, no
# heat-distribution enum - so the fork that makes every other sizer's table interesting does not
# exist here, and there is nothing a variant or a group could be about. What it does read is the
# ArcheTypeConfig, and the building code is probed as the representative of that half for the same
# reason as everywhere else in the fleet: it is the field that reaches furthest, and the whole point
# of recording it is to prove that the reach is values and not structure.
#
# A two-column list is the smallest one that proves anything. A baseline alone would make the
# grouped file a copy of the twin with a header line added and would assert nothing that the twin
# does not already assert; the second column is what turns "this setup has no structure" from an
# assumption into a byte-for-byte result.
setup: system_setups/simple_air_conditioner_household_building_sizer.py
defaults: hisim.building_sizer_utils.interface_configs.modular_household_config.ModularHouseholdConfig.get_default_config_for_household_heatpump
probes:
  - column: baseline
    description: >-
      The class defaults, recorded with no module configuration at all, which is what makes this
      column's flat file the committed twin: the 1958-1968 single-family house, its weather, and the
      air conditioner and controller that both stand at their own class defaults.

  - column: nineties_building
    description: >-
      A 1995-2001 single-family house instead of a 1958-1968 one: the same TABULA archetype, one
      construction-year band later. In every other sizer this is the widest value cascade there is;
      here it stops at the building, because the air conditioner and its controller are built from
      their own defaults and no sizing context reaches them. That is exactly what the column is for -
      it says the cascade ends where the file says it ends.
    module_config:
      archetype_config_.building_code: DE.N.SFH.09.Gen.ReEx.001.002
