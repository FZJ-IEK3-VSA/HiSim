# RenoVisor → HiSim calculation request — mockup 1: a mostly uncustomized house.
#
# One request = one house inventory + one list of measures = one simulation.
# The inventory carries ONLY what was set in the frontend; the backend fills in
# every missing value with a documented default and reports what it filled in.
# Field names are HiSim's energy-system vocabulary wherever HiSim has the field
# (snake_case, unit in the name); enum values are measures.yaml's wherever a
# measure can change the field, so that applying a measure is a plain overwrite.
# Normative: calculation-request.schema.json; the rules: calculation-request.md.
#
# Nothing in this body identifies the submission: the backend's job_id is the
# hash of the canonical body, and identical bodies are one cached simulation.
# Correlation (trace id) travels in HTTP headers, outside the hashed content.

schema_version: 1

location:
  country: IE # → Weather.for_location: IE (Dublin, NSRDB 15-min, 2019)

house:
  building:
    # + construction_year → TABULA IE.N.SFH.05.Gen.ReEx.001.001, the exact band: the Building
    # guards every zero envelope area now (hisim-4g9.1), so band 05's row without door or window
    # area is selectable again and the former nearest-band substitution is gone. The row's own
    # geometry is the zero-area one until the row is patched (C4, hisim-epc.18).
    building_type: detached_sfh
    construction_year: 1975
    absolute_conditioned_floor_area_in_m2: 140 # Building field, verbatim
    set_heating_temperature_in_celsius: 21 # Building field, verbatim; the form's kept default

    # Envelope, per element, in HiSim's element names (facade, not walls) and in
    # U-values: the wizard's country-pack ids ("300mm_cavity" + "cavity_beads")
    # are turned into W/(m²·K) by the frontend's country pack. The backend takes
    # the number and writes it to Building.<element>_u_value_… verbatim; areas
    # are absent, so they come from the TABULA archetype.
    roof:
      u_value_in_watt_per_m2_per_kelvin: 0.4 # "100mm_ceiling" (illustrative; the country pack owns the real table)
      shape: pitched # → PV and solar-thermal tilt 30°
    facade:
      u_value_in_watt_per_m2_per_kelvin: 1.78 # "300mm_cavity", uninsulated — TABULA IE uninsulated cavity wall (1.1 is the partially filled one)
    floor:
      u_value_in_watt_per_m2_per_kelvin: 0.7 # "solid_ground", uninsulated (illustrative; TABULA IE floors run 0.42–1.96 — the physics owner settles the id → code mapping)
    window:
      u_value_in_watt_per_m2_per_kelvin: 3.7 # "pvc_double_air" — TABULA IE 6 mm air-filled double unit (2.8 is the argon-filled one)
      glazing_panes: 2
    door:
      u_value_in_watt_per_m2_per_kelvin: 3.0 # "solid_wood"

  occupancy:
    number_of_residents: 3 # MVP: not_implemented_yet — every household runs as the CHR01 couple profile

  heating:
    type_of_system: conventional_gas_heating # SAME enum as measure heating_system.type_of_system → base file "gas", boiler_type CONVENTIONAL
  heat_distribution:
    type_of_system: conventional_radiator # SAME enum as measure heating_installation.type_of_system → RADIATOR

  # Not set in the frontend, therefore absent — the backend defaults them and
  # says so in the mapping report:
  #   hot_water (together_with_heating_system), ventilation, temperature_control,
  #   air_conditioning, appliances, pv_system (none), battery (none),
  #   solar_thermal_system (none), electric_vehicles (none),
  #   building.number_of_storeys, building.tabula_building_code, every area_in_m2,
  #   occupancy.home_office_days_per_week.

measures:
  # `{id, options}` as in measures.yaml — the request carries everything from the
  # catalogue the backend can act on (ids and values) and nothing it cannot
  # (labels, descriptions, access levels). A material is sent as its physical
  # properties, taken from materials.yaml by the frontend, so the backend needs
  # no catalogue lookup at all; the id stays as provenance for the mapping report.
  # An id or value the translation layer does not know is refused by name (§7).
  - id: heating_system
    options:
      type_of_system: air_source_heat_pump
  - id: heating_installation
    options:
      type_of_system: low_temperature_radiator
  - id: external_insulation
    options:
      thickness_in_mm: 120
      material: # the catalogue's value resolved to its materials.yaml row; field names verbatim from that file
        asp_id: polystyrene_eps_rigid_board
        thermal_conductivity_w_mk: 0.0355
        heat_capacity_j_kgk: 1400
        density_kg_m3: 20.5 # midpoint of the file's range 11–30
        co2_footprint_a1_a3_c3_c4_kg_m2: 21.207108
        lifespan_years: 57.5 # midpoint of the file's range 40–75
  - id: photovoltaic_system
    options:
      size_in_percent_of_roof_area: 60
  - id: hot_water_tank_and_pipe_insulation # no options in the catalogue → none here
