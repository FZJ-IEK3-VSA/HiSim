# Proposal — GET /api/v1/hisim/{version}/measures
#
# A SELF-CONTAINED OpenAPI 3.1 document for ONE endpoint of the simulation
# backend: which measures of the measure catalogue one engine version implements, as
# reported BY THE HISIM–RENOVISOR TRANSLATION LAYER ITSELF.
#
# Deliberately separate from what the backend as a service can do (countries,
# variants, queue, lookups — see backend-functions.md). It references nothing
# in renovisor-api-contract/openapi.yaml, which is an old hand-written draft and
# is not binding.
#
# ONE DOCUMENT PER ENGINE VERSION. The backend is a version registry hosting many
# pinned HiSim images at /api/v1/hisim/{version}/...; the frontend resolves its
# track's channel to a version at startup and never writes the segment itself.
# The document is produced once at version registration by running the
# translator's `capabilities` command in the image, and is immutable for the
# life of the version.
openapi: 3.1.0
info:
  title: RenoVisor simulation backend — implemented measures (proposal)
  version: 0.5.0
  description: |
    The measure capabilities of one registered engine version.

    THE DOCUMENT IS AN OUTPUT OF THE TRANSLATION LAYER, NOT A HAND-KEPT LIST.
    The translator that turns a RenoVisor request into a HiSim configuration
    already reports, per run, what it did with every field (`mapping_report`:
    `used` / `approximated` / `defaulted` / `not_implemented_yet`). This document is that
    same report taken over the whole measure catalogue instead of over one
    request: at image build time the translator is run against a probe set —
    a reference home plus, for every catalogue measure, one request per enum
    value and per numeric boundary — and the per-field results are aggregated
    per measure and option. A measure the translator accepts without acting on it
    (an entry of its not_implemented_yet list) is `not_implemented_yet`.

    Because it is produced by running the translator, it cannot announce
    something the translator does not do. It is produced once per engine
    version, at registration, by running the translator in the image, and is
    served verbatim for the life of that version.

    STRICT SINCE 0.3.0 (2026-09-23). Every key the translator always writes is
    `required`, and no object admits a key this schema does not declare. The
    translator validates its own output against this schema before writing it,
    so a key it starts to emit fails its build until this file declares it: the
    schema cannot fall behind the served document again, as it had with
    `fields`, `substitution`, `results` and `translator.version`.

    CONDITIONAL STATUSES SINCE 0.5.0 (2026-09-26). A measure, option, field or
    value may carry `conditions`: the status it has instead when the request
    also states something else (see `OptionCondition`). The key is optional,
    so a 0.4.0 document is a valid 0.5.0 document, and a consumer that ignores
    it reads the unconditional status as before.
servers:
  - url: https://host.example/renosfh-backend/api/v1/hisim
    description: The backend; {version} below is resolved from GET /versions → channels.<track>.
security:
  - ApiKey: []
paths:
  /{version}/measures:
    get:
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: string, examples: ['v20260919-1'] }
          description: A registered engine version; the frontend uses the one its track's channel resolves to.
      operationId: getImplementedMeasures
      summary: The catalogue measures this engine version implements, per the translation layer
      description: |
        Guarantees:
        - EVERY measure of the measure catalogue appears exactly once, and every
          option the catalogue declares for it appears exactly once in its
          `options`. A consumer that finds one missing treats the answer as
          invalid and refuses to start against this version.
        - Compatibility is checked by content: a consumer verifies that every
          id, option name and enum value of ITS catalogue appears here (present
          with `not_implemented_yet` counts as appearing) and refuses to start naming
          each one that does not. There is no catalogue hash: it would need a
          second catalogue parser on this side and would reject every request
          after any unrelated catalogue edit.
        - The statuses are the `mapping_report` vocabulary, so what is announced
          here and what a run reports can be compared one to one. What is
          announced for a request is the status the `conditions` that apply to
          it give, or the unconditional `status` when none applies. A run that
          reports an option WORSE than announced for it (announced `used`,
          reported `not_implemented_yet`) is a translator bug.
        - A submission holding a measure announced here as `not_implemented_yet`
          is accepted and simulated without it; the run's mapping report carries
          this document's note for it. Only a measure, option or value the
          catalogue does not have is refused (422, see the calculation-request
          spec §7).
        - Immutable for the life of the version: the document is produced at
          registration from the pinned image and never changes afterwards.
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              description: Strong; distinct per version.
              schema: { type: string }
            Cache-Control: { schema: { type: string, examples: ['max-age=31536000, immutable'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImplementedMeasures' }
        '304': { description: Not modified. }
        '401': { description: Missing or wrong X-Api-Key. }
components:
  securitySchemes:
    ApiKey: { type: apiKey, in: header, name: X-Api-Key }
  schemas:
    ImplementedMeasures:
      type: object
      required: [engine, engine_version, translator, measures, fields, results]
      additionalProperties: false
      properties:
        engine: { type: string, examples: [hisim] }
        engine_version:
          type: string
          description: |
            The HiSim build inside this container. Identification, not routing: it
            appears in results too, so a consumer can tell that two runs came from
            the same build (and must compare base and measures runs only if they did).
          examples: ['hisim-7b8d517']
        translator:
          type: object
          description: The translation layer that produced this document.
          required: [version, commit, hisim_commit, request_schema_version, catalogue_revision, probes]
          additionalProperties: false
          properties:
            version:
              type: string
              pattern: '^\d+\.\d+\.\d+$'
              description: The translator's semantic version (`TRANSLATOR_VERSION`), e.g. `2.1.0`.
            commit:
              type: string
              description: Commit of the translator in this image; `unknown` when the image does not say.
            hisim_commit:
              type: string
              description: The HiSim commit the translator was built against; `unknown` when the image does not say.
            request_schema_version:
              type: integer
              description: The calculation-request schema version this build accepts.
            catalogue_revision:
              type: string
              description: |
                Identification only (never compared): the contract-repo revision the
                probe set read measures.yaml from, e.g. `renovisor-api-contract@c3d9e1f`.
            probes:
              type: integer
              description: How many probe requests the document was aggregated from.
        measures:
          type: array
          description: One entry per catalogue measure — all of them, implemented or not.
          items: { $ref: '#/components/schemas/ImplementedMeasure' }
        fields:
          type: array
          description: |
            One entry per request path the probes varied or carried — the leaves of
            `house`, and the few paths outside it the mapping reports name (such as
            `location.postcode`) — in path order: the same aggregation as for measure
            options, over the request instead of the catalogue.
          items: { $ref: '#/components/schemas/ImplementedField' }
        results:
          $ref: '#/components/schemas/ResultFields'
    ImplementedMeasure:
      type: object
      required: [measure_id, status, options, hisim_targets, substitution]
      additionalProperties: false
      properties:
        measure_id:
          type: string
          description: The `id` of the measure in measures.yaml.
          examples: [external_insulation]
        status:
          type: string
          enum: [supported, approximated, not_implemented_yet]
          description: |
            Derived from the probes, never declared:
            supported           — the measure is mapped and every `everyone` option is `used`.
            approximated        — mapped, but an `everyone` option is `approximated` or
                                  `not_implemented_yet` (the measure acts, a detail does not).
            not_implemented_yet — the measure itself is listed: accepted, no effect on
                                  the simulation, its note carried here.
            `experts` options and individual values carry their own status and never
            change the measure's. This is the unconditional status: the one that holds
            when none of `conditions` applies.
        conditions:
          type: array
          description: |
            Where the measure's status differs in combination with another request
            leaf (the solar-thermal measure on an oil-heated house). Absent when it
            never does.
          items: { $ref: '#/components/schemas/MeasureCondition' }
        options:
          type: array
          description: One entry per option the catalogue declares for this measure.
          items: { $ref: '#/components/schemas/ImplementedOption' }
        hisim_targets:
          type: array
          description: |
            What the translator writes in the HiSim configuration for this
            measure (component and parameter names). For debugging and review;
            consumers must not build logic on it.
          items: { type: string }
        substitution: { $ref: '#/components/schemas/Substitution' }
        note:
          type: string
          description: |
            The translator's own note, in plain language — the same text its
            mapping_report carries. Shown to the user next to the measure.
    ImplementedOption:
      type: object
      required: [name, status]
      additionalProperties: false
      properties:
        name: { type: string, examples: [thickness_in_mm] }
        status:
          type: string
          enum: [used, approximated, defaulted, not_implemented_yet]
          description: |
            The option's own status: how the option as a whole is mapped. Individual
            values carry their own status in `values` and do not change it. This is the
            unconditional status: the one that holds when none of `conditions` applies.
        conditions:
          type: array
          description: "Where the option's status differs in combination with another request leaf; absent when it never does."
          items: { $ref: '#/components/schemas/OptionCondition' }
        accepted_values:
          type: array
          description: |
            For enums — every catalogue value (all of them are accepted; a value not
            in the catalogue is refused as unknown). Kept for consumers that only
            need the list; `values` carries the status per value. Absent for a
            `material` option, whose values are materials.yaml rows found by reverse
            lookup and whose request value is the material object.
          items: {}
        values:
          type: array
          description: For enums — one entry per catalogue value with its own status and note.
          items: { $ref: '#/components/schemas/ImplementedValue' }
        minimum: { type: number, description: "For numbers — the lowest value probed, from the request schema's bounds." }
        maximum: { type: number, description: "For numbers — the highest value probed, from the request schema's bounds." }
        note: { type: string }
    ImplementedField:
      type: object
      description: |
        One leaf of the calculation request's `house`, as ImplementedOption is one
        option of a measure. An enumerated field (including booleans and the
        glazing-pane counts) carries `values`, one per value with its own status; a
        numeric field carries the request schema's own bounds and no `values`: an
        inclusive bound as `minimum`/`maximum`, an exclusive one as
        `exclusiveMinimum`/`exclusiveMaximum` (JSON Schema's names), and nothing
        for an end the request schema leaves open — never a value HiSim chose. The
        probes near both ends count towards the field's own status.
      required: [path, status, substitution]
      additionalProperties: false
      properties:
        path:
          type: string
          description: The dotted request path, `house.` included.
          examples: [house.hot_water.supply]
        status:
          type: string
          enum: [used, approximated, defaulted, not_implemented_yet]
          description: |
            The field's own status; its values' statuses do not change it. This is the
            unconditional status: the one that holds when none of `conditions` applies.
        conditions:
          type: array
          description: "Where the field's status differs in combination with another request leaf; absent when it never does."
          items: { $ref: '#/components/schemas/OptionCondition' }
        values:
          type: array
          description: For enumerated fields — one entry per value with its own status.
          items: { $ref: '#/components/schemas/ImplementedValue' }
        minimum: { type: number, description: "For numeric fields — the request schema's inclusive lower bound; absent when it declares none." }
        maximum: { type: number, description: "For numeric fields — the request schema's inclusive upper bound; absent when it declares none." }
        exclusiveMinimum: { type: number, description: "For numeric fields — the request schema's exclusive lower bound (the value must be greater)." }
        exclusiveMaximum: { type: number, description: "For numeric fields — the request schema's exclusive upper bound (the value must be smaller)." }
        substitution: { $ref: '#/components/schemas/Substitution' }
        note: { type: string }
    ImplementedValue:
      type: object
      description: One value of an enumerated option or field, with its own status.
      required: [value, status, substitution]
      additionalProperties: false
      properties:
        value: {}
        status:
          type: string
          enum: [used, approximated, not_implemented_yet]
          description: "The value's unconditional status: the one that holds when none of `conditions` applies."
        conditions:
          type: array
          description: "Where this value's status differs in combination with another request leaf; absent when it never does."
          items: { $ref: '#/components/schemas/ValueCondition' }
        substitution: { $ref: '#/components/schemas/Substitution' }
        note: { type: string }
    OptionCondition:
      type: object
      description: |
        One entry of the `conditions` of an option or an inventory field. It says:
        when the request ALSO states everything `when` lists, the status is
        `status` instead of the unconditional one, for the reason `note` gives.
        `MeasureCondition` and `ValueCondition` are the same entry in the
        vocabulary of their level.

        - `when` is a conjunction: the entry applies only if every term holds.
        - The entries are alternatives. When more than one applies, the WORST of
          their statuses wins, in the order the aggregation uses
          (calculation-request.md §8 step 4: `used` < `defaulted` < `approximated`
          < `not_implemented_yet`; on a measure `supported` < `approximated` <
          `not_implemented_yet`), and the notes of every applying
          entry at that status are shown together.
        - An entry may be better or worse than the unconditional status (a flow
          temperature is `not_implemented_yet` on a boiler and `used` on a heat
          pump): it states the status the combination has, nothing else.
        - A combination no entry names has the unconditional status. The entries
          come from the probe set's combination probes, so a combination no probe
          tries is not announced.

        A condition carries no `substitution` (owner decision 2026-09-26: a
        stand-in is announced properly or not at all); its `note` says what the
        combination does.

        The same word as `ResultField.conditions` on purpose: there, sentences
        that change a published provenance; here, the terms that change an
        announced status.
      required: [when, status, note]
      additionalProperties: false
      properties:
        when: { $ref: '#/components/schemas/ConditionTerms' }
        status:
          type: string
          enum: [used, approximated, defaulted, not_implemented_yet]
        note:
          type: string
          description: "The translator's sentence for this combination: the note a run's mapping report carries when the entry applies."
    MeasureCondition:
      type: object
      description: "One entry of a measure's `conditions`, as OptionCondition, in the measure level's vocabulary."
      required: [when, status, note]
      additionalProperties: false
      properties:
        when: { $ref: '#/components/schemas/ConditionTerms' }
        status:
          type: string
          enum: [supported, approximated, not_implemented_yet]
        note: { type: string }
    ValueCondition:
      type: object
      description: "One entry of an enumerated value's `conditions`, as OptionCondition, in the value level's vocabulary."
      required: [when, status, note]
      additionalProperties: false
      properties:
        when: { $ref: '#/components/schemas/ConditionTerms' }
        status:
          type: string
          enum: [used, approximated, not_implemented_yet]
        note: { type: string }
    ConditionTerms:
      type: array
      description: The terms of one condition, all of which must hold.
      minItems: 1
      items: { $ref: '#/components/schemas/ConditionTerm' }
    ConditionTerm:
      type: object
      description: |
        One leaf of the same request and the values that make the term hold. The
        term holds when the request states `path` and its value is one of `in`,
        compared as JSON values. A leaf the request does not state does not match,
        even where the translator would default it, and neither does an option of
        a measure the package does not hold. The leaf is read as the request
        states it, not as its measures leave the house: where a measure can set
        the leaf the translator decides on (a `heating_system` measure sets the
        generator), the document carries one entry per spelling. There is no
        negation: a condition on "every generator but these three" lists the
        others in `in`. Negation, absence and numeric ranges wait for a real
        case that needs them.
      required: [path, in]
      additionalProperties: false
      properties:
        path:
          type: string
          description: |
            A request path in the mapping report's spelling, which `fields` uses too:
            `house.<leaf>` or `location.<leaf>` for the inventory, and
            `measures[id=<measure_id>].options.<option>` for an option of the
            package's entry with that id (a package holds each id at most once).
          pattern: '^((house|location)(\.[a-z0-9_]+)+|measures\[id=[a-z0-9_]+\]\.options\.[a-z0-9_]+)$'
          examples: [house.heating.type_of_system, 'measures[id=heating_system].options.type_of_system']
        in:
          type: array
          minItems: 1
          description: "The values that make the term hold; a single entry for plain equality."
          items: {}
    Substitution:
      type: boolean
      description: |
        Whether the note describes a stand-in: `true` means the run simulates
        something else in place of what was asked (e.g. `hybrid_heat_pump` → an
        air-source heat pump), so the result differs; `false` means either no
        stand-in or no effect at all. The frontend offers a substituted value with
        its "would be simulated as …" wording (greyed, owner decision 2026-09-19).
    ResultFields:
      type: object
      description: |
        What `result.json` can carry, one entry per field, in payload order. The
        two arrays are the two blocks of the payload and are addressed by the same
        dotted paths its `missing` entries use, so a consumer can join the two.
        Since translator 2.1.0 `result.json` carries no money: every `costs` entry
        is `absent` and names where the figure lives in `economics_result.json`.
      required: [kpis, costs]
      additionalProperties: false
      properties:
        kpis:
          type: array
          description: One entry per field of the payload's `kpis` block.
          items: { $ref: '#/components/schemas/ResultField' }
        costs:
          type: array
          description: |
            One entry per former field of the payload's `costs` block (and per leaf
            of a nested field that could be absent on its own).
          items: { $ref: '#/components/schemas/ResultField' }
    ResultField:
      type: object
      description: |
        One field of `result.json`. An entry says one of two things, and a field
        that is published *sometimes* says both:

        - published: `provenance` is one of the three payload provenances and
          `source` names where the number is read from. `conditions` lists what
          changes that provenance — an annual figure scaled from a one-day run is
          PARTIAL rather than SIMULATED, and says so here rather than surprising
          the consumer at read time.
        - absent: `provenance` is `absent`, `reason` is the sentence the payload's
          `missing` entry carries verbatim, and `when` says under which
          circumstances the field is missing (`always …` for a field no run fills
          in yet).
      required: [field, provenance]
      additionalProperties: false
      properties:
        field:
          type: string
          description: |
            The field's dotted path in `result.json`, block included — the same
            path `result.json["missing"]` uses for it.
          examples: ['kpis.energy_demand_in_kilowatt_hour_per_year', 'costs.grant_in_euro']
        provenance:
          type: string
          enum: [SIMULATED, PARTIAL, MOCKED, absent]
          description: |
            What the published value is: computed from the run (SIMULATED),
            computed but with at least one estimated or extrapolated input
            (PARTIAL), a constant standing in for a missing model (MOCKED), or not
            published at all (absent).
        source:
          type: string
          description: |
            Where the number comes from, in enough detail to find it: the HiSim KPI
            name, the cost engine field, the economics document key, or the contract
            schema path a mocked constant is read from. Absent only for a field that
            has no source at all because nothing computes it.
        conditions:
          type: array
          description: |
            What changes the published provenance, one sentence each. Absent when
            the provenance never changes.
          items: { type: string }
        reason:
          type: string
          description: |
            The sentence `result.json["missing"]` carries for this field, verbatim.
            Present for every field that can be absent, published or not.
        when:
          type: string
          description: |
            Under which circumstances the field is absent, in one phrase. Present
            for every field that can be absent, published or not.
