openapi: 3.1.0

info:
  title: RenoVisor API
  version: 0.3.0-draft
  description: |
    Co-owned contract between the frontend and backend teams. This is a draft
    PROPOSAL for sign-off, not a finished spec.

    ## Auth (v0.3)

    This is a calculation service over non-PII, content-addressed inputs, so it
    is PUBLIC by default: home-inventory lookups and creation, package
    registration, package sets, and all calculation reads need no token, which
    is what lets anonymous users explore. A JWT MAY still be sent and used where
    useful (e.g. logging); no operation of this draft requires one. The
    bearerAuth scheme stays declared for user-scoped endpoints a later revision
    may add. Changed from v0.2, where bearerAuth was required globally; the
    account-deletion endpoint of v0.3 was removed on 2026-09-20.

    ## Async model (v0.2)

    Calculation results are a deterministic function of content-addressed
    inputs: virtually, every result already exists, some just take longer to
    materialise. So results are READ with GET, not triggered with POST:

      - GET a result URL. If it is not ready you get 202 with a status
        (queued or running). Poll the same URL.
      - When finished you get 200 with the result. Because the input is
        content-addressed, a finished result never changes and may be cached
        indefinitely (Cache-Control: public, max-age=31536000, immutable).
      - A GET lazily starts the computation on first call. The backend MUST
        coalesce concurrent/duplicate GETs for the same hash into one job, so a
        refresh or a link scanner cannot multiply compute.

    The frontend never manages jobs; there is no /jobs endpoint. Status lives
    on the result resource. Status vocabulary: queued, running, finished,
    refused, failed. Errors use RFC 7807.

    Response envelopes carry NO id: hi_id and pkg_id are already in the URL.
    Finished RESULT bodies remain self-identifying (home_inventory_id,
    package_id), because the frontend's staleness and comparison logic depends
    on them.

    ## Two-part contract

    Every schema carries an `x-contract-status` tag:
      - STABLE ENVELOPE: endpoint shapes, the status model, the error format,
        auth, IDs, naming. Changes need sign-off from both teams.
      - PROVISIONAL PAYLOAD: calculation result contents (kpis, costs, measures,
        package, ...) and the home inventory field set. Owned by the backend,
        will change as the models mature. Shapes here are placeholders.

    ## Shared home-inventory schema

    `HomeInventoryInput`, with the two enums it uses (`ComponentCondition`,
    `GrantScheme`), is consumed by other projects on its own and therefore
    lives in the sibling file `homeinventory.yaml`. This file does not copy
    it; it refers to it by relative reference,
    `homeinventory.yaml#/components/schemas/HomeInventoryInput`, so the two
    files are always shipped together and are complete only side by side.
    Until 0.3.0-draft the schema was declared inline here.

    ## Open decisions for this PR
      - Whether `refused`/`failed` stay 200-with-status (as drafted) or map to
        422 / 500.
      - Whether a package hash covers only its blocks or also the `hi_id`.
        Either is fine, but the rule MUST be identical for package-set packages
        and user-registered packages, or dedup and comparability break.
      - Retry-After cadence for pending responses.

    ## Conventions
      - snake_case, lowercase, for JSON fields and URL segments
      - No trailing slashes
      - Dates ISO 8601 (e.g. 2026-09-15T14:30:00Z)
      - Currency always EUR; monetary fields carry an _euro suffix
      - Units carried in field names (_mm, _kwh, _m2, _kw, _c)
      - A /v1 prefix will be added via the server URL once stable

    ## Changes since 0.1
      - packageset / fast-estimate / detailed-simulation: POST -> GET
      - Removed POST bodies from the calculation endpoints
      - Removed GET /jobs/{job_id}
      - Added POST /homeinventories/{hi_id}/packages to register a
        user-defined package and mint its content-hash pkg_id
      - Replaced Job/JobAccepted with CalculationStatus on the result resource
      - Home inventories: immutable, no PATCH (resolves a contradiction in the
        source spec document)

servers:
  - url: https://api.renovisor.example
    description: Placeholder. Replace with the real base URL (and add /v1 later).

# Public by default (see "Auth" in the description above). Individual
# operations opt INTO auth with their own `security` block; currently none does.
security: []

tags:
  - name: landing-page
  - name: home-inventories
  - name: packages
  - name: calculations
  - name: materials

paths:
  /:
    get:
      tags: [landing-page]
      summary: Show the landing page
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema: { $ref: '#/components/schemas/LandingPage' }
  /homeinventories:
    post:
      tags: [home-inventories]
      summary: Create a home inventory from full building data
      description: Returns the content hash as the ID. Identical data returns the same ID (deduplication).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'homeinventory.yaml#/components/schemas/HomeInventoryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeInventory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [home-inventories]
      summary: List all home inventories for the current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HomeInventory' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /homeinventories/{hash}:
    parameters:
      - $ref: '#/components/parameters/Hash'
    get:
      tags: [home-inventories]
      summary: Load a home inventory (immutable, cacheable forever)
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeInventory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [home-inventories]
      summary: Delete a home inventory
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /homeinventories/from-ber:
    post:
      tags: [home-inventories]
      summary: Create a home inventory from a BER number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ber]
              properties:
                ber: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeInventory' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /homeinventories/from-mprn:
    post:
      tags: [home-inventories]
      summary: Create a home inventory from an MPRN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mprn]
              properties:
                mprn: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeInventory' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /homeinventories/from-address:
    post:
      tags: [home-inventories]
      summary: Create a home inventory from an address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeInventory' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /homeinventories/from-certificate:
    post:
      tags: [home-inventories]
      summary: Create a home inventory from an uploaded certificate (PDF)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeInventory' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /homeinventories/{hi_id}/packageset:
    parameters:
      - $ref: '#/components/parameters/HiId'
    get:
      tags: [calculations]
      summary: Read (and lazily start) the package set for a home inventory
      description: |
        Pure function of the home inventory, so no request body. Returns 100+
        packages once finished; the frontend picks three to display. Poll this
        same URL until status is terminal.
      responses:
        '200': { $ref: '#/components/responses/CalcTerminal' }
        '202': { $ref: '#/components/responses/CalcPending' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /homeinventories/{hi_id}/packages:
    parameters:
      - $ref: '#/components/parameters/HiId'
    post:
      tags: [packages]
      summary: Register a user-defined package, returning its content-hash id
      description: |
        Used for fine-tuning. The body is the complete set of adjustable blocks,
        with no reference to any base package: a package's identity is a pure
        function of its own contents. Submitting identical blocks returns the
        same pkg_id (deduplication). The hash MUST be computed the same way as
        for package-set packages, so an equal package collapses to the same id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageDefinition' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackageRegistered' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /homeinventories/{hi_id}/packages/{pkg_id}/fast-estimate:
    parameters:
      - $ref: '#/components/parameters/HiId'
      - $ref: '#/components/parameters/PkgId'
    get:
      tags: [calculations]
      summary: Read (and lazily start) the fast estimate for a package
      description: No body. The package is already stored under pkg_id. Poll until terminal.
      responses:
        '200': { $ref: '#/components/responses/CalcTerminal' }
        '202': { $ref: '#/components/responses/CalcPending' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /homeinventories/{hi_id}/packages/{pkg_id}/detailed-simulation:
    parameters:
      - $ref: '#/components/parameters/HiId'
      - $ref: '#/components/parameters/PkgId'
    get:
      tags: [calculations]
      summary: Read (and lazily start) the detailed simulation for a package
      description: No body. The package is already stored under pkg_id. Poll until terminal.
      responses:
        '200': { $ref: '#/components/responses/CalcTerminal' }
        '202': { $ref: '#/components/responses/CalcPending' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /homeinventories/{hi_id}/packages/{pkg_id}/report.pdf:
    parameters:
      - $ref: '#/components/parameters/HiId'
      - $ref: '#/components/parameters/PkgId'
    get:
      tags: [calculations]
      summary: Download a PDF report for a package
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /materials:
    get:
      tags: [materials]
      summary: Full materials catalog (cacheable with ETag)
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Material' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued user JWT. The backend validates it and reads user_id from it.

  parameters:
    Hash:
      name: hash
      in: path
      required: true
      description: Content hash of the home inventory.
      schema: { type: string }
    HiId:
      name: hi_id
      in: path
      required: true
      schema: { type: string }
    PkgId:
      name: pkg_id
      in: path
      required: true
      schema: { type: string }

  responses:
    CalcPending:
      description: |
        Still computing (status queued or running). Not cacheable
        (Cache-Control: no-store). May carry Retry-After.
      headers:
        Retry-After: { schema: { type: string } }
        Cache-Control: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CalculationStatus' }
    CalcTerminal:
      description: |
        Terminal state (status finished, refused, or failed). A finished result
        is immutable and may be cached indefinitely
        (Cache-Control: public, max-age=31536000, immutable).
      headers:
        Cache-Control: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CalculationStatus' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Valid token, wrong user
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationError:
      description: Structured field-level validation error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:

    # ---------- STABLE ENVELOPE ----------

    ProblemDetails:
      x-contract-status: stable
      description: RFC 7807 Problem Details.
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    CalculationState:
      x-contract-status: stable
      type: string
      enum: [queued, running, finished, refused, failed]

    CalculationStatus:
      x-contract-status: stable
      description: |
        Status of a calculation, read from its result URL. The envelope is
        stable; the `result` CONTENTS are provisional and depend on the
        endpoint (PackagesetResult for packageset, Package for the per-package
        calculations). No id is included: it is already in the URL.
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/CalculationState' }
        result:
          description: Present only when status is "finished".
          oneOf:
            - $ref: '#/components/schemas/PackagesetResult'
            - $ref: '#/components/schemas/Package'
        reason:
          type: string
          description: Present only when status is "refused" or "failed".

    PackageRegistered:
      x-contract-status: stable
      description: Result of registering a user-defined package.
      type: object
      required: [pkg_id]
      properties:
        pkg_id:
          type: string
          description: Content hash of the package definition.

    Material:
      x-contract-status: stable
      description: Fields the frontend caches. Backend holds pricing internally.
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        image_url: { type: string, format: uri }

    HomeInventory:
      x-contract-status: stable
      description: HomeInventoryInput plus its content-hash id. Immutable.
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              description: Content hash of the canonicalised input.
        - $ref: 'homeinventory.yaml#/components/schemas/HomeInventoryInput'

    LandingPage:
      x-contract-status: stable
      description: HTML landing page
      type: string
      example: |
        <!DOCTYPE html>
        <html lang="de">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>RenoVisor API</title>
            <style>
                * { box-sizing: border-box; margin: 0; padding: 0; }
                body {
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                    background-color: #0f172a;
                    color: #f8fafc;
                    height: 100vh;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    overflow: hidden;
                }
                .container {
                    text-align: center;
                    padding: 2rem;
                }
                h1 {
                    font-size: 2.5rem;
                    font-weight: 700;
                    letter-spacing: -0.05em;
                    margin-bottom: 1rem;
                    background: linear-gradient(to right, #38bdf8, #818cf8);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                }
                p {
                    font-size: 1.25rem;
                    color: #94a3b8;
                    font-weight: 400;
                }
                .code-accent {
                    font-family: monospace;
                    background-color: #1e293b;
                    padding: 0.2rem 0.5rem;
                    border-radius: 0.25rem;
                    border: 1px solid #334155;
                }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>RenoVisor API</h1>
                <p><span class="code-accent">There is nothing here.</span></p>
                <p><span class="code-accent">Use the API endpoints.</span></p>
            </div>
        </body>
        </html>


    # HomeInventoryInput, with the two enums it uses (ComponentCondition, GrantScheme),
    # lives in the sibling file homeinventory.yaml, because other projects consume that
    # schema on its own. It is reached from here by relative reference -
    #   $ref: 'homeinventory.yaml#/components/schemas/HomeInventoryInput'
    # - so this file is complete only next to it, which is how the two are always shipped.

    PackageDefinition:
      x-contract-status: provisional
      description: |
        The complete set of user-adjustable blocks that define a package. No
        base_package_id: identity is a pure function of these contents. This is
        the POST body for registering a package; the same blocks also appear
        inside a computed Package.
      type: object
      properties:
        measures:
          type: array
          items: { $ref: '#/components/schemas/Measure' }
        grants: { $ref: '#/components/schemas/Grants' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        financing: { $ref: '#/components/schemas/Financing' }

    Measure:
      x-contract-status: provisional
      type: object
      required: [type]
      properties:
        type: { type: string, examples: [wall_insulation] }
        material_id: { type: string }
        subtype: { type: string }
        thickness_mm: { type: number }
        capacity_kw: { type: number }
        alternatives:
          type: array
          items: { type: string }

    Grants:
      x-contract-status: provisional
      description: Country-specific eligibility structure is an open item.
      type: object
      properties:
        selected_scheme: { type: string }
        eligibility_criteria: { type: object, additionalProperties: true }

    Schedule:
      x-contract-status: provisional
      type: object
      properties:
        preferred_start: { type: string, examples: ['2026-09'] }
        phase_order:
          type: array
          items: { type: string }

    Financing:
      x-contract-status: provisional
      type: object
      properties:
        loan_term_years: { type: integer }
        own_contribution_euro: { type: number }

    Range:
      x-contract-status: provisional
      type: object
      required: [low, normal, high]
      properties:
        low: { type: number }
        normal: { type: number }
        high: { type: number }

    Kpis:
      x-contract-status: provisional
      type: object
      properties:
        energy_demand_kwh: { type: number }
        energy_label: { type: string }
        self_sufficiency_in_percent: {type: string}
        emissions_kg_co2: { type: number }
        disruption_days_by_level:
          type: object
          description: |
            How long the renovation spends at each disruption level, in whole
            days; anything shorter than a day is not modelled. 0 means the level
            does not occur at all. If a level is absent or null, it is not known;
            no estimate was made.
          properties:
            none: { type: integer, minimum: 0, nullable: true, examples: [6], description: "No invasive work - full use of property during renovations. Work stays outside the dwelling, or on plant that interrupts no room." }
            minor: { type: integer, minimum: 0, nullable: true, examples: [12], description: "Minor internal works - dust and materials affecting use of some rooms during renovation. Every room stays usable." }
            moderate: { type: integer, minimum: 0, nullable: true, examples: [5], description: "Moderate internal works - some rooms are not suitable for use at times during renovations. The dwelling as a whole stays habitable." }
            major: { type: integer, minimum: 0, nullable: true, examples: [0], description: "Major internal works, whole property is not suitable for use during renovations. Alternative accommodation is needed." }
          examples:
            - { none: 6, minor: 12, moderate: 5, major: 0 }
            - { none: 6, minor: 12 }
        indoor_air_quality: { type: string, examples: ["high"], description: "Possible values are: high, medium, low"}
        thermal_insulation_effect: { type: integer, examples: [3], description: "Possible values are: 1 (low),2,3,4,5 (high)"}
        summer_heat_protection: { type: integer, examples: [3], description: "Possible values are: 1 (low),2,3,4,5 (high)"}
        comfort:
          type: object
          properties:
            heating: { type: string, examples: ["high"], description: "Possible values are: high, medium, low"}
            cooling: { type: string, examples: ["high"], description: "Possible values are: high, medium, low"}

    Costs:
      x-contract-status: provisional
      type: object
      properties:
        investment_costs_euro: { $ref: '#/components/schemas/Range' }
        energy_costs_euro: { $ref: '#/components/schemas/Range' }
        maintenance_costs_euro: { $ref: '#/components/schemas/Range' }
        grant_euro: { $ref: '#/components/schemas/Range' }
        monthly_net_cost_20y_euro: { $ref: '#/components/schemas/Range' }
        monthly_net_cost_10y_euro: { $ref: '#/components/schemas/Range' }
        payback_period_in_years: { $ref: '#/components/schemas/Range' }
        net_present_value_in_euro: { $ref: '#/components/schemas/Range' }
        property_value_increase_in_percent:  { $ref: '#/components/schemas/Range' }

    Package:
      x-contract-status: provisional
      description: A computed package. Self-identifying via package_id and home_inventory_id.
      type: object
      required: [package_id, home_inventory_id]
      properties:
        package_id: { type: string }
        package_name: { type: string }
        home_inventory_id: { type: string }
        measures:
          type: array
          items: { $ref: '#/components/schemas/Measure' }
        grants: { $ref: '#/components/schemas/Grants' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        financing: { $ref: '#/components/schemas/Financing' }
        kpis: { $ref: '#/components/schemas/Kpis' }
        costs: { $ref: '#/components/schemas/Costs' }

    PackagesetResult:
      x-contract-status: provisional
      type: object
      required: [home_inventory_id, packages]
      properties:
        home_inventory_id: { type: string }
        packages:
          type: array
          items: { $ref: '#/components/schemas/Package' }
