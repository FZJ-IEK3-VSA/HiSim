# The ashrae140 suite: ANSI/ASHRAE Standard 140-2023, Section 7, building thermal envelope and fabric
# load tests. Structure only: which cases, how the acceptance ranges are organised (Normative Annex A3,
# Tables A3-1 to A3-4 and A3-14) and which deviations are registered. The range values themselves and
# the case files are private (roadmap/hisim_verification_agent_spec.md, sections 7.2 and 12).
suite: ashrae140
standard: "ANSI/ASHRAE Standard 140-2023, Section 7"
reference_sources: [ashrae140_2023, denver_tmy3_epw]
reference_file: ashrae140_annex_a3.json   # private, in $HISIM_VERIFICATION_DATA; keys and layout as reference_template.json
case_files: private            # $HISIM_VERIFICATION_DATA/cases/ashrae140/, decision D19 of 2026-11-03
cases: ["600", "620", "640", "660", "670", "680", "685", "695", "900", "920", "940", "980", "985", "995", "600FF", "680FF", "900FF", "980FF"]
gating: false                  # spec section 9.3; only the human sets true
groups:
  low_mass:
    tables: ["A3-1", "A3-2"]
    ranges_total: 21           # Table A3-14
    minimum_required: 18       # Table A3-14
    range_cases:
      - {case: "600", metric: heating}
      - {case: "600", metric: cooling}
      - {case: "610", parent: "600", metric: heating, status: not_modelled}
      - {case: "610", parent: "600", metric: cooling, status: not_modelled}
      - {case: "620", parent: "600", metric: heating}
      - {case: "620", parent: "600", metric: cooling}
      - {case: "630", parent: "620", metric: heating, status: not_modelled}
      - {case: "630", parent: "620", metric: cooling, status: not_modelled}
      - {case: "640", parent: "600", metric: heating}
      - {case: "640", parent: "600", metric: cooling}
      - {case: "650", parent: "600", metric: cooling, status: not_modelled}   # Table A3-2 only
      - {case: "660", parent: "600", metric: heating}
      - {case: "660", parent: "600", metric: cooling}
      - {case: "670", parent: "600", metric: heating}
      - {case: "670", parent: "600", metric: cooling}
      - {case: "680", parent: "600", metric: heating}
      - {case: "680", parent: "600", metric: cooling}
      - {case: "685", parent: "600", metric: heating}
      - {case: "685", parent: "600", metric: cooling}
      - {case: "695", parent: "685", metric: heating}
      - {case: "695", parent: "685", metric: cooling}
  high_mass:
    tables: ["A3-3", "A3-4"]
    ranges_total: 19           # Table A3-14
    minimum_required: 17       # Table A3-14
    range_cases:
      - {case: "900", metric: heating}
      - {case: "900", metric: cooling}
      - {case: "910", parent: "900", metric: heating, reverse: true, status: not_modelled}   # value = 900 - 910
      - {case: "910", parent: "900", metric: cooling, reverse: true, status: not_modelled}
      - {case: "920", parent: "900", metric: heating}
      - {case: "920", parent: "900", metric: cooling}
      - {case: "930", parent: "920", metric: heating, status: not_modelled}
      - {case: "930", parent: "920", metric: cooling, status: not_modelled}
      - {case: "940", parent: "900", metric: heating}
      - {case: "940", parent: "900", metric: cooling}
      - {case: "950", parent: "900", metric: cooling, status: not_modelled}   # Table A3-4 only
      - {case: "960", parent: "900", metric: heating, status: not_modelled}
      - {case: "960", parent: "900", metric: cooling, status: not_modelled}
      - {case: "980", parent: "900", metric: heating}
      - {case: "980", parent: "900", metric: cooling}
      - {case: "985", parent: "900", metric: heating}
      - {case: "985", parent: "900", metric: cooling}
      - {case: "995", parent: "985", metric: heating}
      - {case: "995", parent: "985", metric: cooling}
outputs:                       # Section 7.3 and Table 7-47 beyond the annual loads and peaks of 7.3.1
  temperature_bins: {cases: ["900FF"], lowest_in_celsius: -50, highest_in_celsius: 98}   # 7.3.7.1
  daily_hourly:                # Table 7-47, the rows HiSim can produce; days as MM-DD
    - {cases: ["600", "660", "670", "680", "685", "695", "900", "980", "985", "995"], quantity: load, days: ["02-01", "07-14"]}
    - {cases: ["640", "940"], quantity: load, days: ["02-01"]}
    - {cases: ["640", "940"], quantity: zone_air_temperature, days: ["02-01"]}
    - {cases: ["600FF", "680FF", "900FF", "980FF"], quantity: zone_air_temperature, days: ["02-01"]}
  not_available:               # required by the standard, not produced by HiSim's building model
    - clause: "7.3.2.1"
      cases: ["600"]
      quantity: "annual solar irradiation of each surface orientation"
      reason: "the building computes the irradiance on its windows only and does not output it"
    - clause: "7.3.2.2, 7.3.4.1"
      cases: ["600", "620", "660", "670"]
      quantity: "annual transmitted solar radiation through the windows"
      reason: "the building's window output is the solar heat gain through the total solar energy transmittance, not the transmitted radiation"
    - clause: "7.3.8, Table 7-47"
      cases: ["600"]
      quantity: "hourly incident solar radiation on the horizontal, south and west surfaces"
      reason: "as for 7.3.2.1"
    - clause: "7.3.8, Table 7-47"
      cases: ["600", "660", "670"]
      quantity: "hourly transmitted solar radiation through the south windows"
      reason: "as for 7.3.2.2"
  not_applicable:              # required only of programs with the feature
    - clause: "7.3.2.3, Table 7-47"
      cases: ["600"]
      quantity: "sky temperature"
      reason: "HiSim applies no sky temperature (register entry opaque_solar_absorption_and_sky_radiation)"
deviation_register:            # spec section 8.3; the agent proposes, the human confirms (approved_by)
  - id: gains_split
    category: model
    standard_clause: "ANSI/ASHRAE 140-2023, 7.2.1.7"
    description: "Internal gains 60 % radiative, 40 % convective"
    hisim_treatment: "ISO 13790 C.1 to C.3 split: half of the internal gains to the air node, the rest to the surface and mass nodes by area ratio; not configurable"
    approved_by: null
  - id: interior_solar_distribution
    category: model
    standard_clause: "ANSI/ASHRAE 140-2023, 7.2.1.12.2, Table 7-13"
    description: "Transmitted solar radiation distributed over the interior surfaces by the program or by the table's fractions"
    hisim_treatment: "The solar gains enter the 5R1C nodes by the ISO 13790 C.1 to C.3 rule; no surface-resolved distribution"
    approved_by: null
  - id: opaque_solar_absorption_and_sky_radiation
    category: model
    standard_clause: "ANSI/ASHRAE 140-2023, 7.2.1.8, Table 7-5"
    description: "Exterior solar absorptance 0.6 and infrared emittance 0.9 of the opaque surfaces"
    hisim_treatment: "No opaque solar gain and no sky radiation term (ISO 13790 11.3.4 and 11.3.5 not implemented); the exterior surfaces see the outdoor air temperature"
    approved_by: null
  - id: series_interior_coupling
    category: model
    standard_clause: "ISO/FDIS 13790:2007, 7.2.2.2, Eq. (9)"
    description: "Steady-state heat loss of the zone through the total air-to-air U-values of the constructions"
    hisim_treatment: "The coupling conductance H_tr,is lies in series with H_tr,w and H_tr,op, whose printed U-values already contain the interior surface resistance, so the network's steady-state transmission conductance is below the U-A sum; found after the first full run (gap analysis §14), no correction applied"
    approved_by: null
  - id: isotropic_sky
    category: model
    standard_clause: "ANSI/ASHRAE 140-2023, 7.2.1.11"
    description: "Diffuse irradiance on the windows from the sky and the ground"
    hisim_treatment: "Isotropic sky model with the ground reflectance of 7.2.1.1.2.5 (pvlib get_total_irradiance)"
    approved_by: null
  - id: constant_fw_per_window
    category: input_mapping
    standard_clause: "ANSI/ASHRAE 140-2023, 7.2.1.11.3 a)"
    description: "Angle-dependent solar heat gain coefficients of Table 7-12 (and 7-19, 7-23)"
    hisim_treatment: "One factor F_w per window: the irradiance-weighted annual mean of SHGC(theta)/SHGC_n over the weather file (beam from the table, diffuse from the hemispherical value); 7.2.1.11.3 a) lets a program without angle-dependent inputs skip the section"
    approved_by: null
  - id: printed_u_values
    category: input_mapping
    standard_clause: "ANSI/ASHRAE 140-2023, Tables 7-3, 7-11, 7-18, 7-22, 7-26, 7-28, 7-32"
    description: "Constructions specified layer by layer with surface coefficients"
    hisim_treatment: "The printed total air-to-air U-values are used, which include the standard's surface coefficients; the layers serve the heat capacity only"
    approved_by: null
  - id: effective_thickness_kappa
    category: input_mapping
    standard_clause: "ISO 13790:2008, 12.3.1 (FDIS 2007 12.3.1.1, Table 11); ISO 13786:2007, Annex A"
    description: "The constructions' heat capacity per layer"
    hisim_treatment: "kappa per element from the layers inside to outside up to the effective thickness: the smallest of half the total thickness, the thickness up to the first insulation layer and 0.10 m; conditions (a) and (b) not verified against ISO 13786 (unavailable)"
    approved_by: null
  - id: actual_internal_surface_area
    category: input_mapping
    standard_clause: "ISO 13790:2008, 7.2.2.2"
    description: "Total internal surface area A_tot"
    hisim_treatment: "The actual area of every surface facing the zone, windows included, instead of 4.5 times the floor area"
    approved_by: null
  - id: air_change_density_ratio
    category: input_mapping
    standard_clause: "ANSI/ASHRAE 140-2023, 7.2.1.6.1, Table 7-4, Annex B3.1"
    description: "Infiltration 0.5 ach at the site's air density (1650 m)"
    hisim_treatment: "The rate is multiplied by 1.0156/1.2255, the standard's correction for programs that assume standard air density, because the ventilation conductance uses a fixed 0.34 Wh/(m3 K)"
    approved_by: null
  - id: setback_step
    category: input_mapping
    standard_clause: "ANSI/ASHRAE 140-2023, 7.2.2.1.4 c"
    description: "Cases 640 and 940: the heating set point rises linearly from 10 to 20 degC between 07:00 and 08:00"
    hisim_treatment: "The set point steps from 10 to 20 degC at 07:00 (NightSetbackController); decision D18 of 2026-11-03, revisited with the first full report"
    approved_by: null
  - id: two_pass_warm_up
    category: input_mapping
    standard_clause: "ANSI/ASHRAE 140-2023, 5.1.1.7.2"
    description: "The simulation starts from a settled state"
    hisim_treatment: "Two full-year passes: the second starts from the mass temperature at the end of the first; results from the second pass only (decision D3)"
    approved_by: null
  - id: weather_interpolation
    category: input_mapping
    standard_clause: "ANSI/ASHRAE 140-2023, 7.2.1.1.1"
    description: "The hourly values of the weather data"
    hisim_treatment: "HiSim's weather pipeline places each hourly value at the middle of its hour, interpolates linearly to one minute and averages over the time step; at 3600 s an hour's value is (previous + 6 x own + next) / 8 of the file's values (gap analysis 10.5, F6)"
    approved_by: null
  - id: weather_start_padding
    category: input_mapping
    standard_clause: "ANSI/ASHRAE 140-2023, 7.2.1.1.1"
    description: "The hourly values of the weather data, first hour of the year"
    hisim_treatment: "Defect: the interpolation is padded with zero at 1 January 00:00 for every column but the relative humidity, so the first hour's air temperature is -13.2 degC instead of the file's -18.0 degC; to be fixed in HiSim outside the verification (gap analysis 10.5, F7)"
    approved_by: null
