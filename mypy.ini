[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
allow_redefinition= False
warn_unreachable = True
check_untyped_defs = True
#disallow_untyped_calls = True
#disallow_untyped_defs = True
disallow_incomplete_defs = True
ignore_missing_imports = True
# "override" is disabled because the pre-dataclasses_json era never enforced LSP on the
# config-narrowing overrides (the JSONWizard Any-base hid them); re-enabling it is part
# of the mypy-visibility sweep in roadmap/json_cleanup.md.
disable_error_code = misc, no-untyped-call, no-untyped-def, type-arg, unused-ignore, comparison-overlap, override

[mypy-pytz.*]
ignore_missing_imports = True
[mypy-pandas.*]
ignore_missing_imports = True
[mypy-pvlib.*]
ignore_missing_imports = True
[mypy-oemof.*]
ignore_missing_imports = True
[mypy-matplotlib.*]
ignore_missing_imports = True
[mypy-seaborn.*]
ignore_missing_imports = True
[mypy-reportlab.*]
ignore_missing_imports = True
[mypy-scipy.*]
ignore_missing_imports = True
[mypy-numpy.*]
ignore_missing_imports = True
# dataclasses_json ships py.typed, but its typed @dataclass_json decorator returns
# type[T] WITHOUT the from_dict/to_dict API it injects at runtime, so letting mypy
# resolve it floods every from_dict call site with attr-defined errors. Skipping keeps
# the decorator opaque (the checking level the codebase historically had, when the
# JSONWizard Any-base masked config classes); config-field correctness is enforced by
# scripts/check_config_attrs.py instead. Making configs fully mypy-visible is a
# planned sweep (roadmap/json_cleanup.md).
[mypy-dataclasses_json.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-hplib.*]
ignore_missing_imports = True
[mypy-bslib.*]
ignore_missing_imports = True
[mypy-psutil.*]
ignore_missing_imports = True
[mypy-pydot.*]
ignore_missing_imports = True
[mypy-utspclient.*]
ignore_missing_imports = True
[mypy-casadi.*]
ignore_missing_imports = True
[mypy-control.*]
ignore_missing_imports = True
[mypy-dotenv.*]
ignore_missing_imports = True
[mypy-windpowerlib.*]
ignore_missing_imports = True
[mypy-wetterdienst.*]
ignore_missing_imports = True
[mypy-cdsapi.*]
ignore_missing_imports = True
[mypy-xarray.*]
ignore_missing_imports = True
[mypy-urllib.*]
ignore_missing_imports = True
[mypy-datetime.*]
ignore_missing_imports = True
[mypy-pygfunction.*]
ignore_missing_imports = True
[mypy-pylpg.*]
ignore_missing_imports = True
[mypy-portalocker.*]
ignore_missing_imports = True
