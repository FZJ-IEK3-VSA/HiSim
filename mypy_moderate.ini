[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
allow_redefinition= False
warn_unreachable = True
check_untyped_defs = True
# "override" is disabled because the pre-dataclasses_json era never enforced LSP on the
# config-narrowing overrides (the JSONWizard Any-base hid them); re-enabling it is part
# of the mypy-visibility sweep in roadmap/json_cleanup.md.
disable_error_code = misc, no-untyped-call, no-untyped-def, type-arg, unused-ignore, comparison-overlap, override

# This config is shared by the `system_setups/` and `tests/` mypy runs (see
# .gitlab-ci.yml), which import different third-party packages. A per-module section
# is flagged "unused section(s)" by whichever run does not import its package.
# Sections were removed only when their override is truly redundant:
#   - imported by neither run: pympler, networkx, setuptools; or
#   - the package ships a py.typed marker, so mypy resolves its types natively:
#     pydot, dotenv (presence of <pkg>/py.typed in site-packages was
#     verified, and `mypy --config-file mypy_moderate.ini` was run against both
#     system_setups/ and tests/ with zero import-not-found / import-untyped errors); or
#   - nothing under hisim/, tests/, system_setups/ or scripts/ imports the package any
#     more: seaborn, cdsapi, xarray, wetterdienst (its importer is gone; the name only
#     survives as an OPTIONAL_DEPENDENCIES string and a docs autodoc mock), control and
#     windpowerlib (imported solely by obsolete/, which no mypy job checks).
# Sections for packages that are missing or ship no py.typed marker MUST remain even
# though each is "unused" in one run: deleting it would surface import-not-found /
# import-untyped errors in the other run that does import it (e.g. hpc_harness,
# submit_system_setups, submit_json_setups, numpy_financial, pygfunction, jsonschema
# and openpyxl, all of which only the tests/ run imports). The residual unused-section
# notes are inherent to a shared config and are preferable to breaking type-checking
# for the importing run.

# The HPC harness lives under scripts/ (not an installed package); treat it like the
# other non-installed dependencies below so tests importing it don't fail resolution.
# Third-party stubs are skipped module by module (see follow_imports below), which mypy
# only honours for .pyi files when this is on. It was added for casadi 3.8.0, whose
# casadi.pyi repeats a parameter name in generated signatures — a blocking error that
# ignore_errors cannot suppress. casadi left with the MPC controller (D-16, retired from
# requirements.txt on 2026-09-11), but the option stays: it is what makes a per-module
# `follow_imports = skip` effective against any stub-shipping dependency, so one upstream
# release cannot stop every mypy job in the project.
follow_imports_for_stubs = True
[mypy-hpc_harness.*]
ignore_missing_imports = True
[mypy-submit_system_setups]
ignore_missing_imports = True
[mypy-submit_json_setups]
ignore_missing_imports = True

[mypy-pytz.*]
ignore_missing_imports = True
[mypy-pandas.*]
ignore_missing_imports = True
[mypy-pvlib.*]
ignore_missing_imports = True
[mypy-oemof.*]
ignore_missing_imports = True
[mypy-matplotlib.*]
ignore_missing_imports = True
[mypy-reportlab.*]
ignore_missing_imports = True
[mypy-scipy.*]
ignore_missing_imports = True
[mypy-numpy.*]
ignore_missing_imports = True
[mypy-numpy_financial.*]
ignore_missing_imports = True
# Kept opaque for the same reason as in mypy.ini: the typed @dataclass_json decorator
# does not declare the serialization API it injects, and skipping preserves the
# historical checking level until the mypy-visibility sweep (roadmap/json_cleanup.md).
[mypy-dataclasses_json.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-hplib.*]
ignore_missing_imports = True
[mypy-bslib.*]
ignore_missing_imports = True
[mypy-psutil.*]
ignore_missing_imports = True
[mypy-utspclient.*]
ignore_missing_imports = True
[mypy-urllib.*]
ignore_missing_imports = True
[mypy-datetime.*]
ignore_missing_imports = True
[mypy-pygfunction.*]
ignore_missing_imports = True
[mypy-pylpg.*]
ignore_missing_imports = True
[mypy-portalocker.*]
ignore_missing_imports = True

# PyYAML ships no py.typed marker and its stubs are a separate package, so every reader of it
# needs this override: the energy-system loader and the worked-example collector
# (tests/test_worked_examples.py) alike.
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-ruamel.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

# openpyxl ships no py.typed marker; the worked-example converter and its test read the
# workbooks through it (tools/convert_worked_examples.py, cost-spec-v2 §3.3).
[mypy-openpyxl.*]
ignore_missing_imports = True
