[pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
# -rfE emits the "=== short test summary info ===" block for failures and errors. CI
# failure reporting parses that block rather than tracebacks (traceback formatting varies
# with --tb, with xdist, and with whichever plugins are installed); without it a failing
# CI job reports one opaque "job failed" instead of the individual tests.
addopts = --strict-markers -rfE
markers =
    base: base tests that have to run in any case
    extendedbase: extended base tests that take up to 10 minutes to run (deselect with '-m "not extendedBase"')
    buildingtest: systematic testing of the building component (deselect with '-m "not buildingtest"')
    system_setups: systematic testing of the system_setups (deselect with '-m "not system_setups"')
    mpc: systematic testing of the mpc controlled systems (deselect with '-m "not mpc"')
    utsp: systematic testing of lpg utsp connector component (deselect with '-m "not utsp"')
    jsonconfig: systematic testing of the json config generation and execution (deselect with '-m "not jsonconfig"')
    postprocessingoptions: one named test per PostProcessingOptions value for postprocessing runtime statistics
    worked_examples: hand-computed Excel reference examples of the cost module (cost-spec-v2 §3)
    hpcharness: HPC-harness tests (db, server, units, and POSIX-only worker/warm-pool tests)
