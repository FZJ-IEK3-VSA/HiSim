[pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
# -rfEs emits the "=== short test summary info ===" block: one line per failure, error and
# skip, the skip line carrying the reason given to pytest.skip(), pytest.importorskip() or
# skipif. CI does not parse that block - it only reads pytest's exit code - but the block is
# what makes the job log readable: a failing test is named in the summary instead of having
# to be found by scrolling the tracebacks, and a test that opted out (because an optional
# dependency is missing, say) appears by name and reason rather than a bare count.
addopts = --strict-markers -rfEs
markers =
    base: unit-scale: no full simulation of a system setup, a few seconds at most - the fast edit loop (deselect with '-m "not base"')
    extendedbase: full-simulation tests, hand-balanced with extendedbase2 so the two shards' wall times match; when adding one, run 'pytest -m extendedbase --durations=0' and 'pytest -m extendedbase2 --durations=0' and put it in the lighter shard (deselect with '-m "not extendedbase"')
    extendedbase2: the second full-simulation shard, balanced against extendedbase by the same rule; a test carries at most one of base, extendedbase and extendedbase2 (deselect with '-m "not extendedbase2"')
    buildingtest: systematic testing of the building component (deselect with '-m "not buildingtest"')
    system_setups: systematic testing of the system_setups (deselect with '-m "not system_setups"')
    mpc: systematic testing of the mpc controlled systems (deselect with '-m "not mpc"')
    utsp: systematic testing of lpg utsp connector component (deselect with '-m "not utsp"')
    postprocessingoptions: one named test per PostProcessingOptions value for postprocessing runtime statistics
    worked_examples: hand-computed Excel reference examples of the cost module (cost-spec-v2 §3)
    hpcharness: HPC-harness tests (db, server, units, and POSIX-only worker/warm-pool tests)
    assemblies: every test under tests/assemblies/ but the nightly tier - the assembly format, expansion and harness tests, the PR tier of the assembly test contracts (mock and real library) and the heat-pump gate; needs the local LoadProfileGenerator (libicu and its .NET binary); run by the job 'pytest (assemblies)' of tests.yml; tests/assemblies/conftest.py adds it by itself and refuses base, extendedbase and extendedbase2 there (deselect with '-m "not assemblies"')
    nightly: the Latin hypercube tier of the assembly test contracts (tests/assemblies/test_library_contracts.py, assemblies_spec.md §9.4), run by the assemblies-nightly job of golden-year.yml; sized and seeded by --samples and --seed
    xdist_group(name): pytest-xdist's grouping marker, declared here so a run without xdist (-p no:xdist) collects the assembly test contracts, whose every sample is one group (tests/assemblies/test_library_contracts.py)
    upstream_history: needs the unsquashed upstream git history of golden_references/ (skipped on shallow clones and on squash-synced mirrors; deselect with '-m "not upstream_history"')
