# Mockup (design, not loadable): the connector registry of assemblies_spec.md §3.2, restricted to the connector types
# the files in this directory use. D14 recommends it as Python (`hisim/connectors.py`, importing only hisim.loadtypes);
# it is written as YAML here only so the mockup can be read in one place.
#
# Each type lists its quantities: unit (an lt.Units member name), load type (lt.LoadTypes), and who writes the value
# (`writer`: which end of a link owns it). Port attributes are what a port of the type states; `lowered_to` says what
# a binding writes into the expanded file. A class implements a type by mapping each quantity to its own input or
# output names (the "implements" examples cite the real class members on origin/main 0921f9bd).
#
# Lowering form, the same for every type (proposed by dry_run_heatpump_twin.md, gap G2): a binding is written as a BARE
# NAME on the target member when that member's class declares default connections from the partner's class that are
# exactly the wires the binding makes; otherwise as explicit `input:`/`from:` wires. Both forms build the same graph.

connector_types:

  energy_carrier_supply:
    description: A consumer's draw of one carrier from that carrier's provider (the link of spec §4.3).
    quantities:
      drawn_power: {unit: WATT, writer: consumer}
    attributes:
      carrier: lt.EnergyBalanceCarrier member (ELECTRICITY, NATURAL_GAS, HEATING_OIL, PELLETS, WOOD_CHIPS, HYDROGEN, DISTRICT_HEAT); no LPG, no wood logs yet (spec §5.1)
    cardinality: exactly one provider per need (spec §3.3)
    lowered_to: >-
      electricity: an electricity_flow feed of the bus holder (below); a fuel: a feed of the provider's meter
      (GasMeter / FuelMeter default feeds, e.g. GenericBoiler.EnergyDemandSh, gas_meter.py default connections).

  electricity_flow:
    description: An electricity output published for the bus and for observers.
    quantities:
      power: {unit: WATT, load_type: ELECTRICITY, writer: device}
    attributes:
      flow: production | consumption | storage | net        # net: a bus holder's grid balance (gap G6)
      component_type: lt.ComponentType member (PV, HEAT_PUMP_BUILDING, HEAT_PUMP_DHW, RESIDENTS, BATTERY, CAR_BATTERY, ...)
      controllable: >-
        absent (never controlled); {target_input: <Member.Input>} for a device without L1 (the battery's
        LoadingPowerInput; the EV's L1 ElectricityTargetFromEMS); {via: <control_signal port>} for a device whose L1
        modifier the EMS actuates (heat pump, immersion heater, spec §4.4, D21)
    lowered_to: >-
      one feed of the bus holder. Tags: production -> ELECTRICITY_PRODUCTION, weight 999; consumption bound to the
      controller -> ELECTRICITY_CONSUMPTION_EMS_CONTROLLED, weight from the priority list; consumption otherwise ->
      ELECTRICITY_CONSUMPTION_UNCONTROLLED, 999; storage -> component_type BATTERY + EMS_CONTROLLED; net -> the meter's
      production channel at 999 (the twin's ems_with_battery meter line). `dispatch:` {target_input: X} for a
      target_input port, {} for a `via:` port and for a controlled port with neither (residents).
    implements:
      MoreAdvancedHeatPumpHPLib: {power: [ElectricalInputPowerSH, ElectricalInputPowerDHW]}   # two ports, two types
      PVSystem: {power: ElectricityOutput}
      UtspLpgConnector: {power: ElectricalPowerConsumption}
      Battery: {power: AcBatteryPowerUsed}
      L1Controller: {power: BatteryChargingPowerToEMS}            # controller_l1_generic_ev_charge
      L2GenericEnergyManagementSystem: {power: TotalElectricityToOrFromGrid}   # flow net
      SimpleAirConditioner: {power: ElectricalPowerConsumption}

  electricity_bus:
    description: >-
      The link end of every electricity flow (spec §4.3). Held by the grid's meter, or by the controller when a
      controller import exists; the holder aggregates the feeds; the meter then observes the holder's net flow.
    quantities: {}
    attributes:
      holder: Member that aggregates the feeds
    lowered_to: the feeds of the holder (above)

  hot_water_demand:
    description: Hot water the occupants draw from a DHW supplier.
    quantities:
      drawn_volume: {unit: LITER, load_type: WARM_WATER, writer: demand}   # per time step, not kg/s
    implements:
      UtspLpgConnector: {drawn_volume: WaterConsumption}
      SimpleDHWStorage: {drawn_volume: WaterConsumption}          # its input, default connection from UtspLpgConnector
    lowered_to: bare name of the demand on the supplier (SimpleDHWStorage.get_default_connections_from_utsp)

  hydronic_circuit:
    description: One end of one water circuit (hydronic spec §3.1, PR #878).
    quantities:
      mass_flow: {unit: KG_PER_SEC, load_type: WARM_WATER, writer: the end that owns the pump}
      supply_temperature: {unit: CELSIUS, load_type: TEMPERATURE, writer: the generator-side end}
      return_temperature: {unit: CELSIUS, load_type: TEMPERATURE, writer: the consumer-side end}
    attributes:
      medium: heating_water | dhw | brine | solar_fluid
      end: '{pump: bool, legs: [supply | return]}'
    implements:
      # space-heating circuit, buffer side (PARALLEL storage position)
      SimpleHotWaterStorage:
        supply_temperature: WaterTemperatureToHeatDistribution            # output
        return_temperature: WaterTemperatureFromHeatDistribution          # input
        mass_flow: WaterMassFlowRateFromHeatDistributionSystem            # input
      HeatDistribution:
        supply_temperature: WaterTemperatureInput                         # input
        return_temperature: WaterTemperatureOutput                        # output
        mass_flow: WaterMassFlowHDS                                       # output: the HDS owns the pump
      # DHW circuit, generator side and cylinder side
      MoreAdvancedHeatPumpHPLib (dhw):
        supply_temperature: TemperatureOutputDHW
        mass_flow: MassFlowOutputDHW                                      # the heat pump owns the pump
        return_temperature: TemperatureInputSecondaryDHW                  # input
      MoreAdvancedHeatPumpHPLibControllerDHW (dhw, reads only):
        return_temperature: WaterTemperatureInputFromDHWStorage           # the L1 loop's measured variable
      SimpleDHWStorage:
        supply_temperature: WaterTemperatureFromHeatGenerator             # input
        mass_flow: WaterMassFlowRateFromHeatGenerator                     # input
        return_temperature: WaterTemperatureToHeatGenerator               # output
    lowered_to: the three wires; bare names where the default connections are exactly these wires (they are, twin :79-95)

  control_signal:
    description: One named signal from one writer into exactly one target input.
    quantities:
      value: {unit: per signal, writer: the controller}
    signals:
      heating_flow_temperature: {unit: CELSIUS, writer: HeatDistributionController.HeatingFlowTemperature}
      sh_storage_temperature_offset: {unit: CELSIUS, writer: L2GenericEnergyManagementSystem.SpaceHeatingWaterStorageTemperatureModifier,
                                      target: MoreAdvancedHeatPumpHPLibControllerSpaceHeating.SimpleHotWaterStorageTemperatureModifier}
      dhw_storage_temperature_offset: {unit: CELSIUS, writer: L2GenericEnergyManagementSystem.DomesticHotWaterStorageTemperatureModifier,
                                       target: MoreAdvancedHeatPumpHPLibControllerDHW.DHWStorageTemperatureModifier}
      building_temperature_offset: {unit: CELSIUS, writer: L2GenericEnergyManagementSystem.BuildingIndoorTemperatureModifier,
                                    targets: [Building.BuildingTemperatureModifier, HeatDistributionController.BuildingTemperatureModifier]}
      battery_power_target: {unit: WATT, writer: the EMS dispatch output, target: Battery.LoadingPowerInput}
      ev_charging_target: {unit: WATT, writer: the EMS dispatch output, target: L1Controller.ElectricityTargetFromEMS}
      ac_modulation: {unit: PERCENT, writer: SimpleAirConditionerController.ModulatingPowerSignal,
                      target: SimpleAirConditioner.ModulatingPowerSignal}
    lowered_to: one wire per target (bare name where the default connection is exactly it)

  sizing_fact:
    description: A fact one config contributes and another's law reads (spec §6).
    attributes:
      fact: the fact name (hisim/config/context.py)
      cardinality: one | many
    lowered_to: >-
      nothing when the engine's bare-fact rule binds the same providers (one provider in the whole system);
      otherwise a sizing_sources line, scalar or a list in instance order (gap G7)
    facts_used_here:
      heating_load_in_watt: {provider: Building, readers: [MoreAdvancedHeatPumpHPLib.set_thermal_output_power_in_watt, HeatDistributionController]}
      heating_reference_temperature_in_celsius: {provider: Weather, readers: [MoreAdvancedHeatPumpHPLib, HeatDistributionController]}
      set_heating_temperature_in_celsius: {provider: Building, readers: [MoreAdvancedHeatPumpHPLibControllerSpaceHeating, HeatDistributionController]}
      heat_distribution_system_type: {provider: HeatDistributionController, readers: [MoreAdvancedHeatPumpHPLibControllerSpaceHeating, HeatDistribution]}
      set_heating_threshold_outside_temperature_in_celsius: {provider: HeatDistributionController, readers: [MoreAdvancedHeatPumpHPLibControllerSpaceHeating]}
      water_mass_flow_rate_in_kg_per_second: {provider: HeatDistributionController, readers: [HeatDistribution]}
      maximal_thermal_power_in_watt: {provider: MoreAdvancedHeatPumpHPLib, readers: [SimpleHotWaterStorage]}   # inside heating
      number_of_apartments: {provider: Building, readers: [SimpleDHWStorage]}
      roof_area_in_m2: {provider: Building, readers: [PVSystem]}
      weather_identity: {provider: Weather, readers: [PVSystem]}
      pv_peak_power_in_watt: {provider: PVSystem, readers: [Battery], cardinality: many}
      occupancy_identity: {provider: UtspLpgConnector, readers: [Car]}
      energy_carrier: {provider: the burner, readers: [GasMeter, FuelMeter]}   # pinned from the provider instead (spec §5.1)

  weather_data:
    quantities:
      temperature_outside: {unit: CELSIUS, output: Weather.TemperatureOutside}
      daily_average_outside_temperature: {unit: CELSIUS, output: Weather.DailyAverageOutsideTemperatures}
      irradiance: {unit: WATT_PER_SQUARE_METER, outputs: [DirectNormalIrradiance, DirectNormalIrradianceExtra, DiffuseHorizontalIrradiance, GlobalHorizontalIrradiance]}
      sun_position: {unit: DEGREES, outputs: [Altitude, Azimuth, ApparentZenith]}
      wind_speed: {output: Weather.WindSpeed}
    implements:
      MoreAdvancedHeatPumpHPLib: {daily_average_outside_temperature: [TemperatureAmbient, TemperatureInputPrimary]}  # explicit in the twin
      MoreAdvancedHeatPumpHPLibControllerSpaceHeating: {daily_average_outside_temperature: DailyAverageOutsideTemperature}
      PVSystem: {temperature_outside: TemperatureOutside, irradiance: '...', sun_position: '...', wind_speed: WindSpeed}
      SimpleAirConditioner: {temperature_outside: TemperatureOutside}
    lowered_to: bare `Weather` where the class's default connections cover exactly these wires, explicit wires otherwise

  building_thermal:
    quantities:
      indoor_air_temperature: {unit: CELSIUS, output: Building.TemperatureIndoorAir}
      heating_demand: {unit: WATT, output: Building.TheoreticalThermalBuildingDemand}
    implements:
      SimpleAirConditioner: {indoor_air_temperature: TemperatureIndoorAir}
      SimpleAirConditionerController: {indoor_air_temperature: TemperatureIndoorAir}

  internal_gains:
    quantities:
      residents: {unit: WATT, output: UtspLpgConnector.HeatingByResidents}
      devices: {unit: WATT, output: UtspLpgConnector.HeatingByDevices}

  zone_heat:
    description: Heat (negative for cooling) a device puts into the Building; one named Building input per kind (D19).
    quantities:
      heat: {unit: WATT, load_type: HEATING, writer: device}
    attributes:
      kind: >-
        sh_delivered (Building.ThermalPowerDelivered: the HDS, or direct electric heating without HDS) | chp
        (Building.ThermalPowerCHP) | secondary_heating (†, new Building input) | cooling (†, new Building input; today
        the SimpleAirConditioner writes ThermalPowerDelivered, simple_air_conditioner twin :16-17) | ventilation (†)
    cardinality: one port per kind; a second is refused
    lowered_to: one explicit wire into the kind's Building input

  car_usage:
    description: >-
      The occupancy's driving profiles. Not wired: the UtspLpgConnector publishes each car's profile into the
      SimRepository in i_prepare_simulation and the Car reads its own by car_name (loadprofilegenerator_utsp_connector.py
      i_prepare_simulation). The port checks the car name exists in the occupancy's household and lowers to nothing but
      the occupancy_identity fact.
    lowered_to: nothing (a load-time check)
