# Mockup (design, not loadable): energy_systems/assemblies/pv/array.assembly.yaml
# One PV array; a house with several arrays imports it with one instance per request system id (spec §10.4, #83).

schema_version: 4
kind: assembly
name: pv/array
description: A rooftop PV array with its inverter (pvlib, CEC databases).

parameters:
  azimuth_in_degree:
    {type: float, unit: DEGREES, default: 180, description: Orientation, 180 is south.}
    # feeds PVSystemConfig.azimuth, a field with no unit suffix and no declared unit: a load error under D16 (c)
    # until the field declares `unit=DEGREES` (gap G10, not written yet)
  tilt_in_degree:
    {type: float, unit: DEGREES, default: 30, description: Tilt from horizontal.}
  power_in_watt:
    {type: float, unit: WATT, default: AUTO, description: Peak power; AUTO is the roof share times the module density.}
  share_of_roof_area:
    {type: float, default: 1.0, description: "Share of the usable roof (0, 1]; the request's percent is divided by 100 by the translator, never here (D16)."}
  shading_losses_in_percent:
    {type: float, unit: PERCENT, default: 0, description: "Shading losses († no field: PVSystem has no shading)."}
  location:
    {type: string, default: AACHEN, description: "PVSystemConfig.location, documentation only today (pv_system.py:85); a site value repeated here (gap G11). Default = the twin's value (D9)."}

constraints:
  - {at_most_one_of: [power_in_watt, share_of_roof_area]}   # a stated power is never capped; a share is (§10.4)

presets:
  de_twin: {}                                              # the defaults are the twin's values (D9)

components:
  PVSystem:
    class: hisim.components.generic_pv_system.PVSystem
    preset: rooftop                                        # power AUTO: ROOFTOP_POWER_LAW over roof_area_in_m2
    config:
      location: {$param: location}
      azimuth: {$param: azimuth_in_degree}
      tilt: {$param: tilt_in_degree}
      power_in_watt: {$param: power_in_watt}
      share_of_maximum_pv_potential: {$param: share_of_roof_area}
    inputs:
      - {$port: weather}                                   # bare Weather: the eight weather default connections

interface:
  needs:
    weather:     {connector: weather_data, into: [PVSystem]}
    roof_area:   {connector: sizing_fact, fact: roof_area_in_m2, into: [PVSystem]}
    weather_id:  {connector: sizing_fact, fact: weather_identity, into: [PVSystem]}
  provides:
    production:  {connector: electricity_flow, output: PVSystem.ElectricityOutput, flow: production, component_type: PV}
                 # a link to the electricity bus (spec §4.3); the bus holder's feed is ELECTRICITY_PRODUCTION at 999
    peak_power:  {connector: sizing_fact, fact: pv_peak_power_in_watt, export: true}   # config.py:181-186; read by batteries
