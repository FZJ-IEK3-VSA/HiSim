# Mockup (design, not loadable): energy_systems/assemblies/supply/delivered_fuel.assembly.yaml
# A delivered fuel (oil tank, pellet store, wood-chip bunker, log pile) and its meter (spec §5.1). The provision names
# the carrier and the meter, `provides: {connection: {carrier: {$param: carrier}, meter: FuelMeter}}`; every bound
# consumer's fuel need lowers to the aggregator feeds FuelMeter's class declares for the consuming outputs, whose
# EnergyPort names this carrier, and they land at the meter's `{$port: connection}` placeholder, like the gas meter's.
# FuelMeter exists; its fuel constants are copied from "the generator" today (fuel_meter.py:61-69,
# generic_boiler.py:217-259), so until the meter converts per participant the provider refuses consumers whose
# constants differ (spec §6, D10).
# Carriers are lt.EnergyBalanceCarrier values. † lt.EnergyBalanceCarrier has no member for wood logs (WOOD_LOGS), LPG
# (LPG) or HVO (HVO) yet (spec §5.1): the enum is extended in the step that brings the component, so a wood_logs, lpg or
# hvo import is refused until then.

schema_version: 4
kind: assembly
name: supply/delivered_fuel
description: A stored, delivered fuel with its consumption meter.

parameters:
  carrier:
    {type: enum, values: [heating_oil, pellets, wood_chips, wood_logs, lpg, hvo], default: heating_oil,
     description: "The fuel, an lt.EnergyBalanceCarrier value; wood_logs, lpg and hvo are † (no LoadTypes / EnergyBalanceCarrier member)."}
     # † default heating_oil is a placeholder: the importer always states the carrier (the twins' oil house)

presets:
  oil_tank: {carrier: heating_oil}
  pellet_store: {carrier: pellets}

components:
  FuelMeter:
    class: hisim.components.fuel_meter.FuelMeter
    preset: standard
    config:
      fuel_loadtype: {$param: carrier}                     # carrier name -> LoadTypes in the loader (OIL, PELLETS, WOOD_CHIPS)
      # heating_value_of_fuel_in_kwh_per_liter / fuel_density_in_kg_per_m3 stay AUTO (laws over the consumer's facts)
    inputs:
      - {$port: connection}                                # one feed per bound consumer

interface:
  provides:
    connection: {carrier: {$param: carrier}, meter: FuelMeter}   # the one provider of this carrier

tests:
  # One day at 900 s beside the consumer partner of the carrier (a boiler of at most about 40 kW).
  bounds:
    - {output: FuelMeter.HeatConsumption, unit: WATT_HOUR, min: 0, max: 15000}               # per step: <= 40 kW x 0.25 h, with margin
    - {output: FuelMeter.CumulativeConsumption, unit: WATT_HOUR, min: 0, max: 1500000}      # one day: <= 40 kW x 24 h, with margin
  monotone: []                                             # no numeric parameter: nothing to sweep
