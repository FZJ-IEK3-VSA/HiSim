# Mockup (design, not loadable): energy_systems/assemblies/supply/delivered_fuel.assembly.yaml
# A delivered fuel (oil tank, pellet store, wood-chip bunker, log pile) and its meter, which OBSERVES the bound
# consumers' fuel outputs like the gas meter (spec §5.1). FuelMeter exists; its fuel constants are copied from "the
# generator" today (fuel_meter.py:61-69, generic_boiler.py:217-259), so until the meter converts per participant the
# provider refuses consumers whose constants differ (spec §6, D10).
# † LPG and HVO are not carriers yet (spec §5.1); wood logs have no carrier of their own (the stove is †).

schema_version: 4
kind: assembly
name: supply/delivered_fuel
description: A stored, delivered fuel with its consumption meter.

parameters:
  carrier:
    {type: enum, values: [oil, wood_pellets, wood_chips, wood_logs, lpg, hvo],
     description: "The fuel; wood_logs, lpg and hvo are † (no LoadTypes / EnergyBalanceCarrier member)."}

presets:
  oil_tank: {carrier: oil}
  pellet_store: {carrier: wood_pellets}

components:
  FuelMeter:
    class: hisim.components.fuel_meter.FuelMeter
    preset: standard
    config:
      fuel_loadtype: {$param: carrier}                     # carrier name -> LoadTypes in the loader (OIL, PELLETS, WOOD_CHIPS)
      # heating_value_of_fuel_in_kwh_per_liter / fuel_density_in_kg_per_m3 stay AUTO (laws over the consumer's facts)
    inputs:
      - {$observes: reading}

interface:
  provides:
    connection:
      connector: energy_carrier_supply
      carrier: {$param: carrier}
  observes:
    reading:
      into: [FuelMeter]
      default: [{connector: energy_carrier_supply, carrier: {$param: carrier}}]
