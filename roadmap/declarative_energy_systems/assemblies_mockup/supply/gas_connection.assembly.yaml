# Mockup (design, not loadable): energy_systems/assemblies/supply/gas_connection.assembly.yaml
# The natural-gas connection and its meter (spec §5.1). The meter OBSERVES the fuel outputs of the bound consumers (its
# `observes:`, default every energy_carrier_supply port of carrier NATURAL_GAS); that observation is the fuel link, and
# the meter is the fuel port's energy-balance peer, as today GasMeter reads the burner's fuel output
# (generic_boiler.py:450, :501; gas_meter.py default feeds from GenericBoiler.EnergyDemandSh and .EnergyDemandDhw).
# Its carrier is pinned here, from the provider, instead of copied from "the generator beside it"
# through the energy_carrier fact (gas_meter.py:63-68), which a gas cooker beside a gas boiler makes ambiguous.

schema_version: 4
kind: assembly
name: supply/gas_connection
description: Natural-gas grid connection with its meter.

parameters: {}
presets:
  de_twin: {}

components:
  GasMeter:
    class: hisim.components.gas_meter.GasMeter
    preset: standard
    config:
      gas_loadtype: GAS                                    # pinned, not sized from the energy_carrier fact
    inputs:
      - {$observes: reading}                               # one feed per bound consumer (EnergyDemandSh, EnergyDemandDhw, †cooker)

interface:
  provides:
    connection:
      connector: energy_carrier_supply
      carrier: NATURAL_GAS                                 # lt.EnergyBalanceCarrier; every bound consumer is checked against it
  observes:
    reading:
      into: [GasMeter]
      default: [{connector: energy_carrier_supply, carrier: NATURAL_GAS}]   # the fuel outputs; the importer may narrow it
