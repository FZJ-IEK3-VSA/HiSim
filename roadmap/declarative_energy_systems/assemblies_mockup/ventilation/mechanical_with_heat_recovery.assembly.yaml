# Mockup (design, not loadable): energy_systems/assemblies/ventilation/mechanical_with_heat_recovery.assembly.yaml
# † No ventilation component; the Building computes its ventilation loss from a fixed air-change rate. Request leaf
# ventilation.type_of_system (cardinality one; natural ventilation and trickle vents stay site config of the Building).
# D19: the Building gains ONE named input of this kind (†, `VentilationHeatRecovered`, W, the heat the unit returns
# to the supply air) when the component exists; a second ventilation unit is refused.

schema_version: 4
kind: assembly
name: ventilation/mechanical_with_heat_recovery
description: Balanced mechanical ventilation with a heat-recovery exchanger and its fans.

parameters:
  heat_recovery_efficiency_in_percent:
    {type: float, unit: PERCENT, default: 85, range: {min: 50, max: 95}, description: Temperature efficiency of the exchanger.}
     # range: a simple plate exchanger (50 %) up to a certified counter-flow unit (95 %)
  air_flow_in_m3_per_hour:
    {type: float, default: AUTO, range: {min: 50, max: 500},
     description: "Nominal air flow; AUTO is 0.5 air changes per hour of the zone volume († law)."}
     # range: a flat (50 m³/h) up to a large house (500 m³/h); no unit: † lt.Units has no m³/h member, added with the class
  specific_fan_power_in_watt_per_m3_per_hour:
    {type: float, default: 0.35, range: {min: 0.15, max: 0.8}, description: Fan electricity per unit air flow.}
     # range: W per m³/h of residential units, about 0.2 to 0.6; no unit († as the air flow); feeds no field

presets:
  standard: {}

components:
  Ventilation:
    class: hisim.components.mechanical_ventilation.MechanicalVentilation    # †
    preset: with_heat_recovery
    config:
      heat_recovery_efficiency_in_percent: {$param: heat_recovery_efficiency_in_percent}
      air_flow_in_m3_per_hour: {$param: air_flow_in_m3_per_hour}
    inputs:
      - {$port: weather}                                   # TemperatureOutside
      - {$port: zone}                                      # TemperatureIndoorAir

interface:
  needs:
    weather:     {into: [Ventilation], partner: Weather}
    zone:        {into: [Ventilation], partner: Building}                                # TemperatureIndoorAir
    electricity: {carrier: electricity, outputs: [electricity_use]}
    volume:      {fact: conditioned_floor_area_in_m2, into: [Ventilation]}
  provides:
    air_exchange:    {output: Ventilation.HeatRecovered}   # Building's default connections fill VentilationHeatRecovered (†)
    electricity_use: {output: Ventilation.ElectricalPowerConsumption}
                     # no lt.ComponentType for ventilation (†); not controllable: the EMS has no modifier for it

tests:
  # † Ventilation's class does not exist; the outputs are the ones this file names. One day at 900 s on the test weather
  # beside the Building partner. Recovered heat: 500 m³/h x 0.34 Wh/(m³ K) x 30 K x 0.95 is about 4.8 kW; fan power
  # at most 0.8 W per m³/h x 500 m³/h.
  bounds:
    - {output: Ventilation.HeatRecovered, unit: WATT, min: 0, max: 6000}               # the box's largest flow and efficiency, with margin
    - {output: Ventilation.ElectricalPowerConsumption, unit: WATT, min: 0, max: 500}   # 0.8 W/(m³/h) x 500 m³/h, with margin
  monotone:
    - {parameter: heat_recovery_efficiency_in_percent, kpi: Heat recovered, member: Ventilation, direction: increasing}
      # † KPI name; a better exchanger returns more heat on the same day
