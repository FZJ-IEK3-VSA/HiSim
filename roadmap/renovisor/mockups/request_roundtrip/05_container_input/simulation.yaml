# The parameters file the C# service hands to the container beside the two JSON files (A18).
# Period and resolution are the service's choice; HiSim adds COMPUTE_KPIS, WRITE_KPIS_TO_JSON and
# COMPUTE_LIFECYCLE_COSTS if they are absent and records that in calculation.json.
start_date: "2021-01-01T00:00:00"
end_date: "2022-01-01T00:00:00"
seconds_per_timestep: 900
post_processing_options:
  - COMPUTE_KPIS
  - WRITE_KPIS_TO_JSON
  - COMPUTE_LIFECYCLE_COSTS
logging_level: 3
