# Fixture: a battery sized to every PV array in scope (assemblies_spec.md §6, D10). Its fact port reads
# pv_peak_power_in_watt with many: true, which binds every provider of the fact and lowers to a sizing_sources
# list in instance order; the capacity law sums the list, Sum(Many(Size.PV_PEAK_POWER_IN_WATT)).
schema_version: 4
kind: assembly
name: storage/array_battery
description: A fake battery sized to all PV arrays beside it.

parameters:
  capacity_in_kwh:
    {type: float, unit: KWH, default: AUTO, range: {min: 0, max: 50},
     description: "Capacity; AUTO is 1 kWh per kWp of all arrays."}

presets:
  standard: {}

components:
  Battery:
    class: tests.assemblies.fixture_components.FakeArrayBattery
    preset: sized_to_all_arrays
    config:
      capacity_in_kwh: {$param: capacity_in_kwh}

interface:
  needs:
    pv_power: {fact: pv_peak_power_in_watt, many: true, into: [Battery]}

tests:
  bounds:
    - {output: Battery.Capacity, unit: KWH, min: 0, max: 50}
    - {output: Battery.AcBatteryPowerUsed, unit: WATT, min: 0, max: 0}           # no controller: idle
  monotone:
    - {parameter: capacity_in_kwh, kpi: Battery capacity, member: Battery, direction: increasing}
