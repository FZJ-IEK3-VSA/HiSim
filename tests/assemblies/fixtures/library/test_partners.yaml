# The test partners of the fixture library (assemblies_spec.md §9.4): the site components the assembly
# test harness places beside an assembly it runs in isolation, one for every port whose binding changes
# what the assembly computes. Read by hisim/energy_system/assemblies/testing/partners.py, which documents
# the format; every partner is a site entry as an energy-system file writes it.
partners:
  # --------------------------------------------------------------------------- partners of needs
  Weather:
    serves: {partner: FakeWeather}
    component: {class: tests.assemblies.fixture_components.FakeWeather, preset: standard}
  Occupancy:
    serves: {partner: FakeOccupancy}
    component: {class: tests.assemblies.fixture_components.FakeOccupancy, preset: standard}
  Ems:
    serves: {partner: FakeEms}
    component: {class: tests.assemblies.fixture_components.FakeEms, preset: standard}
  Controller:
    serves: {partner: FakeController}
    component: {class: tests.assemblies.fixture_components.FakeController, preset: standard}
  Heater:
    # A heater a thermostat switches, so the tank it heats sees heat on its schedule.
    serves: {partner: FakeHeater}
    requires: [Controller]
    component:
      class: tests.assemblies.fixture_components.FakeHeater
      preset: standard
      inputs: [Controller]
  Tank:
    # A tank the residents draw from, heated by the one heater in scope: the assembly's own.
    serves: {partner: FakeTank}
    requires: [Occupancy]
    component:
      class: tests.assemblies.fixture_components.FakeTank
      preset: standard
      inputs: [Occupancy, {$port: heat}]
      ports:
        heat: {partner: FakeHeater}

  # ------------------------------------------------------------------------ the other circuit ends
  Cylinder:
    # The cylinder end of the dhw circuit, for an assembly whose end is a boiler.
    serves: {circuit: dhw, other_end: [FakeBoiler]}
    requires: [Occupancy]
    component:
      class: tests.assemblies.fixture_components.FakeCylinder
      preset: standard
      inputs: [Occupancy, {$port: dhw}]
      ports:
        dhw: {circuit: dhw}
  Boiler:
    # The boiler end of the dhw circuit, for an assembly whose end is a cylinder.
    serves: {circuit: dhw, other_end: [FakeCylinder]}
    component:
      class: tests.assemblies.fixture_components.FakeBoiler
      preset: condensing
      inputs: [{$port: dhw}]
      ports:
        dhw: {circuit: dhw}

  # ------------------------------------------------------------------- carriers and their consumers
  GasMeter:
    # The natural-gas connection a fuel need binds; its meter observes the consumers' feeds.
    serves: {carrier: natural_gas}
    component:
      class: tests.assemblies.fixture_components.FakeGasMeter
      preset: standard
      inputs: [{$port: gas}]
      ports:
        gas: {carrier: natural_gas}
  GasBoiler:
    # A consumer of the natural gas an assembly provides: a boiler burning it, charging its own cylinder.
    serves: {consumes: natural_gas}
    requires: [GasCylinder]
    component:
      class: tests.assemblies.fixture_components.FakeBoiler
      preset: condensing
      inputs: [GasCylinder]
      ports:
        fuel: {carrier: natural_gas, outputs: [FuelUse]}
  GasCylinder:
    serves: {partner: FakeCylinder}
    requires: [Occupancy, GasBoiler]
    component:
      class: tests.assemblies.fixture_components.FakeCylinder
      preset: standard
      inputs: [Occupancy, GasBoiler]

  # ------------------------------------------------------------------------------------------ facts
  PVArray:
    # A roof array contributing pv_peak_power_in_watt (5 kWp), the fact a battery is sized from.
    serves: {fact: pv_peak_power_in_watt}
    requires: [Weather]
    component:
      class: tests.assemblies.fixture_components.FakePVSystem
      preset: rooftop
      inputs: [Weather]

  # --------------------------------------------------------------------------- observe and actuate
  MeteredResidents:
    # A flow the electricity meter observes, so its observer port in isolation is not idle.
    serves: {observed_by: FakeElectricityMeter}
    component: {class: tests.assemblies.fixture_components.FakeOccupancy, preset: standard}
  RankedResidents:
    # A flow the energy manager observes and ranks (residents, rank-only), so its observer port is not idle.
    serves: {observed_by: FakeEnergyManager}
    component: {class: tests.assemblies.fixture_components.FakeOccupancy, preset: standard}
  Control:
    # The controller an L1's ems_modifier binds: a controller is an assembly (its priorities are a parameter).
    serves: {partner: FakeEnergyManager}
    import: {assembly: control/ems_self_consumption}
  BatteryControl:
    # The one controller a battery's controllable output binds (controllable: {target_input: LoadingPowerInput}).
    serves: {controls: FakeBattery}
    import: {assembly: control/ems_self_consumption}
