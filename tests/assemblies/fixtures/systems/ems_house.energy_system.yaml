# Fixture: the twin shape ems_with_battery on fixture assemblies (assemblies_spec.md §4.3, §4.4; the
# twin household_heatpump_building_sizer.grouped, :96-144). An energy manager observes the residents, the
# PV array, the heater (controllable through its thermostat, ems_modifier bound) and the battery (actuated
# directly), ranks them by its default priorities and sums them into its grid balance; the grid's meter
# observes that balance alone, selected by name, so no flow is counted twice.
schema_version: 4
name: fixture_ems_house
description: A composed fixture house with an energy manager, a battery, a heater and a PV array.

components:
  Weather:
    class: tests.assemblies.fixture_components.FakeWeather
    preset: standard
  Occupancy:
    class: tests.assemblies.fixture_components.FakeOccupancy
    preset: standard

imports:
  pv:
    assembly: pv/array
  heater:
    assembly: generator/smart_heater
    optional-bind: {ems_modifier: control}
  battery:
    assembly: storage/home_battery
  control:
    assembly: control/ems_self_consumption
  grid:
    assembly: supply/electricity_grid
    observes: [{output: TotalElectricityToOrFromGrid}]
