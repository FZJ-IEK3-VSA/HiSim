# Fixture: a composed energy system. Three site components, two PV instances, a hot-water package
# nested three deep that the site's energy manager may modify, and a backup heater whose variant
# leaves its thermostat out. Every component is placed in the evaluation sequence with order:.
schema_version: 4
name: fixture_house
description: A composed fixture house for the assemblies tests.

components:
  Weather:
    order: 1
    class: tests.assemblies.fixture_components.FakeWeather
    preset: standard
  Occupancy:
    order: 2
    class: tests.assemblies.fixture_components.FakeOccupancy
    preset: standard
  Ems:
    order: 6
    class: tests.assemblies.fixture_components.FakeEms
    preset: standard

imports:
  pv:
    order: 3
    assembly: pv/array
    instances:
      east: {azimuth_in_degree: 90, facing: east}
      west:
        installation_year: 2026
        parameters: {azimuth_in_degree: 270, facing: west, power_in_watt: 3000}
  hot_water:
    order: 4
    assembly: dhw/package
    preset: standard
    optional-bind: {ems_modifier: Ems}
  backup:
    order: 5
    assembly: generator/electric_heater
    parameters: {with_thermostat: false}
