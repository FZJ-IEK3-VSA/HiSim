# Mock: the grid connection, the one electricity provider, which has no link (assemblies_spec.md §3.2),
# and its meter, an observer whose selection the importing file may replace (§4.3): at its default it
# observes every flow its class declares (the twin's metered_directly); beside an energy manager the
# grid import selects the manager's balance by name (ems_with_battery).
schema_version: 4
kind: assembly
name: mock/electricity_grid
description: A mock grid connection with its bidirectional meter.

components:
  Meter:
    class: tests.assemblies.mock_components.MockElectricityMeter
    preset: standard

interface:
  provides:
    connection: {carrier: electricity}
  observes:
    reading: {into: [Meter], default: declared}

tests:
  bounds:
    - {output: Meter.ElectricityToAndFromGrid, unit: WATT, min: -20000, max: 20000}
  monotone: []
