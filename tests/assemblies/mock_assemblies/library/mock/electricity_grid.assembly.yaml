# Mock: the grid connection — the one electricity provider, which has no link (spec §3.2) — and its
# meter, an observer whose selection the importing file writes (§4.3): left at its default it observes
# every flow its class declares (the twin's metered_directly); with an energy manager in the house the
# grid import selects the manager's balance by name (ems_with_battery).
schema_version: 4
kind: assembly
name: mock/electricity_grid
description: A mock grid connection with its bidirectional meter.

parameters: {}

presets:
  standard: {}

components:
  Meter:
    class: tests.assemblies.mock_components.MockElectricityMeter
    preset: standard
    inputs:
      - {$observes: reading}

interface:
  provides:
    connection: {carrier: electricity}
  observes:
    reading: {into: [Meter], default: declared}

tests:
  bounds:
    - {output: Meter.ElectricityToAndFromGrid, unit: WATT, min: -20000, max: 20000}
  monotone: []
