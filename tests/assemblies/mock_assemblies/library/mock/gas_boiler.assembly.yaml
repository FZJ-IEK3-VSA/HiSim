# Mock: a gas boiler. It burns natural gas (a carrier need its provider's meter observes) and is one
# end of the dhw circuit, owning the mass flow and the supply leg.
schema_version: 4
kind: assembly
name: mock/gas_boiler
description: A mock gas boiler charging a hot-water cylinder.

parameters:
  power_in_watt:
    {type: float, unit: WATT, default: 3000, range: {min: 1000, max: 20000}, description: Rated heat output.}

components:
  Boiler:
    class: tests.assemblies.mock_components.MockBoiler
    preset: condensing
    display: "Gas boiler, {power_in_watt:g} W"
    config:
      power_in_watt: {$param: power_in_watt}
    inputs:
      - {$port: dhw}

interface:
  needs:
    fuel: {carrier: natural_gas, outputs: [Boiler.FuelUse]}
  provides:
    dhw: {circuit: dhw, member: Boiler}

tests:
  bounds:
    - {output: Boiler.SupplyTemperatureDhw, unit: CELSIUS, min: 0, max: 100}
    - {output: Boiler.FuelUse, unit: WATT_HOUR, min: 0, max: 10000}
  monotone:
    - {parameter: power_in_watt, kpi: Boiler fuel, member: Boiler, direction: increasing}
