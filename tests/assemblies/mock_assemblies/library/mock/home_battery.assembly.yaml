# Mock: a battery the energy manager charges directly (assemblies_spec.md §4.4, D21): it has no L1, so
# its controllable output names its own LoadingPowerInput, which lowers into the manager's feed's
# dispatch.target_input. It is ranked by exactly one controller, so a battery without one is refused.
schema_version: 4
kind: assembly
name: mock/home_battery
description: A mock home battery charged by an energy manager, sized to the PV array beside it.

parameters:
  capacity_in_kwh:
    {type: float, unit: KWH, default: AUTO, range: {min: 1, max: 30}, description: "Capacity; AUTO is 1 kWh per kWp."}

components:
  Battery:
    class: tests.assemblies.mock_components.MockBattery
    preset: sized_to_pv
    config:
      capacity_in_kwh: {$param: capacity_in_kwh}

interface:
  needs:
    pv_power: {fact: pv_peak_power_in_watt, into: [Battery]}
  provides:
    electricity: {output: Battery.AcBatteryPowerUsed, controllable: {target_input: LoadingPowerInput}}

tests:
  bounds:
    - {output: Battery.Capacity, unit: KWH, min: 0, max: 50}
  monotone:
    - {parameter: capacity_in_kwh, kpi: Battery capacity, member: Battery, direction: increasing}
