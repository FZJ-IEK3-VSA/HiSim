# Mock: an electric heater whose thermostat (an L1) an energy manager may raise. Its electricity is
# controllable through the need ems_modifier (assemblies_spec.md §4.4, D21): bound to the manager it
# lowers to the thermostat's default connections from the manager's class, and the manager ranks the
# heater's draw with an empty dispatch; unbound, the heater is not controlled.
schema_version: 4
kind: assembly
name: mock/smart_heater
description: A mock electric space heater with its thermostat, controllable by an energy manager.

parameters:
  power_in_watt:
    {type: float, unit: WATT, default: 2000, range: {min: 500, max: 6000}, description: Rated power.}

components:
  Controller:
    class: tests.assemblies.mock_components.MockController
    preset: standard
    inputs:
      - {$port: ems_modifier}
  Heater:
    class: tests.assemblies.mock_components.MockHeater
    preset: standard
    config:
      power_in_watt: {$param: power_in_watt}
    inputs:
      - Controller

interface:
  needs:
    ems_modifier: {into: [Controller], partner: MockEnergyManager, optional: true}
  provides:
    heat: {output: Heater.ThermalPower}
    electricity: {output: Heater.ElectricityInput, controllable: {via: ems_modifier}}

tests:
  bounds:
    - {output: Heater.ThermalPower, unit: WATT, min: 0, max: 6000}
    - {output: Heater.ElectricityInput, unit: WATT, min: 0, max: 6000}
  monotone:
    - {parameter: power_in_watt, kpi: Heater energy, member: Heater, direction: increasing}
