# Mock: the twin shape ems_with_battery on mock assemblies (assemblies_spec.md §4.3, §4.4; the twin
# household_heatpump_building_sizer.grouped, option ems_with_battery). An energy manager observes the
# residents, the PV array, the heater (controllable through its thermostat, ems_modifier bound) and the
# battery (actuated directly), ranks them at its class's weights and sums them into its grid balance;
# the grid's meter observes that balance alone, selected by name, so no flow is counted twice.
schema_version: 4
name: mock_ems_house
description: A composed mock house with an energy manager, a battery, a heater and a PV array.

components:
  Weather:
    class: tests.assemblies.mock_components.MockWeather
    preset: standard
  Occupancy:
    class: tests.assemblies.mock_components.MockOccupancy
    preset: standard

imports:
  pv:
    assembly: mock/pv_array
  heater:
    assembly: mock/smart_heater
    optional-bind: {ems_modifier: control}
  battery:
    assembly: mock/home_battery
  control:
    assembly: mock/ems_self_consumption
  grid:
    assembly: mock/electricity_grid
    observes: [{output: TotalElectricityToOrFromGrid}]
