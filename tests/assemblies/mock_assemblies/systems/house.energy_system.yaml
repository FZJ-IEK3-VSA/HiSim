# Mock, for the shapes of a composed file the real library cannot show: two instances whose display names a template
# fills, the reserved keys installation_year and quote, a need bound to another import's provided output through its
# wires (the tank's heat), an import whose internal variant decides its members and ports (the heater's thermostat,
# whose optional port the site's energy manager binds), and a site entry reading an import through a port of its own
# (the monitor). Four site components and three imports.
schema_version: 4
name: mock_house
description: A composed mock house for the assemblies tests.

components:
  Weather:
    class: tests.assemblies.mock_components.MockWeather
    preset: standard
  Occupancy:
    class: tests.assemblies.mock_components.MockOccupancy
    preset: standard
  Ems:
    class: tests.assemblies.mock_components.MockEms
    preset: standard
  Monitor:
    class: tests.assemblies.mock_components.MockController
    preset: eco
    inputs:
      - {$port: tank}
      - Ems
    ports:
      tank: {partner: MockTank}

imports:
  pv:
    assembly: mock/labelled_array
    instances:
      east: {azimuth_in_degree: 90, facing: east}
      west: {azimuth_in_degree: 270, facing: west, power_in_watt: 3000, installation_year: 2026}
  tank:
    assembly: mock/wired_tank
    parameters: {volume_in_liter: 200}
    bind: {heat: heater.heat}
  heater:
    assembly: mock/variant_heater
    optional-bind: {ems_modifier: Ems}
    installation_year: 2025
    quote: {amount_in_euro: {min: 800, max: 1200}, per: unit, source: mock}
