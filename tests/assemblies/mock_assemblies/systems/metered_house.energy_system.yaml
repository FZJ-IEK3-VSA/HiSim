# Mock: the twin shape metered_directly on mock assemblies (the twin's :145-171). No energy manager:
# the grid's meter keeps its default selection and observes every flow its class declares.
schema_version: 4
name: mock_metered_house
description: A composed mock house metered directly, without an energy manager.

components:
  Weather:
    class: tests.assemblies.mock_components.MockWeather
    preset: standard
  Occupancy:
    class: tests.assemblies.mock_components.MockOccupancy
    preset: standard

imports:
  pv:
    assembly: mock/pv_array
  heater:
    assembly: mock/smart_heater
  grid:
    assembly: mock/electricity_grid
