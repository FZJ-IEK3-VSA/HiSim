# Mock: two PV arrays and a battery sized to both (assemblies_spec.md §6, D10). The battery's many fact
# port binds both arrays' peak power in instance order, and its law sums them: 5 kWp + 3 kWp, 8 kWh.
schema_version: 4
name: mock_two_array_house
description: A composed mock house whose battery is sized to the sum of two arrays.

components:
  Weather:
    class: tests.assemblies.mock_components.MockWeather
    preset: standard

imports:
  pv:
    assembly: mock/pv_array
    instances:
      east: {azimuth_in_degree: 90, facing: east}
      west: {azimuth_in_degree: 270, facing: west, power_in_watt: 3000}
  battery:
    assembly: mock/array_battery
