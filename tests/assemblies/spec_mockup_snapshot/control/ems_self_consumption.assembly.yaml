# Mockup (design, not loadable): energy_systems/assemblies/control/ems_self_consumption.assembly.yaml
# The L2 controller (D11, D21). It observes electricity flows and actuates ONLY L1 set-point modifiers and the
# battery's LoadingPowerInput (and an EV's L1 charge target). It owns the priority list; no device declares a weight.
#
# It OBSERVES the electricity outputs its class declares dynamic default connections from (its own `observes:`
# selection, spec §4.3) and outputs their sum, TotalElectricityToOrFromGrid. The grid's meter observes that output only
# when the `grid` import says so (`observes: [{output: TotalElectricityToOrFromGrid}]`); nothing changes implicitly.
# A meter observing that output and an output this EMS observes is a load error (double count). Twin :100-146.

schema_version: 4
kind: assembly
name: control/ems_self_consumption
description: Surplus controller maximising PV self-consumption (L2GenericEnergyManagementSystem).

parameters:
  priorities:
    type: list
    description: Ordered selectors of the controllable ports it actuates; the weights are derived (spec §4.4).
    default:
      - {component_type: RESIDENTS}                                   # class default 1
      - {component_type: [HEAT_PUMP_BUILDING, ELECTRIC_HEATING_SH]}   # 2
      - {component_type: [HEAT_PUMP_DHW, ELECTRIC_HEATING_DHW]}       # 3
      - {component_type: SOLAR_THERMAL_SYSTEM}                        # 4
      - {component_type: CAR_BATTERY}                                 # 5 (car twin)
      - {component_type: BATTERY}                                     # 6, then 7, 8 ...
  building_offset_in_kelvin:
    {type: float, unit: CELSIUS, default: 2, range: {min: 0, max: 5},
     description: "Building set point raise on surplus (EMSConfig, controller_l2_energy_management_system.py:54)."}
     # range: no raise up to 5 K, beyond which comfort suffers
  sh_storage_offset_in_kelvin:
    {type: float, unit: CELSIUS, default: 10, range: {min: 0, max: 20}, description: Buffer set point raise on surplus.}
     # range: no raise up to 20 K, within a buffer's 60-80 °C ceiling
  dhw_storage_offset_in_kelvin:
    {type: float, unit: CELSIUS, default: 10, range: {min: 0, max: 20}, description: DHW cylinder set point raise on surplus.}
     # range: no raise up to 20 K, within a cylinder's 60-80 °C ceiling
  # the three offsets equal EMSConfig's defaults and therefore write nothing into the expanded config (gap G9)

presets:
  de_twin: {}

components:
  EMS:
    class: hisim.components.controller_l2_energy_management_system.L2GenericEnergyManagementSystem
    preset: optimize_own_consumption
    config:
      building_indoor_temperature_offset_value: {$param: building_offset_in_kelvin}
      space_heating_water_storage_temperature_offset_value: {$param: sh_storage_offset_in_kelvin}
      domestic_hot_water_storage_temperature_offset_value: {$param: dhw_storage_offset_in_kelvin}
    inputs:
      - {$observes: flows}                                 # every observed flow, sorted by feed resolution

interface:
  observes:
    flows:
      into: [EMS]
      default: declared                                    # every electricity output the EMS class declares; never its own
  actuates:
    priorities: {$param: priorities}                       # controllable electricity outputs, weights derived
    # The modifier wires need no port here: an L1 that binds `ems_modifier: control` (and the site's
    # `temperature_modifier`) lowers to its own class's default connections from L2GenericEnergyManagementSystem,
    # which pick SpaceHeatingWaterStorageTemperatureModifier, DomesticHotWaterStorageTemperatureModifier or
    # BuildingIndoorTemperatureModifier. battery / EV targets come out of the feed's dispatch output.
  provides:
    grid_balance: {output: EMS.TotalElectricityToOrFromGrid}   # the sum of what `flows` observes: the double-count check

tests:
  # One day at 900 s beside the partners its observer selection finds (residents, at most about 50 kW of flows).
  # The Dispatch* outputs exist per controlled feed, named after the feed (DispatchTo<instance>_<input>); the isolation
  # run's feeds decide them, so they are bounded by no fixed name here. Signs of the two sums are not checked against
  # controller_l2_energy_management_system.py, so those bands are symmetric.
  bounds:
    - {output: EMS.TotalElectricityToOrFromGrid, unit: WATT, min: -50000, max: 50000}            # signed grid balance
    - {output: EMS.TotalElectricityConsumption, unit: WATT, min: -50000, max: 50000}             # sign unchecked
    - {output: EMS.BuildingIndoorTemperatureModifier, unit: CELSIUS, min: 0, max: 5}             # 0 or the offset, at most the box's 5 K
    - {output: EMS.DomesticHotWaterStorageTemperatureModifier, unit: CELSIUS, min: 0, max: 20}   # 0 or the offset, at most 20 K
    - {output: EMS.SpaceHeatingWaterStorageTemperatureModifier, unit: CELSIUS, min: 0, max: 20}  # 0 or the offset, at most 20 K
    - {output: EMS.ElectricityToBuildingFromDistrictEMSOutput, unit: WATT, min: -50000, max: 50000}   # zero outside a district
  monotone:
    - {parameter: building_offset_in_kelvin, kpi: "Residents' electricity consumption from grid", member: EMS,
       direction: constant}
      # a set-point raise moves heating loads, never the residents' own consumption
