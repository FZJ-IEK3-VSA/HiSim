# Mockup (design, written by hand): the flat file the expansion of composed_heatpump_default.energy_system.yaml
# produces, step by step in dry_run_heatpump_twin.md. It is a plain v3 file — no imports, no ports — and is compared
# there with energy_systems/household_heatpump_building_sizer.grouped.energy_system.yaml, option ems_with_battery.
# Component order is the expansion's evaluation sequence (spec §2.3, D23): the composed file's `order:` numbers, each
# import's members nested under its number in the assembly's order, sorted by order path (shown per component). It is
# the twin's sequence except buffer (6.4) before DHWStorage (9), a neutral swap (dry run §9.1).
# The import record (metadata.imports) is shown at the end as a comment; it is data beside the file (spec §2.3, §9.1).

schema_version: 3
name: household_heatpump_building_sizer
description: Basic household new system setup.
components:
  Building:                                       # order 1
    class: hisim.components.building.building.Building
    preset: german_single_family_home
    config:
      number_of_apartments: 1.0
      enable_opening_windows: true
      weather_identity: Aachen/DWD_TRY/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
    inputs:
      - Weather
      - control-EMS                                # Building.temperature_modifier (optional-bind, bound)
      - UTSPConnector
      - HeatDistributionSystem
  UTSPConnector:                                  # order 2
    class: hisim.components.loadprofilegenerator_utsp_connector.UtspLpgConnector
    preset: couple_both_at_work
    config:
      data_acquisition_mode: USE_LOCAL_LPG
  Weather:                                        # order 3
    class: hisim.components.weather.Weather
    config:
      location: Aachen
      source_path: ${inputs}/weather/test-reference-years_1995-2012_1-location/data_processed/aachen_center
      data_source: DWD_TRY
      heating_reference_temperature_in_celsius: -7.0
      predictive_control: false
  pv-pv_system-PVSystem:                        # order 4.1.1
    class: hisim.components.generic_pv_system.PVSystem
    preset: rooftop
    config:
      location: AACHEN
    inputs:
      - Weather
  HeatDistributionController:                     # order 5
    class: hisim.components.heat_distribution_system.HeatDistributionController
    preset: building_derived
    inputs:
      - control-EMS                                # HeatDistributionController.temperature_modifier (optional-bind)
      - Weather
      - Building
  heating-ControllerSH:                          # order 6.1
    class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLibControllerSpaceHeating
    preset: standard
    inputs:
      - Weather                                     # heating.weather
      - HeatDistributionController                  # heating.flow_temperature
      - control-EMS                                # heating.ems_modifier (sh_storage_temperature_offset)
      - heating-Buffer
  heating-ControllerDHW:                         # order 6.2
    class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLibControllerDHW
    preset: standard
    inputs:
      - control-EMS                                # heating.ems_modifier (dhw_storage_temperature_offset)
      - dhw-DHWStorage                             # heating.dhw, return leg read by the L1
  heating-HeatPump:                              # order 6.3
    class: hisim.components.more_advanced_heat_pump_hplib.MoreAdvancedHeatPumpHPLib
    preset: air_water
    config:
      with_domestic_hot_water_preparation: true     # serves_dhw; AUTO power and `none` SCOPs write nothing (G9)
    inputs:
      - heating-ControllerDHW
      - heating-ControllerSH
      - dhw-DHWStorage                             # heating.dhw <-> dhw.circuit, return leg
      - heating-Buffer
      - input: TemperatureAmbient                   # heating.weather: the explicit wires the assembly names (the
        from: Weather.DailyAverageOutsideTemperatures   # class's default connections from Weather are not these, G2)
      - input: TemperatureInputPrimary
        from: Weather.DailyAverageOutsideTemperatures
  heating-Buffer:                                # order 6.4
    class: hisim.components.simple_water_storage.SimpleHotWaterStorage
    preset: buffer
    config:
      sizing_option: SIZE_ACCORDING_TO_HEAT_PUMP
    inputs:
      - HeatDistributionSystem                      # sh circuit: return temperature and mass flow (the HDS's)
      - heating-HeatPump
  dhw-DHWStorage:                                # order 9.1
    class: hisim.components.simple_water_storage.SimpleDHWStorage
    preset: standard
    inputs:
      - UTSPConnector                               # dhw.hot_water_demand
      - heating-HeatPump                           # dhw.circuit: supply leg and mass flow (the heat pump's)
  HeatDistributionSystem:                         # order 11
    class: hisim.components.heat_distribution_system.HeatDistribution
    preset: building_derived
    inputs:
      - Building
      - HeatDistributionController
      - heating-Buffer                             # sh circuit: WaterTemperatureInput <- WaterTemperatureToHeatDistribution
  grid-ElectricityMeter:                         # order 12.1
    class: hisim.components.electricity_meter.ElectricityMeter
    preset: standard
    inputs:
      - from: control-EMS.TotalElectricityToOrFromGrid   # the one match of grid's `observes:` (the grid balance)
        tags:
          - ELECTRICITY_PRODUCTION
        weight: 999
  battery-battery-Battery:                      # order 13.1.1
    class: hisim.components.advanced_battery_bslib.Battery
    preset: sized_to_pv                             # one PV provider: no sizing_sources line (G7)
  control-EMS:                                   # order 14.1
    class: hisim.components.controller_l2_energy_management_system.L2GenericEnergyManagementSystem
    preset: optimize_own_consumption
    inputs:                                         # control.flows: every flow its `observes:` selects (spec §4.3)
      - from: battery-battery-Battery.AcBatteryPowerUsed
        component_type: BATTERY
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 6
        dispatch:
          target_input: LoadingPowerInput
      - from: heating-HeatPump.ElectricalInputPowerDHW
        component_type: HEAT_PUMP_DHW
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 3
        dispatch: {}
      - from: heating-HeatPump.ElectricalInputPowerSH
        component_type: HEAT_PUMP_BUILDING
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 2
        dispatch: {}
      - from: pv-pv_system-PVSystem.ElectricityOutput
        component_type: PV
        tags:
          - ELECTRICITY_PRODUCTION
        weight: 999
      - from: UTSPConnector.ElectricalPowerConsumption
        component_type: RESIDENTS
        tags:
          - ELECTRICITY_CONSUMPTION_EMS_CONTROLLED
        weight: 1
        dispatch: {}

# metadata.imports (the import record, spec §2.3 step 5; abbreviated):
#   sequence: [Building 1, UTSPConnector 2, Weather 3, pv-pv_system-PVSystem 4.1.1, HeatDistributionController 5,
#              heating-ControllerSH 6.1, heating-ControllerDHW 6.2, heating-HeatPump 6.3, heating-Buffer 6.4,
#              dhw-DHWStorage 9.1, HeatDistributionSystem 11, grid-ElectricityMeter 12.1,
#              battery-battery-Battery 13.1.1, control-EMS 14.1]   # the simulator adds them in this order;
#              against the twin: one neutral swap, heating-Buffer before dhw-DHWStorage (D9's reviewed list)
#   site:     {Building.temperature_modifier: control-EMS (optional-bind, bound),
#              HeatDistributionController.temperature_modifier: control-EMS (optional-bind, bound)}
#              (without the `control` import both read "not bound: partner absent")
#   heating:  {assembly: heating/air_source_heat_pump, sha256: <hash>, preset: null, order: 6,
#              parameters: {thermal_power_in_watt: AUTO, scop_en14825_w35: none, scop_en14825_w55: none,
#                           with_buffer: true, buffer_volume_in_liter: AUTO, serves_dhw: true, control: traditional},
#              variants: {dhw_side: with_dhw, buffer: parallel},
#              members: {ControllerSH: heating-ControllerSH 6.1, ControllerDHW: heating-ControllerDHW 6.2,
#                        HeatPump: heating-HeatPump 6.3, Buffer: heating-Buffer 6.4},
#              ports: {weather: Weather (default), flow_temperature: HeatDistributionController
#                      (default), sh: HeatDistributionSystem.sh (default), electricity: grid.connection (exists),
#                      dhw: dhw.circuit (bound by dhw), electricity_sh: observed by control-EMS, weight 2,
#                      electricity_dhw: observed by control-EMS, weight 3, ems_modifier: control (optional-bind, bound),
#                      solar_coil: unbound (optional, no candidate), heat_load: Building, design_temperature: Weather,
#                      room_setpoint: Building, emitter_type: HeatDistributionController,
#                      heating_threshold: HeatDistributionController}}
#   dhw:      {assembly: dhw/indirect_cylinder, order: 9,
#              parameters: {volume_in_liter: AUTO, tank_and_pipe_insulated: true},
#              members: {DHWStorage: dhw-DHWStorage 9.1},
#              ports: {hot_water_demand: UTSPConnector (default), circuit: heating.dhw (written),
#                      apartments: Building (default), solar_coil: unbound (optional, no candidate)}}
#   pv:       {assembly: pv/array, order: 4, instances: {pv_system: {parameters: <all defaults>,
#              members: {PVSystem: pv-pv_system-PVSystem 4.1.1},
#              ports: {weather: Weather, roof_area: Building, weather_id: Weather,
#                      production: observed by control-EMS, 999}}}}
#   battery:  {assembly: storage/battery, order: 13,
#              instances: {battery: {members: {Battery: battery-battery-Battery 13.1.1},
#              ports: {pv_peak_power: [pv-pv_system-PVSystem] (no line written),
#                      electricity: observed by control-EMS, controller control-EMS, weight 6}}}}
#   control:  {assembly: control/ems_self_consumption, order: 14, members: {EMS: control-EMS 14.1},
#              observes: {flows: declared -> 5 feeds}, provides: {grid_balance: TotalElectricityToOrFromGrid},
#              weights: {UTSPConnector.ElectricalPowerConsumption: 1, heating.electricity_sh: 2, heating.electricity_dhw: 3,
#                        battery.battery.electricity: 6}}
#   grid:     {assembly: supply/electricity_grid, order: 12,
#              members: {ElectricityMeter: grid-ElectricityMeter 12.1},
#              observes: {reading: [{output: TotalElectricityToOrFromGrid}] -> control-EMS},
#              double_count_check: passed (the grid balance only, none of the outputs control observes)}
