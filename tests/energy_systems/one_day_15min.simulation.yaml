# Simulation parameters for the energy-system executor tests: one January day at a quarter-hour
# resolution, long enough for every component to run its own state machine through a full
# heating day and short enough to keep the test suite fast. The only post-processing asked for
# is the result table, which is what a test checks a run actually produced.
start_date: "2021-01-01T00:00:00"
end_date: "2021-01-02T00:00:00"
seconds_per_timestep: 900
post_processing_options:
  - EXPORT_TO_CSV
logging_level: 3
