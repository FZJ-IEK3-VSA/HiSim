name: "co2_price_from_trajectory"
group: "end_to_end"
spec_section: "3.5"
computed_by: "Claude draft + LibreOffice recalculation, 2026-09-08"
description: "A 10,000 EUR device over an 8-year horizon at 3 % interest, buying 5,000 kWh of electricity a year at 0.25 EUR/kWh. What the example pins is the CO2 *price* component of the bill - a real cash flow, and the one energy figure apply_tariff does not produce: the tariff engine never sees a carbon price, and the energy calculator adds the component per projection year as emission factor x kWh x exposure share x the CO2 price of that calendar year, divided by 1,000 kg per ton. The trajectory steps from 50 EUR/t (2024) to 80 (2027) to 110 (2030), is read with step interpolation - the last point at or before the year applies, and the last point persists past its end - and is never escalated. This is figure (3) of calculators/co2.py's four CO2 figures; the CO2 damage cost (4) is a macroeconomic shadow price that never coexists with it (§3.8). The emission factor, the exposure share and the trajectory come from the synthetic XX database (SyntheticCarbonData in tests/worked_example_runners.py) and are copied here as inputs, so a change there fails this example instead of re-baselining it."
inputs:
  investment_in_euro: 10000
  lifetime_in_years: 8
  maintenance_rate: 0
  horizon_in_years: 8
  interest_rate: 0.03
  general_price_escalation_rate: 0
  investment_price_escalation_rate: 0
  energy_price_escalation_rate: 0
  price_basis_year: 2024
  co2_price_scenario: "worked_example"
  energy_bought_in_kwh: 5000
  electricity_price_in_euro_per_kwh: 0.25
  standing_charge_in_euro_per_year: 0
  emission_factor_in_kg_per_kwh: 0.4
  co2_price_exposure: 1
  co2_price_2024_in_euro_per_ton: 50
  co2_price_2027_in_euro_per_ton: 80
  co2_price_2030_in_euro_per_ton: 110
  kilograms_per_ton: 1000
  months_per_year: 12
