description: "An 8,000 EUR photovoltaic system with a 25-year service life evaluated over 10 years at 3 %. It feeds 3,000 kWh per year into the grid at a nominally fixed 0.08 EUR/kWh tariff and costs 1 % of the investment in maintenance. Because only 10 of the 25 years are used, 15/25 of the investment is credited back as a residual value at the end of the horizon."
