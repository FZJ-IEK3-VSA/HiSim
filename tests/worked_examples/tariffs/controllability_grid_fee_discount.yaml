  standing_charge_in_euro_per_year: 150
expected:
  marginal_price_components_in_euro_per_kwh:
    value: 0.100000
    abs_tol: 0.000001
    derivation: "grid_fee_in_euro_per_kwh*(1-grid_fee_reduction_share)+taxes_and_levies_in_euro_per_kwh"
    note: "the discount reduces the grid fee before it enters the marginal price"
  energy_working_in_euro:
    value: 1920.00
    abs_tol: 0.01
    derivation: "energy_bought_in_kwh*(working_price_in_euro_per_kwh+marginal_price_components_in_euro_per_kwh)"
