name: "controllability_grid_fee_discount"
group: "tariffs"
spec_section: "8.2"
computed_by: "Claude draft + LibreOffice recalculation, 2026-08-12"
description: "A controllable consumption device (section 14a EnWG style) earns a 60 % reduction of the grid fee. The discount changes the additive per-kWh components only: the effective grid fee is 40 % of the list fee, and the working cost is the volume times energy price plus reduced grid fee plus taxes."
inputs:
